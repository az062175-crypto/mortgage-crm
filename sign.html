  .center{text-align:center;padding:60px 16px;color:var(--muted)}
  #pages{margin-top:12px}
  .pg{position:relative;margin:0 auto 14px;background:#fff;border:1px solid #e6dccf;border-radius:6px;box-shadow:0 2px 10px rgba(60,30,20,.1);overflow:hidden}
  .pg canvas{display:block;width:100%;height:auto}
  .fld{position:absolute;display:flex;align-items:center;justify-content:center;border:2px dashed var(--brand);background:rgba(192,105,92,.10);border-radius:4px;color:var(--brand);font-weight:700;overflow:hidden;white-space:nowrap;cursor:pointer;line-height:1}
  .fld.filled{background:rgba(255,255,255,.55);border-color:rgba(47,122,70,.55);color:#0b2a6b}
  .fld img{width:100%;height:100%;object-fit:contain}

  input[type=text],input[type=date]{width:100%;padding:11px 12px;border:1px solid #e2d6c8;border-radius:10px;font:inherit;background:#fff}
  input:focus{outline:2px solid var(--brand);outline-offset:1px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:560px){.row2{grid-template-columns:1fr}}
  .sigpad{width:100%;height:190px;border:2px dashed #d9b9b2;border-radius:12px;background:#fff;touch-action:none;display:block;cursor:crosshair}
  button{font:inherit;cursor:pointer}
  .btn{background:linear-gradient(135deg,#d4857a,#c0695c);color:#fff;border:none;border-radius:12px;padding:13px 22px;font-size:18px;font-weight:800;box-shadow:0 3px 8px rgba(192,105,92,.3);width:100%;margin-top:16px}
  .btn:disabled{opacity:.6;cursor:wait}
  .btn.ghost{background:#fff;color:var(--brand);border:2px solid var(--brand);box-shadow:none;margin-top:8px}
  button.link{background:none;border:none;color:var(--brand);font-size:15px;font-weight:600;text-decoration:underline;padding:0}
  .err{color:var(--err);font-weight:700;margin-top:10px;min-height:1.2em}
  .chk{display:flex;gap:10px;align-items:flex-start;font-weight:400;margin-top:14px}
  .chk input{width:22px;height:22px;margin-top:3px;flex:0 0 auto}
  .ok{background:#f1f7f2;border:1px solid #cfe3d4;color:#255f37;border-radius:14px;padding:14px 16px;font-weight:700}
  .bfoot{max-width:860px;margin:6px auto 28px;padding:0 16px}
  .bfoot .in{border-top:1px solid rgba(192,105,92,.3);padding-top:12px;display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center;font-size:13.5px;color:var(--muted)}
  .bfoot a{color:var(--brand);text-decoration:none;font-weight:600;direction:ltr;unicode-bidi:embed}
</style>

<script>
var SB_URL='https://pfimmngjgkgzjjhemjdy.supabase.co';
var SB_KEY='sb_publishable_iOafusxiYK5ZBPqEb3IwOQ_jijlKgvO';
var Q=new URLSearchParams(location.search);
var TOKEN=(Q.get('t')||'').trim(), ID=(Q.get('d')||'').trim();
var D=null, docBytes=null, FIELDS=[], META=null, USED=[0], S=[{},{}], V={date:''};
var FONT='Assistant, Arial, "Noto Sans Hebrew", sans-serif';

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];});}
function $(id){return document.getElementById(id);}
async function rpc(fn,body){
  var r=await fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok)throw new Error('http '+r.status);
  return r.json();
}
function b64ToBytes(b){var s=atob(b),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
function bytesToB64(u){var s='',C=0x8000;for(var i=0;i<u.length;i+=C)s+=String.fromCharCode.apply(null,u.subarray(i,i+C));return btoa(s);}
function fmtDate(v){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(v||'');return m?m[3]+'/'+m[2]+'/'+m[1]:(v||'');}
function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function fail(msg){$('app').innerHTML='<div class="center">'+esc(msg)+'</div>';}
function download(bytes,name){var u=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));var a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){a.remove();URL.revokeObjectURL(u);},1500);}

async function load(){
  if(!TOKEN||!/^[0-9a-f-]{36}$/i.test(ID)){fail('הקישור אינו תקין.');return;}
  try{
    D=await rpc('sign_get',{p_id:ID,p_token:TOKEN});
    if(!D||!D.id){fail('המסמך לא נמצא, בוטל, או שהקישור אינו פעיל. פנה ליועץ שלך.');return;}
    if(D.status==='canceled'){fail('בקשת החתימה בוטלה. פנה ליועץ שלך.');return;}
    if(!D.file){fail('המסמך אינו זמין. פנה ליועץ שלך.');return;}
    docBytes=b64ToBytes(D.file);
    if(D.status==='signed'){showDone(docBytes,true);return;}
    FIELDS=(D.fields||[]).filter(function(f){return f.type!=='meta';});
    META=(D.fields||[]).filter(function(f){return f.type==='meta';})[0]||null;
    USED=[];FIELDS.forEach(function(f){var g=f.signer===1?1:0;if(USED.indexOf(g)<0)USED.push(g);});USED.sort();if(!USED.length)USED=[0];
    for(var i=0;i<2;i++){var pp=(META&&META.people&&META.people[i])||{};S[i]={name:pp.name||'',idNumber:pp.idNumber||'',address:pp.address||'',sigData:null,sigImg:null};}
    V.date=today();
    buildForm();
    await renderPages();
  }catch(e){fail('לא הצלחנו לטעון. נסה לרענן את הדף.');}
}

function showDone(bytes,already){
  var fn=(D.title||'מסמך')+' - חתום.pdf';
  $('app').innerHTML='<h1>'+esc(D.title)+'</h1><div class="card"><div class="ok">'+(already?'המסמך כבר נחתם. תודה.':'המסמך נחתם ונשלח. תודה!')+'</div>'+
    '<button class="btn" id="dlBtn">הורדת עותק חתום (PDF)</button>'+
    '<div class="muted" style="margin-top:12px">העותק החתום זמין גם בקישור האישי שלך, באזור "מסמכים לחתימה".</div></div>';
  $('dlBtn').onclick=function(){download(bytes,fn);};
}

function signerLbl(g){return USED.length>1?'לווה '+(g+1):'';}
function buildForm(){
  var cards=USED.map(function(g){
    var lb=signerLbl(g);
    return '<div class="card" id="formCard'+g+'"><h2>פרטי החותם'+(lb?' — '+lb:'')+'</h2>'+
     '<div class="row2"><div><label for="fName'+g+'">שם מלא</label><input type="text" id="fName'+g+'" autocomplete="name" value="'+esc(S[g].name)+'"></div>'+
     '<div><label for="fId'+g+'">תעודת זהות</label><input type="text" id="fId'+g+'" inputmode="numeric" maxlength="9" autocomplete="off" value="'+esc(S[g].idNumber)+'"></div></div>'+
     '<label for="fAddr'+g+'">כתובת</label><input type="text" id="fAddr'+g+'" autocomplete="street-address" value="'+esc(S[g].address)+'">'+
     '<label>חתימה'+(lb?' של '+lb:'')+' (בעכבר או באצבע)</label><canvas id="sigpad'+g+'" class="sigpad"></canvas>'+
     '<div style="margin-top:6px"><button class="link" id="clr'+g+'">ניקוי חתימה</button></div></div>';
  }).join('');
  $('app').innerHTML='<h1>'+esc(D.title)+'</h1>'+
   '<div class="card"><h2>איך חותמים?</h2><div class="muted">1. קראו את המסמך למטה. המקומות שבהם יופיעו החתימה והפרטים מסומנים במסגרת מקווקווה.<br>2. בדקו את הפרטים וחתמו בתיבה שמתחת למסמך. הם יופיעו במסמך מיד.<br>3. לחצו "חתום ושלח".</div>'+
   '<button class="btn ghost" id="jump">קפיצה לטופס החתימה</button></div>'+
   '<div id="pages"><div class="center">טוען את המסמך…</div></div>'+cards+
   '<div class="card"><label for="fDate">תאריך</label><input type="date" id="fDate" value="'+today()+'">'+
   '<div class="err" id="err"></div><button class="btn" id="go">חתום ושלח</button></div>';
  $('jump').onclick=function(){$('formCard'+USED[0]).scrollIntoView({behavior:'smooth'});};
  $('fDate').addEventListener('input',function(){V.date=$('fDate').value;paintFields();});
  USED.forEach(function(g){
    var map={name:'fName',idNumber:'fId',address:'fAddr'};
    Object.keys(map).forEach(function(k){$(map[k]+g).addEventListener('input',function(){S[g][k]=$(map[k]+g).value;paintFields();});});
    $('clr'+g).onclick=function(){S[g].sigData=null;S[g].sigImg=null;initPad(g);paintFields();};
    initPad(g);
  });
  $('go').onclick=submit;
  window.addEventListener('resize',paintFields);
}

function initPad(g){
  var c=$('sigpad'+g),r=c.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
  c.width=Math.round(r.width*dpr);c.height=Math.round(r.height*dpr);
  var x=c.getContext('2d');x.lineWidth=3.2*dpr;x.lineCap='round';x.lineJoin='round';x.strokeStyle='#0b2a6b';
  var down=false,last=null,drew=false;
  function pt(e){var b=c.getBoundingClientRect();return {x:(e.clientX-b.left)*c.width/b.width,y:(e.clientY-b.top)*c.height/b.height};}
  c.onpointerdown=function(e){down=true;last=pt(e);drew=false;try{c.setPointerCapture(e.pointerId);}catch(_){}e.preventDefault();};
  c.onpointermove=function(e){if(!down)return;var p=pt(e);x.beginPath();x.moveTo(last.x,last.y);x.lineTo(p.x,p.y);x.stroke();last=p;drew=true;e.preventDefault();};
  function end(){if(!down)return;down=false;if(drew){var sd=c.toDataURL('image/png');S[g].sigData=sd;var im=new Image();im.onload=function(){S[g].sigImg=im;paintFields();};im.src=sd;}}
  c.onpointerup=end;c.onpointercancel=end;c.onpointerleave=end;
}

var PAGES=[];
async function renderPages(){
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  var pdf=await pdfjsLib.getDocument({data:docBytes.slice()}).promise;
  var host=$('pages');host.innerHTML='';PAGES=[];
  var cssW=Math.min(host.clientWidth||800,820), dpr=Math.min(window.devicePixelRatio||1,2);
  for(var n=1;n<=pdf.numPages;n++){
    var page=await pdf.getPage(n),v1=page.getViewport({scale:1}),sc=cssW*dpr/v1.width,vp=page.getViewport({scale:sc});
    var wrap=document.createElement('div');wrap.className='pg';wrap.style.width=cssW+'px';
    var cv=document.createElement('canvas');cv.width=Math.round(vp.width);cv.height=Math.round(vp.height);
    wrap.appendChild(cv);host.appendChild(wrap);
    await page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
    PAGES.push(wrap);
  }
  FIELDS.forEach(function(f){
    var w=PAGES[f.page];if(!w)return;
    var d=document.createElement('div');d.className='fld';d.dataset.id=f.id;
    d.style.cssText+='left:'+(f.x*100)+'%;top:'+(f.y*100)+'%;width:'+(f.w*100)+'%;height:'+(f.h*100)+'%';
    d.onclick=function(){var g=f.signer===1?1:0;var t=f.type==='signature'?$('sigpad'+g):(f.type==='date'?$('fDate'):$(({name:'fName',idNumber:'fId',address:'fAddr'})[f.type]+g));if(t){t.scrollIntoView({behavior:'smooth',block:'center'});if(t.focus&&f.type!=='signature')t.focus();}};
    w.appendChild(d);
  });
  paintFields();
}

var LABELS={signature:'חתימה כאן',date:'תאריך',name:'שם מלא',idNumber:'ת"ז',address:'כתובת'};
function sg(f){return f.signer===1?1:0;}
function fieldText(f){return f.type==='date'?fmtDate(V.date):S[sg(f)][f.type];}
function paintFields(){
  FIELDS.forEach(function(f){
    var el=document.querySelector('.fld[data-id="'+f.id+'"]');if(!el)return;
    var h=el.clientHeight||20;el.style.fontSize=Math.max(9,h*0.55)+'px';
    if(f.type==='signature'){
      if(S[sg(f)].sigData){el.innerHTML='<img alt="" src="'+S[sg(f)].sigData+'">';el.classList.add('filled');}
      else{el.textContent=LABELS.signature;el.classList.remove('filled');}
    }else{
      var t=fieldText(f);
      if(t){el.textContent=t;el.classList.add('filled');}else{el.textContent=LABELS[f.type];el.classList.remove('filled');}
    }
  });
}

function fieldPng(f,pw,ph){
  var bw=Math.max(40,Math.round(f.w*pw*3)),bh=Math.max(20,Math.round(f.h*ph*3));
  var c=document.createElement('canvas');c.width=bw;c.height=bh;var x=c.getContext('2d');
  if(f.type==='signature'){
    var im=S[sg(f)].sigImg,s=Math.min(bw/im.width,bh/im.height),w=im.width*s,h=im.height*s;
    x.drawImage(im,(bw-w)/2,(bh-h)/2,w,h);
  }else{
    var t=fieldText(f)||'',fs=bh*0.62;
    x.direction='rtl';x.textAlign='center';x.textBaseline='middle';x.fillStyle='#0b2a6b';
    x.font='600 '+fs+'px '+FONT;
    while(fs>8&&x.measureText(t).width>bw*0.96){fs-=2;x.font='600 '+fs+'px '+FONT;}
    x.fillText(t,bw/2,bh/2+bh*0.03);
  }
  return c.toDataURL('image/png');
}

async function sha256Hex(bytes){var h=await crypto.subtle.digest('SHA-256',bytes),a=new Uint8Array(h),s='';for(var i=0;i<a.length;i++)s+=('0'+a[i].toString(16)).slice(-2);return s;}

function auditPng(hash,nowTxt){
  var W=1190,H=1684,c=document.createElement('canvas');c.width=W;c.height=H;var x=c.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,W,H);x.direction='rtl';x.textAlign='right';x.textBaseline='alphabetic';
  var R=W-100,y=150;
  x.fillStyle='#c0695c';x.font='800 54px '+FONT;x.fillText('אישור חתימה אלקטרונית',R,y);y+=26;
  x.fillStyle='#e6c6c0';x.fillRect(100,y,W-200,3);y+=56;
  function line(k,v){x.fillStyle='#7a6a62';x.font='600 28px '+FONT;x.fillText(k+':',R,y);x.fillStyle='#111';x.font='600 32px '+FONT;x.fillText(v||'-',R-250,y);y+=52;}
  line('מסמך',D.title);line('תאריך שהוזן',fmtDate(V.date));line('נחתם בתאריך ושעה',nowTxt);y+=14;
  USED.forEach(function(g){
    var lb=signerLbl(g);
    if(lb){x.fillStyle='#c0695c';x.font='800 34px '+FONT;x.fillText(lb,R,y);y+=50;}
    line('שם החותם',S[g].name);line('תעודת זהות',S[g].idNumber);line('כתובת',S[g].address);
    var bw=460,bh=150;x.strokeStyle='#d9b9b2';x.lineWidth=2;x.strokeRect(R-bw,y,bw,bh);
    var im=S[g].sigImg,sc=Math.min((bw-20)/im.width,(bh-20)/im.height),w=im.width*sc,h=im.height*sc;
    x.drawImage(im,R-bw+(bw-w)/2,y+(bh-h)/2,w,h);y+=bh+50;
  });
  x.fillStyle='#7a6a62';x.font='600 26px '+FONT;x.fillText('SHA-256 של המסמך המקורי (לאימות שלא שונה)',R,y);y+=40;
  x.direction='ltr';x.textAlign='right';x.fillStyle='#111';x.font='500 24px "Courier New",monospace';
  x.fillText(hash.slice(0,32),R,y);y+=34;x.fillText(hash.slice(32),R,y);
  x.direction='rtl';x.fillStyle='#7a6a62';x.font='400 24px '+FONT;
  x.fillText('החתימה בוצעה באמצעות קישור אישי שנשלח לחותם. דף זה מצורף למסמך כחלק ממנו.',R,H-70);
  return c.toDataURL('image/png');
}

async function submit(){
  var err=$('err');err.textContent='';
  V.date=$('fDate').value;
  for(var u=0;u<USED.length;u++){var g=USED[u],lb=signerLbl(g),pre=lb?lb+': ':'';
    S[g].name=$('fName'+g).value.trim();S[g].idNumber=$('fId'+g).value.trim();S[g].address=$('fAddr'+g).value.trim();
    if(S[g].name.length<2){err.textContent=pre+'נא למלא שם מלא.';$('fName'+g).focus();return;}
    if(!/^\d{5,9}$/.test(S[g].idNumber)){err.textContent=pre+'נא למלא תעודת זהות (ספרות בלבד).';$('fId'+g).focus();return;}
    if(S[g].address.length<3){err.textContent=pre+'נא למלא כתובת.';$('fAddr'+g).focus();return;}
    if(!S[g].sigData||!S[g].sigImg){err.textContent=pre+'נא לחתום בתיבת החתימה.';return;}
  }
  if(!V.date){err.textContent='נא לבחור תאריך.';return;}
  var btn=$('go');btn.disabled=true;btn.textContent='מכין את המסמך החתום…';
  try{
    var pdf=await PDFLib.PDFDocument.load(docBytes,{ignoreEncryption:true}),pages=pdf.getPages();
    for(var i=0;i<FIELDS.length;i++){
      var f=FIELDS[i],pg=pages[f.page];if(!pg)continue;
      var sz=pg.getSize(),img=await pdf.embedPng(fieldPng(f,sz.width,sz.height));
      pg.drawImage(img,{x:f.x*sz.width,y:sz.height-(f.y+f.h)*sz.height,width:f.w*sz.width,height:f.h*sz.height});
    }
    var now=new Date(),nowTxt=now.toLocaleString('he-IL',{dateStyle:'short',timeStyle:'medium'});
    var hash=await sha256Hex(docBytes);
    var out=await pdf.save();
    btn.textContent='שולח…';
    var r=await rpc('sign_submit',{p_id:ID,p_token:TOKEN,p_signed_b64:bytesToB64(out),
      p_signer:{name:S[USED[0]].name,idNumber:S[USED[0]].idNumber,address:S[USED[0]].address,date:fmtDate(V.date),at:now.toISOString(),ua:navigator.userAgent.slice(0,200),signers:USED.map(function(g){return {label:signerLbl(g)||'לווה 1',name:S[g].name,idNumber:S[g].idNumber,address:S[g].address};})},p_hash:hash});
    if(!r||!r.ok)throw new Error('submit');
    notifyDelivery();
    showDone(out,false);
  }catch(e){
    btn.disabled=false;btn.textContent='חתום ושלח';
    err.textContent='השליחה נכשלה. בדוק חיבור ונסה שוב. אם זה חוזר, פנה ליועץ.';
    if(window.console)console.error(e);
  }
}

// הודעה ל-Apps Script (מייל + Drive). הכתובת נשמרת אצל היועץ ב-CRM ומגיעה עם בקשת החתימה.
function notifyDelivery(){
  var u=D.hook||'';
  if(!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(u))return;
  try{fetch(u,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({id:ID,token:TOKEN})}).catch(function(){});}catch(_){}
}
load();
</script>
