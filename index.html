function _formDenomForLtv() {
  const purposes = Array.from(document.querySelectorAll('.fPurposeChk:checked')).map(c => c.value);
  const isMachirLm = purposes.includes('מחיר למשתכן');
  const anyContract = purposes.some(p => CONTRACT_PRICE_PURPOSES.has(p));
  const contract = parseFormattedNum(document.getElementById('fPropVal').value);
  const apprEl = document.getElementById('fAppraiserVal');
  const appraiser = apprEl ? parseFormattedNum(apprEl.value) : 0;
  if (isMachirLm && appraiser > 0) return { denom: appraiser, label: 'שווי לפי שמאות', isMachir: true, contract, appraiser };
  // Non-contract deal (renovation/expansion/general/self-build/refinance) — appraisal overrides customer estimate
  if (!anyContract && appraiser > 0) return { denom: appraiser, label: 'שווי לפי שמאות', isMachir: false, contract, appraiser };
  // Contract deal with appraisal — use min (regulator rule)
  if (anyContract && appraiser > 0 && contract > 0) return { denom: Math.min(appraiser, contract), label: 'מינימום בין חוזה לשמאות', isMachir: false, contract, appraiser };
  return { denom: contract, label: 'מחיר חוזה/שווי נכס', isMachir: false, contract, appraiser };
}

function updateFinPct() {
  const { denom, label, isMachir, contract } = _formDenomForLtv();
  const l = parseFormattedNum(document.getElementById('fLoanAmt').value);
  const existing = parseFormattedNum((document.getElementById('fExistingMortgage')||{}).value || '');
  const total = l + existing;
  const disp = document.getElementById('finPctDisplay');
  const _pctEl = document.getElementById('fLoanPct');
  // The "אחוז" field next to loan amount always reflects the COMBINED LTV
  // (existing mortgage + new loan) since that is what regulator and downstream logic care about
  if (_pctEl && document.activeElement !== _pctEl) {
    if (denom > 0 && total > 0) _pctEl.value = Math.round((total / denom) * 1000) / 10;
    else _pctEl.value = '';
  }
  if (denom <= 0) { disp.innerHTML = 'אחוז מימון: —'; disp.style.background = '#f8fafc'; disp.style.color = 'var(--muted)'; return; }
  const pctNew = Math.round((l / denom) * 1000) / 10;
  const pctExisting = existing > 0 ? Math.round((existing / denom) * 1000) / 10 : 0;
  const pctTotal = Math.round((total / denom) * 1000) / 10;
  const displayPct = existing > 0 ? pctTotal : pctNew;
  const color = displayPct <= 60 ? '#16a34a' : displayPct <= 75 ? '#f59e0b' : '#dc2626';
  let extra = '';
  if (existing > 0) {
    extra += `<div style="font-size:12px;margin-top:4px;color:#78350f;background:#fef3c7;padding:6px 8px;border-radius:6px;line-height:1.6">
      <div>• אחוז מימון קיים: <strong>${pctExisting}%</strong> (${fmtMoney(existing)})</div>
      <div>• אחוז מימון חדש: <strong>${pctNew}%</strong> (${fmtMoney(l)})</div>
      <div>• סה"כ מצטבר: <strong style="color:${color}">${pctTotal}%</strong> (${fmtMoney(total)} מתוך ${fmtMoney(denom)})</div>
    </div>`;
  }
  if (isMachir && contract > 0) {
    const equityLeft = contract - l;
    const equityOk = equityLeft >= 100000;
    extra += `<div style="font-size:12px;margin-top:4px;color:${equityOk?'#16a34a':'#dc2626'}">הון עצמי (חוזה − הלוואה): <strong>${fmtMoney(equityLeft)}</strong> ${equityOk?'✓':'⚠️ נדרש ≥100,000'}</div>`;
  }
  // Regulator LTV check — inline warning if combined LTV exceeds limit for selected apartment type
  const aptType = (document.querySelector('input[name="fApartmentType"]:checked') || {}).value || '';
  if (aptType && APARTMENT_LTV_LIMIT[aptType]) {
    const limit = APARTMENT_LTV_LIMIT[aptType];
    const aptLabel = APARTMENT_LABEL[aptType];
    if (displayPct > limit) {
      const maxTotal = Math.floor((denom * limit / 100) / 1000) * 1000;
      const maxNewLoan = Math.max(0, maxTotal - existing);
      const diff = l - maxNewLoan;
      extra += `<div style="margin-top:6px;padding:10px 12px;background:#fee2e2;border:2px solid #dc2626;border-radius:8px;font-size:12px;color:#7f1d1d;line-height:1.6">
        <div style="font-weight:800;font-size:13px;margin-bottom:4px">⚠️ חריגה מהרגולציה — ${aptLabel} (מגבלה: ${limit}%)</div>
        <div>אחוז מימון${existing > 0 ? ' (כולל קיים)' : ''}: <strong style="color:#dc2626">${displayPct}%</strong> · מותר: <strong>${limit}%</strong></div>
        <div style="margin-top:4px;padding-top:4px;border-top:1px dashed #fca5a5">
          <div>💡 מקסימום להגשה עכשיו: <strong>${fmtMoney(maxNewLoan)}</strong></div>
          ${diff > 0 ? `<div>יש להוריד: <strong>${fmtMoney(diff)}</strong> מהסכום המבוקש</div>` : ''}
        </div>
      </div>`;
    }
  }
  const label2 = existing > 0 ? label + ' · כולל משכנתא קיימת' : label;
  disp.innerHTML = `אחוז מימון (לפי ${label2}): <strong style="font-size:18px;color:${color}">${displayPct}%</strong> <span style="color:var(--muted);font-size:12px">(${fmtMoney(existing > 0 ? total : l)} מתוך ${fmtMoney(denom)})</span>${extra}`;
  disp.style.background = color + '15';
  disp.style.color = 'var(--text)';
}

// Called from the existing-mortgage panel — reformats amount & refreshes the finPct display.
function updateExistingMortgageSummary() {
  const inp = document.getElementById('fExistingMortgage');
  if (inp && document.activeElement !== inp) {
    onMoneyInput(inp);
  } else if (inp) {
    onMoneyInput(inp);
  }
  const sum = document.getElementById('fExistingMortgageSummary');
  const bd = _formExistingMortgageBreakdown();
  if (sum) {
    if (bd && bd.existing > 0 && bd.denom > 0) {
      sum.style.display = '';
      sum.innerHTML = '<div>יתרה קיימת: <strong>' + fmtMoney(bd.existing) + '</strong> · אחוז מימון קיים: <strong>' + bd.existingPct + '%</strong></div>' +
                      '<div>מבוקש עכשיו: <strong>' + fmtMoney(bd.newLoan) + '</strong> · אחוז חדש: <strong>' + bd.newPct + '%</strong></div>' +
                      '<div style="margin-top:4px;padding-top:4px;border-top:1px dashed #fbbf24">סה"כ מימון מצטבר: <strong style="font-size:14px">' + bd.totalPct + '%</strong> (' + fmtMoney(bd.existing + bd.newLoan) + ' מתוך ' + fmtMoney(bd.denom) + ')</div>';
    } else {
      sum.style.display = 'none';
    }
  }
  if (typeof updateFinPct === 'function') updateFinPct();
}

function _formExistingMortgageBreakdown() {
  const { denom } = _formDenomForLtv();
  const existing = parseFormattedNum((document.getElementById('fExistingMortgage')||{}).value || '');
  const newLoan = parseFormattedNum((document.getElementById('fLoanAmt')||{}).value || '');
  if (denom <= 0) return null;
  const r = n => Math.round(n * 1000) / 10;
  return {
    denom, existing, newLoan,
    existingPct: r(existing / denom),
    newPct: r(newLoan / denom),
    totalPct: r((existing + newLoan) / denom)
  };
}

function onLoanAmtInput() {
  const amtEl = document.getElementById('fLoanAmt');
  onMoneyInput(amtEl);
  const { denom } = _formDenomForLtv();
  const l = parseFormattedNum(amtEl.value);
  const existing = parseFormattedNum((document.getElementById('fExistingMortgage')||{}).value || '');
  const pctEl = document.getElementById('fLoanPct');
  if (pctEl) {
    if (denom > 0 && (l + existing) > 0) pctEl.value = Math.round(((l + existing) / denom) * 1000) / 10;
    else pctEl.value = '';
  }
  updateFinPct();
}

function onLoanPctInput() {
  // The pct field is the COMBINED LTV (existing + new). Derive new loan = (pct * denom / 100) - existing
  const { denom } = _formDenomForLtv();
  const pct = Number(document.getElementById('fLoanPct').value) || 0;
  const existing = parseFormattedNum((document.getElementById('fExistingMortgage')||{}).value || '');
  const amtEl = document.getElementById('fLoanAmt');
  if (denom > 0 && pct > 0 && amtEl) {
    const total = Math.round(denom * pct / 100);
    const newLoan = Math.max(0, total - existing);
    amtEl.value = newLoan.toLocaleString('he-IL') + ' ₪';
  }
  updateFinPct();
}

function submitNewClient() {
  // Read split name fields (new UI) and compose full name as "family first"
  const family1 = (document.getElementById('fFamily1')?.value || '').trim();
  const first1 = (document.getElementById('fFirst1')?.value || '').trim();
  const name1 = (family1 || first1) ? (family1 + (family1 && first1 ? ' ' : '') + first1) : (document.getElementById('fName1').value || '').trim();
  // Mirror the composed name onto the hidden fName1 so legacy callers still work
  const _fn1 = document.getElementById('fName1'); if (_fn1) _fn1.value = name1;
  const marital = document.getElementById('fMarital').value;
  const emp1 = Array.from(document.querySelectorAll('.fEmpChk1:checked')).map(c => c.value);
  const purposes = Array.from(document.querySelectorAll('.fPurposeChk:checked')).map(c => c.value);
  const purpose = purposes[0] || '';
  const propValInput = document.getElementById('fPropVal');
  const propValRaw = parseFormattedNum(propValInput.value);
  // If the field is in "appraiser mode" (non-contract deal with appraisal), the entered amount
  // is the appraiser value — preserve the original customer estimate in propertyValue.
  const _editing = (typeof editingClientId !== 'undefined' && editingClientId) ? state.clients.find(x => x.id === editingClientId) : null;
  const propValIsAppraiser = propValInput.dataset.mode === 'appraiser' && !!_editing;
  const propVal = propValIsAppraiser ? (Number(_editing.propertyValue) || 0) : propValRaw;
  const appraiserFromMainField = propValIsAppraiser ? propValRaw : null;
  const loanAmt = parseFormattedNum(document.getElementById('fLoanAmt').value);
  const missing = [];
  if (!name1) missing.push('שם מלא');
  if (!marital) missing.push('מצב משפחתי');
  if (emp1.length === 0) missing.push('סוגי הכנסה');
  if (purposes.length === 0) missing.push('מטרת הלוואה');
  if (propVal <= 0) missing.push('שווי נכס');
  if (loanAmt <= 0) missing.push('סכום מבוקש');
  if (missing.length) { alert('חסרים שדות חובה:\n· ' + missing.join('\n· ')); return; }
  const isCouple = marital === 'married';
  const parseList = s => (s || '').split(',').map(x => x.trim()).filter(Boolean);
  const parseBankAccounts = which => {
    try { return JSON.parse(document.getElementById('fBankAccountsData' + which)?.value || '[]'); } catch(e) { return []; }
  };
  const borrowers = [{
    role: isCouple ? 'בעל' : 'לווה',
    name: name1,
    familyName: family1,
    firstName: first1,
    idNumber: document.getElementById('fId1').value.trim(),
    dob: (document.getElementById('fDob1')?.value || '').trim(),
    idIssueDate: (document.getElementById('fIdIssue1')?.value || '').trim(),
    employmentTypes: emp1,
    employmentType: emp1.join(' + '),
    employers: parseList(document.getElementById('fEmployers1')?.value),
    employersByType: (function(){ try { return JSON.parse(document.getElementById('fEmployersData1')?.value || '{}') || {}; } catch(e) { return {}; } })(),
    gemachs: parseList(document.getElementById('fGemachs1')?.value),
    bankAccounts: parseBankAccounts('1'),
    hasGemachs: !!document.getElementById('fHasGemachs1')?.checked,
    incomeTypes: [],
    customIncome: document.getElementById('fCustIncome1').value.trim()
  }];
  if (isCouple) {
    const family2 = (document.getElementById('fFamily2')?.value || '').trim();
    const first2 = (document.getElementById('fFirst2')?.value || '').trim();
    const name2 = (family2 || first2) ? (family2 + (family2 && first2 ? ' ' : '') + first2) : (document.getElementById('fName2').value || '').trim();
    const _fn2 = document.getElementById('fName2'); if (_fn2) _fn2.value = name2;
    const emp2 = Array.from(document.querySelectorAll('.fEmpChk2:checked')).map(c => c.value);
    borrowers.push({
      role: 'אשה',
      name: name2,
      familyName: family2,
      firstName: first2,
      idNumber: document.getElementById('fId2').value.trim(),
      phone: (document.getElementById('fPhone2')?.value || '').trim(),
      email: (document.getElementById('fEmail2')?.value || '').trim(),
      dob: (document.getElementById('fDob2')?.value || '').trim(),
      idIssueDate: (document.getElementById('fIdIssue2')?.value || '').trim(),
      employmentTypes: emp2,
      employmentType: emp2.length ? emp2.join(' + ') : 'ללא הכנסות',
      employers: parseList(document.getElementById('fEmployers2')?.value),
      employersByType: (function(){ try { return JSON.parse(document.getElementById('fEmployersData2')?.value || '{}') || {}; } catch(e) { return {}; } })(),
      gemachs: [],
      bankAccounts: parseBankAccounts('2'),
      hasGemachs: false,
      incomeTypes: [],
      customIncome: document.getElementById('fCustIncome2').value.trim()
    });
  }
  const createdDateStr = document.getElementById('fCreatedDate').value;
  const todayStr = todayLocal();
  const createdAtISO = (createdDateStr && createdDateStr <= todayStr)
    ? new Date(createdDateStr + 'T09:00:00').toISOString()
    : new Date().toISOString();

  const data = {
    name: name1 + (isCouple && borrowers[1].name ? ' ו' + borrowers[1].name : ''),
    idNumber: borrowers[0].idNumber,
    phone: document.getElementById('fPhone').value.trim(),
    email: (document.getElementById('fEmail')?.value || '').trim(),
    targetDate: (document.getElementById('fTargetDate')?.value || '').trim(),
    jointAccount: !!(document.getElementById('fJointAccount')?.checked),
    maritalStatus: marital,
    borrowers: borrowers,
    purpose: purpose,
    purposes: purposes,
    bankerId: document.getElementById('fBanker').value,
    propertyValue: propVal,
    appraiserValue: (function(){
      // If main field is in appraiser mode, take the value from there
      if (appraiserFromMainField !== null && appraiserFromMainField > 0) return appraiserFromMainField;
      // Otherwise, dedicated appraiser field only applies to מחיר למשתכן
      const el = document.getElementById('fAppraiserVal');
      const v = el ? parseFormattedNum(el.value) : 0;
      if (purposes.includes('מחיר למשתכן') && v > 0) return v;
      // For an editing client, preserve their existing appraiser value if the main field wasn't in appraiser mode
      if (_editing && _editing.appraiserValue) return Number(_editing.appraiserValue);
      return undefined;
    })(),
    loanAmount: loanAmt,
    existingMortgage: parseFormattedNum((document.getElementById('fExistingMortgage')||{}).value || '') || 0,
    existingMortgageBank: ((document.getElementById('fExistingMortgageBank')||{}).value || '').trim(),
    isRented: document.getElementById('fIsRented').checked,
    hasBankAccompaniment: !!(document.getElementById('fBankAccomp') && document.getElementById('fBankAccomp').checked),
    refinanceType: (document.querySelector('input[name="fRefinanceType"]:checked') || {}).value || '',
    registrationType: document.getElementById('fRegistrationType').value,
    propertyAddress: document.getElementById('fPropAddress').value.trim(),
    propertyBuilding: (document.getElementById('fPropBuilding')?.value || '').trim(),
    propertyApartment: (document.getElementById('fPropApartment')?.value || '').trim(),
    propertyCity: (document.getElementById('fPropCity')?.value || '').trim(),
    projectName: (document.getElementById('fProjectName')?.value || '').trim(),
    projectBuilding: (document.getElementById('fProjectBuilding')?.value || '').trim(),
    projectApartment: (document.getElementById('fProjectApartment')?.value || '').trim(),
    contractSignDate: (document.getElementById('fContractSignDate')?.value || '').trim(),
    contractPaymentDate: (document.getElementById('fContractPaymentDate')?.value || '').trim(),
    apartmentType: (document.querySelector('input[name="fApartmentType"]:checked') || {}).value || '',
    guarantors: document.getElementById('fHasGuarantors').checked ? collectGuarantors() : [],
    dealDetails: collectDealDetails(),
    notes: document.getElementById('fNotes').value.trim(),
  };

  if (editingClientId) {
    const c = state.clients.find(x => x.id === editingClientId);
    if (!c) return;
    const oldPurposes = (c.purposes || []).slice().sort().join('|');
    const newPurposes = (data.purposes || []).slice().sort().join('|');
    const purposesChanged = oldPurposes !== newPurposes;
    const oldRegType = c.registrationType || '';
    const newRegType = data.registrationType || '';
    const regTypeChanged = oldRegType !== newRegType;
    const oldIsRented = !!c.isRented;
    // Preserve income/data on borrowers + guarantors that the main edit form does NOT collect (jobIncomes,
    // employersByType history, etc.) so editing the client doesn't wipe them.
    const _preserveFields = ['jobIncomes', 'monthlyIncomes'];
    const _oldBrws = c.borrowers || [];
    (data.borrowers || []).forEach((newB, i) => {
      const oldB = _oldBrws[i];
      if (!oldB) return;
      _preserveFields.forEach(f => { if (oldB[f] !== undefined && newB[f] === undefined) newB[f] = oldB[f]; });
    });
    const _oldGuars = c.guarantors || [];
    (data.guarantors || []).forEach((newG, i) => {
      // Guarantors are matched by index — same order preserves jobIncomes; if the order changed the user
      // will need to reopen the incomes editor to reassign.
      const oldG = _oldGuars[i];
      if (!oldG) return;
      _preserveFields.forEach(f => { if (oldG[f] !== undefined && newG[f] === undefined) newG[f] = oldG[f]; });
    });
    // Update all fields
    Object.assign(c, data);
    c.employmentType = borrowers[0].employmentType || '';
    // Auto-mark "ניידים של הלווים" as done if all borrowers now have phones
    const brws = c.borrowers || [];
    const allHavePhones = brws.length > 0 && brws.every(b => (b.phone && b.phone.trim()) || (c.phone && c.phone.trim()));
    if (allHavePhones) {
      let markedDone = false;
      c.tasks.forEach(t => {
        if (t.stage === 'submission' && t.title === 'ניידים של הלווים' && t.status !== 'done') {
          t.status = 'done'; t.done = true; t.doneAt = now();
          t.history = t.history || []; t.history.push({ status: 'done', at: now() });
          markedDone = true;
        }
      });
      // If we just marked the last remaining task done, auto-advance stage
      if (markedDone) autoAdvanceIfStageComplete(c);
    }
    // Recompute requiresAppraisal based on purposes + hasBankAccompaniment + refinanceType
    let requiresAppraisal = true;
    if (data.purposes.some(p => APPRAISAL_EXEMPT_PURPOSES.includes(p))) requiresAppraisal = false;
    if (data.purposes.includes('יד ראשונה') && data.hasBankAccompaniment) requiresAppraisal = false;
    if (data.purposes.some(p => p.indexOf('מיחזור') === 0) && data.refinanceType === 'internal') requiresAppraisal = false;
    c.requiresAppraisal = requiresAppraisal;
    // If client is currently at appraisal stage but no longer needs appraisal, move forward
    if (!requiresAppraisal && c.stage === 'appraisal') {
      moveStage(c, 'approval');
    }
    // Update createdAt/leadAt if user changed the date (only shift leadAt/stageEnteredAt if they were the original)
    if (createdDateStr) {
      const oldCreated = c.createdAt;
      c.createdAt = createdAtISO;
      if (c.leadAt === oldCreated) c.leadAt = createdAtISO;
      if (c.stageEnteredAt === oldCreated && c.stage === 'lead') c.stageEnteredAt = createdAtISO;
      if (Array.isArray(c.stageHistory) && c.stageHistory[0] && c.stageHistory[0].enteredAt === oldCreated) {
        c.stageHistory[0].enteredAt = createdAtISO;
      }
    }
    // Snapshot existing requirement statuses so we can restore them after re-seed
    const _reqStatusSnapshot = {};
    c.requirements.forEach(r => {
      const key = (r.section||'') + '::' + (r.dealType||'') + '::' + r.name;
      _reqStatusSnapshot[key] = { status: r.status, providedAt: r.providedAt };
    });
    const _restoreReqStatuses = () => {
      c.requirements.forEach(r => {
        const key = (r.section||'') + '::' + (r.dealType||'') + '::' + r.name;
        const prev = _reqStatusSnapshot[key];
        if (prev && prev.status && prev.status !== 'pending') {
          r.status = prev.status;
          if (prev.providedAt) r.providedAt = prev.providedAt;
        }
      });
    };
    // Refresh borrower + guarantor document requirements
    c.requirements = c.requirements.filter(r => !(r.stage === 'client' && (r.section === 'borrower' || r.section === 'guarantor' || !r.section)));
    const isCoupleNow = borrowers.length > 1;
    const jointAccountNow = c.jointAccount !== false;
    borrowers.forEach((b, idx) => {
      let suffix = '';
      if (isCoupleNow) {
        if (jointAccountNow && idx === 0) suffix = '';
        else suffix = ' — ' + (b.role || ('לווה ' + (idx+1)));
      }
      const skipAccountDocs = jointAccountNow && idx > 0;
      pushPersonDocs(c, b, suffix, undefined, { skipAccountDocs });
    });
    (c.guarantors || []).forEach((g, idx) => {
      const suffix = ' — ערב ' + (idx+1);
      pushPersonDocs(c, g, suffix, 'guarantor', { skipAccountDocs: !!g.jointAccount });
    });
    // Refresh deal requirements if purposes or isRented changed
    if (purposesChanged || oldIsRented !== !!c.isRented) {
      c.requirements = c.requirements.filter(r => r.section !== 'deal');
      c.tasks = c.tasks.filter(t => t.source !== 'registration' && t.source !== 'deal' && t.source !== 'appraisal-seed');
      seedDealDocsForPurposes(c);
      seedRegistrationDocs(c);
      seedAppraisalTasks(c);
      dedupRequirementsAndTasks(c);
    } else {
      // Refresh registration items separately when only registrationType changed
      const oldRegDocs = c.requirements.filter(r => r.dealType && r.dealType.startsWith('רישום נכס —'));
      const currentLabel = (REGISTRATION_DOCS[c.registrationType] || {}).label || '';
      const currentDealType = currentLabel ? ('רישום נכס — ' + currentLabel) : '';
      const hasMatch = oldRegDocs.length > 0 && oldRegDocs[0].dealType === currentDealType;
      if (!hasMatch) {
        c.requirements = c.requirements.filter(r => !(r.dealType && r.dealType.startsWith('רישום נכס —')));
        c.tasks = c.tasks.filter(t => t.source !== 'registration' && t.source !== 'appraisal-seed');
        seedRegistrationDocs(c);
        seedAppraisalTasks(c);
        dedupRequirementsAndTasks(c);
      }
    }
    // Refresh bank-stage tasks if purposes or registration type changed (preserve status of unchanged tasks)
    if (purposesChanged || regTypeChanged) {
      const oldBankStatuses = {};
      c.tasks.filter(t => t.stage === 'bank' && t.source === 'bank-seed').forEach(t => {
        oldBankStatuses[t.title] = { status: t.status, done: t.done, doneAt: t.doneAt, history: t.history };
      });
      c.tasks = c.tasks.filter(t => !(t.stage === 'bank' && t.source === 'bank-seed'));
      seedBankStageTasks(c);
      // Restore statuses for tasks that survived
      c.tasks.filter(t => t.stage === 'bank' && t.source === 'bank-seed').forEach(t => {
        const prev = oldBankStatuses[t.title];
        if (prev && prev.status && prev.status !== 'active') {
          t.status = prev.status; t.done = prev.done; t.doneAt = prev.doneAt; t.history = prev.history || t.history;
        }
      });
    }
    // Restore previously-marked statuses (provided / not-required) that survived the re-seed
    _restoreReqStatuses();
    // If this save concludes a "סגרנו עסקה" flow — move the lead to 'client' stage now
    if (pendingCloseLeadId === c.id && c.stage === 'lead') {
      if (pendingCloseLeadTaskId) {
        const closeTask = c.tasks.find(x => x.id === pendingCloseLeadTaskId);
        if (closeTask) {
          closeTask.status = 'done'; closeTask.done = true; closeTask.doneAt = now();
          closeTask.history = closeTask.history || [];
          closeTask.history.push({ status: 'done', at: now() });
        }
      }
      // Auto-close all remaining lead-stage follow-up tasks — the deal is closed, no need to keep them open
      c.tasks.forEach(t => {
        if (t.stage === 'lead' && (t.status || 'active') !== 'done' && t.title !== 'סגרנו עסקה') {
          t.status = 'done'; t.done = true; t.doneAt = now();
          t.history = t.history || [];
          t.history.push({ status: 'done', at: now(), note: 'סומן אוטומטית — סגרנו עסקה' });
        }
      });
      moveStage(c, 'client');
    }
    pendingCloseLeadId = null;
    pendingCloseLeadTaskId = null;
    save(); closeModal();
    editingClientId = null;
    renderClientDetail();
    renderKanban();
    if (currentTab === 'leads') renderLeadsTab();
    setTimeout(() => checkRegulatorAndWarn(c), 200);
    return;
  }

  const c = newClient(data);
  // Full client has real borrower/purpose/registration data → seed document requirements
  seedDocumentRequirements(c);
  // Backdate if the user picked a past date
  if (createdDateStr && createdAtISO !== c.createdAt) {
    c.createdAt = createdAtISO;
    c.leadAt = createdAtISO;
    c.stageEnteredAt = createdAtISO;
    if (Array.isArray(c.stageHistory) && c.stageHistory[0]) c.stageHistory[0].enteredAt = createdAtISO;
    // Also update task createdAt
    c.tasks.forEach(t => { t.createdAt = createdAtISO; });
  }
  state.clients.push(c);
  // Since the user entered full income/deal details, promote lead → client automatically
  moveStage(c, 'client');
  saveNow(); closeModal();
  currentClientId = c.id;
  editingClientId = null;
  switchTab('detail');
  setTimeout(() => checkRegulatorAndWarn(c), 200);
}

function submitEditClient(id) {
  const c = state.clients.find(x => x.id === id);
  const newName = document.getElementById('fName').value.trim();
  const newId = document.getElementById('fId').value.trim();
  const newEmp = document.getElementById('fEmpType').value;
  const newPurpose = document.getElementById('fPurpose').value;
  const purposeChanged = newPurpose && newPurpose !== c.purpose;

  c.name = newName;
  c.phone = document.getElementById('fPhone').value.trim();
  c.idNumber = newId;
  c.employmentType = newEmp;
  c.purpose = newPurpose;
  c.bankerId = document.getElementById('fBanker').value;
  c.propertyValue = Number(document.getElementById('fPropVal').value) || 0;
  c.loanAmount = Number(document.getElementById('fLoanAmt').value) || 0;

  // Sync top-level fields into the primary borrower (single-borrower clients)
  if (Array.isArray(c.borrowers) && c.borrowers.length > 0) {
    c.borrowers[0].name = newName;
    c.borrowers[0].idNumber = newId;
    if (newEmp) {
      c.borrowers[0].employmentType = newEmp;
      c.borrowers[0].employmentTypes = [newEmp];
    }
  }

  // Sync purpose changes into purposes array + refresh deal-related requirements
  if (purposeChanged) {
    c.purposes = [newPurpose];
    // Remove old deal-section requirements and re-seed
    c.requirements = c.requirements.filter(r => r.section !== 'deal');
    seedDealDocsForPurposes(c);
  }

  save(); closeModal(); renderClientDetail();
}

const SIGNATURE_BASE_TASKS = ['שלח פרטים לקבלת הצעת ביטוח', 'ביטוח חיים', 'ביטוח מבנה', 'תיאום חתימות'];

// Bank institution codes for "הקמת הרשאה" task — editable in Settings → קודי מוסד בנקים
const DEFAULT_BANK_INSTITUTION_CODES = [
  { bank: 'מזרחי', code: '704' },
  { bank: 'מזרחי טפחות', code: '704' },
  { bank: 'פאג"י', code: '716' },
  { bank: 'פאגי', code: '716' },
  { bank: 'פאג״י', code: '716' },
  { bank: 'הבינלאומי הראשון לישראל', code: '716' },
  { bank: 'הפועלים', code: '812' },
  { bank: 'לאומי', code: '771' },
  { bank: 'מרכנתיל', code: '25259' },
  { bank: 'מרכנתיל דיסקונט', code: '25259' },
  { bank: 'דיסקונט', code: '700' },
  { bank: 'בנק ירושלים', code: '247' },
  { bank: 'ירושלים', code: '247' },
];
// Backward-compat proxy — uses settings.bankInstitutionCodes if defined, else defaults
const BANK_INSTITUTION_CODES = new Proxy({}, {
  get(_, key) {
    if (typeof key !== 'string') return undefined;
    const src = (state.settings && Array.isArray(state.settings.bankInstitutionCodes) && state.settings.bankInstitutionCodes.length)
      ? state.settings.bankInstitutionCodes : DEFAULT_BANK_INSTITUTION_CODES;
    const found = src.find(m => (m.bank||'').trim() === key.trim());
    return found ? found.code : undefined;
  }
});

function seedSignatureStageTasks(client) {
  // Base tasks — always
  SIGNATURE_BASE_TASKS.forEach(title => {
    if (!client.tasks.some(t => t.stage === 'signature' && t.title === title)) {
      client.tasks.push({
        id: uid(), stage: 'signature', title,
        status: 'active', done: false, doneAt: null,
        createdAt: now(), history: [{ status: 'active', at: now() }],
        source: 'signature-base',
        ...(title === 'תיאום חתימות' ? { isCoordinationTask: true } : {}),
        ...(title === 'שלח פרטים לקבלת הצעת ביטוח' ? { isInsuranceRequest: true } : {})
      });
    }
  });
  // "הקמת הרשאה" task — with institution code based on client's bank
  {
    const banker = client.bankerId ? state.settings.bankers.find(b => b.id === client.bankerId) : null;
    const bankName = banker && banker.bank ? banker.bank.trim() : '';
    const code = BANK_INSTITUTION_CODES[bankName];
    const title = code
      ? 'הקמת הרשאה (קוד מוסד: ' + code + ')'
      : 'הקמת הרשאה';
    // Only add if not already present (in any form — prefix match)
    if (!client.tasks.some(t => t.stage === 'signature' && t.title.startsWith('הקמת הרשאה'))) {
      client.tasks.push({
        id: uid(), stage: 'signature', title,
        status: 'active', done: false, doneAt: null,
        createdAt: now(), history: [{ status: 'active', at: now() }],
        source: 'signature-base'
      });
    }
  }
  // Registration × Deal type tasks
  const regType = client.registrationType;
  if (!regType) return;
  const _sigSrc = (state.settings && state.settings.signatureTasksByRegAndDeal) || SIGNATURE_TASKS_BY_REG_AND_DEAL;
  const regMap = _sigSrc[regType] || {};
  const purposes = (client.purposes && client.purposes.length) ? client.purposes : (client.purpose ? [client.purpose] : []);
  const seen = new Set();
  purposes.forEach(purpose => {
    (regMap[purpose] || []).forEach(title => {
      if (seen.has(title)) return; seen.add(title);
      if (!client.tasks.some(t => t.stage === 'signature' && t.title === title)) {
        client.tasks.push({
          id: uid(), stage: 'signature', title,
          status: 'active', done: false, doneAt: null,
          createdAt: now(), history: [{ status: 'active', at: now() }],
          source: 'signature-seed'
        });
      }
    });
  });
  // Conditional tasks (apply to all registration types)
  if (purposes.includes('יד שנייה')) {
    const nesach = (client.tasks || []).find(t => t.stage === 'submission' && t.title === 'בדקת את הנסח האם יש הערות?');
    const twoSellers = nesach && nesach.subChecks && nesach.subChecks.twoSellers;
    const hasMortgage = nesach && nesach.subChecks && nesach.subChecks.letterOfIntent;
    if (twoSellers === 'no') {
      ['אישור בן/בת הזוג של המוכר - חתום', 'ת"ז וספח - מוכר יחיד'].forEach(title => {
        if (!client.tasks.some(t => t.stage === 'signature' && t.title === title)) {
          client.tasks.push({ id: uid(), stage: 'signature', title, status: 'active', done: false, doneAt: null, createdAt: now(), history: [{ status: 'active', at: now() }], source: 'signature-seed-conditional' });
        }
      });
    }
    if (hasMortgage === 'yes') {
      const title = 'מכתב כוונות';
      if (!client.tasks.some(t => t.stage === 'signature' && t.title === title)) {
        client.tasks.push({ id: uid(), stage: 'signature', title, status: 'active', done: false, doneAt: null, createdAt: now(), history: [{ status: 'active', at: now() }], source: 'signature-seed-conditional' });
      }
    }
  }
  if (purposes.includes('יד ראשונה') && client.hasBankAccompaniment) {
    const title = 'הוראה בלתי חוזרת - חתום';
    if (!client.tasks.some(t => t.stage === 'signature' && t.title === title)) {
      client.tasks.push({ id: uid(), stage: 'signature', title, status: 'active', done: false, doneAt: null, createdAt: now(), history: [{ status: 'active', at: now() }], source: 'signature-seed-conditional' });
    }
  }
  if (purposes.includes('מחיר למשתכן')) {
    const banker = client.bankerId ? state.settings.bankers.find(b => b.id === client.bankerId) : null;
    if (banker && (banker.bank || '').indexOf('לאומי') !== -1) {
      const title = 'מכתב מהקבלן על הימנעות מעשיית עסקה (בנק לאומי)';
      if (!client.tasks.some(t => t.stage === 'signature' && t.title === title)) {
        client.tasks.push({ id: uid(), stage: 'signature', title, status: 'active', done: false, doneAt: null, createdAt: now(), history: [{ status: 'active', at: now() }], source: 'signature-seed-conditional' });
      }
    }
  }
  // "עיונים" exception — remove if bank is לאומי AND registration is טאבו בעלות (matrix seeds it; this strips it)
  {
    const bankerForIyunim = client.bankerId ? state.settings.bankers.find(b => b.id === client.bankerId) : null;
    const isLeumi = !!(bankerForIyunim && (bankerForIyunim.bank || '').indexOf('לאומי') !== -1);
    if (regType === 'tabu-ownership' && isLeumi) {
      client.tasks = client.tasks.filter(t => !(t.stage === 'signature' && t.title === 'עיונים' && (t.status || 'active') !== 'done'));
    }
  }
  // Single-apartment declaration — required when financing > 50%, except at Hapoalim/Leumi
  const pct = financingPct(client);
  if (pct !== null && pct > 50) {
    const banker = client.bankerId ? state.settings.bankers.find(b => b.id === client.bankerId) : null;
    const bank = (banker && banker.bank) || '';
    const isExemptBank = bank.indexOf('הפועלים') !== -1 || bank.indexOf('לאומי') !== -1;
    if (!isExemptBank) {
      const title = 'תצהיר דירה יחידה';
      if (!client.tasks.some(t => t.stage === 'signature' && t.title === title)) {
        client.tasks.push({ id: uid(), stage: 'signature', title, status: 'active', done: false, doneAt: null, createdAt: now(), history: [{ status: 'active', at: now() }], source: 'signature-seed-conditional', carryOver: true });
      }
    }
  }
}

// Seller collateral stage tasks — only for יד שנייה / יד ראשונה / מחיר למשתכן
const SELLER_TASKS_BY_DEAL = {
  'יד שנייה': ['ת"ז מוכרים + ספח', 'אסמכתא לחשבון מוכר', 'מש"ח', 'דיווח מקוצר', 'אישורי מיסים', 'אישור ביצוע פעולה (עו"ד קונה)'],
  'יד ראשונה': ['היתר בניה', 'אישור זכויות / נסח טאבו', 'מש"ח', 'דיווח מקוצר', 'דו"ח מצב דייר', 'מכתב החרגה'],
  'מחיר למשתכן': ['היתר בניה', 'אישור זכויות / נסח טאבו', 'מש"ח', 'דיווח מקוצר', 'דו"ח מצב דייר', 'מכתב החרגה']
};

function seedSellerStageTasks(client) {
  const purposes = (client.purposes && client.purposes.length) ? client.purposes : (client.purpose ? [client.purpose] : []);
  const seen = new Set();
  purposes.forEach(purpose => {
    const sellerSrc = (state.settings && state.settings.sellerTasksByDeal) || SELLER_TASKS_BY_DEAL;
    const tasks = sellerSrc[purpose] || [];
    tasks.forEach(title => {
      if (seen.has(title)) return; seen.add(title);
      if (!client.tasks.some(t => t.stage === 'seller' && t.title === title)) {
        client.tasks.push({
          id: uid(), stage: 'seller', title,
          status: 'active', done: false, doneAt: null,
          createdAt: now(), history: [{ status: 'active', at: now() }],
          source: 'seller-seed'
        });
      }
    });
  });
  // Conditional: יד שנייה + single seller → אישור בן זוג
  if (purposes.includes('יד שנייה')) {
    const nesach = (client.tasks || []).find(t => t.stage === 'submission' && t.title === 'בדקת את הנסח האם יש הערות?');
    const twoSellers = nesach && nesach.subChecks && nesach.subChecks.twoSellers;
    if (twoSellers === 'no') {
      const t1 = 'אישור בן/בת הזוג של המוכר';
      if (!client.tasks.some(t => t.stage === 'seller' && t.title === t1)) {
        client.tasks.push({ id: uid(), stage: 'seller', title: t1, status: 'active', done: false, doneAt: null, createdAt: now(), history: [{ status: 'active', at: now() }], source: 'seller-seed-conditional' });
      }
    }
    // Conditional: יד שנייה + has mortgage → מכתב כוונות
    const hasMortgage = nesach && nesach.subChecks && nesach.subChecks.letterOfIntent;
    if (hasMortgage === 'yes') {
      const t2 = 'מכתב כוונות';
      if (!client.tasks.some(t => t.stage === 'seller' && t.title === t2)) {
        client.tasks.push({ id: uid(), stage: 'seller', title: t2, status: 'active', done: false, doneAt: null, createdAt: now(), history: [{ status: 'active', at: now() }], source: 'seller-seed-conditional' });
      }
    }
  }
  // Conditional: יד ראשונה + bank accompaniment → הוראה בלתי חוזרת
  if ((purposes.includes('יד ראשונה') || purposes.includes('מחיר למשתכן')) && client.hasBankAccompaniment) {
    const banker = client.bankerId ? state.settings.bankers.find(b => b.id === client.bankerId) : null;
    const bankName = banker && banker.bank ? banker.bank : '';
    const loanAmt = Number(client.loanAmount) || 0;
    const title = 'הוראה בלתי חוזרת — בנק ' + (bankName || '?') + (loanAmt > 0 ? ' · ' + fmtMoney(loanAmt) : '');
    if (!client.tasks.some(t => t.stage === 'seller' && t.title.startsWith('הוראה בלתי חוזרת'))) {
      client.tasks.push({ id: uid(), stage: 'seller', title, status: 'active', done: false, doneAt: null, createdAt: now(), history: [{ status: 'active', at: now() }], source: 'seller-seed-conditional' });
    }
  }
  // Conditional: מחיר למשתכן + bank is לאומי → מכתב מהקבלן
  if (purposes.includes('מחיר למשתכן')) {
    const banker = client.bankerId ? state.settings.bankers.find(b => b.id === client.bankerId) : null;
    const isLeumi = banker && (banker.bank || '').indexOf('לאומי') !== -1;
    if (isLeumi) {
      const title = 'מכתב מהקבלן על הימנעות מעשיית עסקה (בנק לאומי)';
      if (!client.tasks.some(t => t.stage === 'seller' && t.title === title)) {

}

function refreshSellerTasks(clientId) {
  const c = state.clients.find(x => x.id === clientId);
  if (!c) return;
  const purposes = (c.purposes && c.purposes.length) ? c.purposes : (c.purpose ? [c.purpose] : []);
  const _sellerCheck = (state.settings && state.settings.sellerTasksByDeal) || SELLER_TASKS_BY_DEAL;
  const relevant = purposes.filter(p => _sellerCheck[p]);
  if (!relevant.length) { alert('לשלב בטחונות מוכר יש משימות רק בעסקאות יד שנייה / יד ראשונה / מחיר למשתכן'); return; }
  if (!confirm('רענון ייצור מחדש משימות בטחונות מוכר לפי עסקאות: ' + relevant.join(', ') + '\n\nמשימות שסימנת "בוצע" יישמרו לפי שם. משימות ידניות לא ייגעו. להמשיך?')) return;
  const statusMap = {};
  c.tasks.filter(t => t.stage === 'seller').forEach(t => {
    statusMap[t.title] = { status: t.status, done: t.done, doneAt: t.doneAt, history: t.history };
  });
  // Remove auto-seeded tasks
  const allKnown = new Set();
  const _sellerTasksSrc = (state.settings && state.settings.sellerTasksByDeal) || SELLER_TASKS_BY_DEAL;
  Object.values(_sellerTasksSrc).forEach(list => list.forEach(t => allKnown.add(t)));
  ['אישור בן/בת הזוג של המוכר', 'מכתב כוונות', 'מכתב מהקבלן על הימנעות מעשיית עסקה (בנק לאומי)'].forEach(t => allKnown.add(t));
  c.tasks = c.tasks.filter(t => {
    if (t.stage !== 'seller') return true;
    if (t.source === 'seller-seed' || t.source === 'seller-seed-conditional') return false;
    if (allKnown.has(t.title)) return false;
    if (t.title.startsWith('הוראה בלתי חוזרת')) return false;
    return true;
  });
  seedSellerStageTasks(c);
  c.tasks.filter(t => t.stage === 'seller' && (t.source === 'seller-seed' || t.source === 'seller-seed-conditional')).forEach(t => {
    const prev = statusMap[t.title];
    if (prev && prev.status && prev.status !== 'active') {
      t.status = prev.status; t.done = prev.done; t.doneAt = prev.doneAt; t.history = prev.history || t.history;
    }
  });
  save(); renderClientDetail();
}

${sellerBlock}

תודה מראש ויום טוב,
יצחק`;
  document.getElementById('scSubject').value = subject;

}

function copySellerEmailFormatted() {
  const body = document.getElementById('scBody').value;
  // Convert plain text to HTML with bold section headers
  const lines = body.split('\n');
  const htmlLines = lines.map(line => {
    // Bold lines that start with ◆ (our section marker)
    if (line.startsWith('◆')) return `<strong style="color:#f97316;font-size:15px">${line}</strong>`;
    // Bold divider lines
    if (line.match(/^━+$/)) return `<span style="color:#f97316">${line}</span>`;
    if (line.trim() === '') return '<br>';
    return line;
  });
  const html = '<div style="font-family:\'Segoe UI\',Arial,sans-serif;font-size:14px;line-height:1.6;color:#1f2937">' + htmlLines.join('<br>') + '</div>';
  // Write both plain and HTML to clipboard
  try {
    const item = new ClipboardItem({
      'text/plain': new Blob([body], { type: 'text/plain' }),
      'text/html': new Blob([html], { type: 'text/html' })
    });
    navigator.clipboard.write([item]).then(() => {
      alert('✓ הועתק עם עיצוב! פתח את Gmail ולחץ Ctrl+V בגוף המייל.');
    }).catch(err => {
      // Fallback: just plain text
      navigator.clipboard.writeText(body);
      alert('✓ הועתק (טקסט רגיל). הדבק ב־Gmail עם Ctrl+V.');
    });
  } catch (e) {
    navigator.clipboard.writeText(body);
    alert('✓ הועתק. הדבק ב־Gmail עם Ctrl+V.');
  }
}

      ? 'https://mail.google.com/mail/u/0/#drafts/' + msgId
      : 'https://mail.google.com/mail/u/0/#drafts';
    window.open(url, '_blank');
  } catch (err) {
    // Fallback: clipboard + open Gmail compose URL
    console.error('Gmail API error:', err);
    try {
      if (window.ClipboardItem) {
        const item = new ClipboardItem({
          'text/plain': new Blob([body], { type: 'text/plain' }),
          'text/html': new Blob([html], { type: 'text/html' })
        });
        await navigator.clipboard.write([item]);

      }

    let url = 'https://mail.google.com/mail/?authuser=a035591712@gmail.com&view=cm&fs=1&su=' + encodeURIComponent(subject);

  }
}

// ============================================================
// Gmail API — create formatted HTML drafts directly in Gmail
// ============================================================
const GMAIL_CLIENT_ID = '847178968041-2kc20rd5ndmsk1qm575i17pujl6ipgin.apps.googleusercontent.com';
const GMAIL_SCOPE = 'https://www.googleapis.com/auth/gmail.compose';
let gmailTokenClient = null;

function gmailInit() {
  if (gmailTokenClient) return true;
  if (!window.google || !window.google.accounts || !window.google.accounts.oauth2) return false;
  gmailTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GMAIL_CLIENT_ID,
    scope: GMAIL_SCOPE,
    callback: () => {} // default no-op, overridden per-request
  });
  return true;
}

function gmailGetToken() {
  const exp = parseInt(localStorage.getItem('gmail_token_expiry') || '0', 10);
  if (Date.now() < exp - 30000) return localStorage.getItem('gmail_token');
  return null;
}

function gmailRequestToken() {
  return new Promise((resolve, reject) => {
    if (!gmailInit()) {
      alert('טעינת Google Sign-in נכשלה. נסה לרענן את הדף.');
      reject(new Error('gsi not loaded'));
      return;
    }
    gmailTokenClient.callback = (resp) => {
      if (resp.access_token) {
        localStorage.setItem('gmail_token', resp.access_token);
        localStorage.setItem('gmail_token_expiry', String(Date.now() + (resp.expires_in * 1000)));
        resolve(resp.access_token);
      } else {
        reject(new Error('אין הרשאה'));
      }
    };
    gmailTokenClient.error_callback = (err) => reject(err);
    gmailTokenClient.requestAccessToken({ prompt: '' });
  });
}

async function gmailGetOrRequestToken() {
  const t = gmailGetToken();
  if (t) return t;
  return await gmailRequestToken();
}

function _utf8ToBase64(str) {
  return btoa(unescape(encodeURIComponent(str)));
}

function _base64Url(str) {
  return _utf8ToBase64(str).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

async function gmailCreateDraft({ to, cc, subject, htmlBody }) {
  const token = await gmailGetOrRequestToken();
  const headerLines = [];
  if (to) headerLines.push('To: ' + to);
  if (cc) headerLines.push('Cc: ' + cc);
  headerLines.push('Subject: =?UTF-8?B?' + _utf8ToBase64(subject || '') + '?=');
  headerLines.push('MIME-Version: 1.0');
  headerLines.push('Content-Type: text/html; charset=UTF-8');
  headerLines.push('Content-Transfer-Encoding: base64');
  const headers = headerLines.join('\r\n');
  const bodyEncoded = _utf8ToBase64(htmlBody || '');
  const mime = headers + '\r\n\r\n' + bodyEncoded;
  const raw = _base64Url(mime);
  const resp = await fetch('https://gmail.googleapis.com/gmail/v1/users/me/drafts', {
    method: 'POST',
    headers: {
      'Authorization': 'Bearer ' + token,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ message: { raw } })
  });
  if (!resp.ok) {
    if (resp.status === 401) {
      // Token expired — clear and retry once
      localStorage.removeItem('gmail_token');
      localStorage.removeItem('gmail_token_expiry');
      const newToken = await gmailRequestToken();
      const resp2 = await fetch('https://gmail.googleapis.com/gmail/v1/users/me/drafts', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + newToken, 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: { raw } })
      });
      if (!resp2.ok) throw new Error('Gmail API failed: ' + await resp2.text());
      return await resp2.json();
    }
    const err = await resp.text();
    throw new Error(err);
  }
  return await resp.json();
}

// Build a beautifully styled HTML email body from plain text with markers
function buildStyledEmailHtml(bodyText, type) {
  const theme = type === 'seller'
    ? { primary: '#c2410c', accent: '#f97316', bg: '#fff7ed', border: '#fed7aa', bullet: '#ea580c' }
    : { primary: '#166534', accent: '#22c55e', bg: '#f0fdf4', border: '#bbf7d0', bullet: '#16a34a' };
  const BASE = `font-family:arial,sans-serif;font-size:14px;color:#1f2937`;
  const escapeHtml = s => String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const lines = bodyText.split('\n');
  const parts = [];
  lines.forEach((raw) => {
    const line = raw.replace(/\r$/, '');
    const trimmed = line.trim();
    // Section header — big orange/green pill with left border
    if (line.startsWith('◆') || /^\*[^*]+\*$/.test(trimmed)) {
      const clean = escapeHtml(line.replace(/^◆\s*/, '').replace(/^\*|\*$/g, ''));
      parts.push(`<div style="${BASE};background:${theme.bg};border-inline-start:5px solid ${theme.accent};padding:14px 18px;border-radius:8px;margin:24px 0 12px;font-weight:700;color:${theme.primary};font-size:15px;letter-spacing:0.2px">${clean}</div>`);
    }
    // Skip divider lines — sections are visually separated by the header design
    else if (/^[━─═▬-]{4,}$/.test(trimmed)) {
      // no output
    }
    // Bullet — colored bullet with more spacing
    else if (line.startsWith('•')) {
      const clean = escapeHtml(line.replace(/^•\s*/, ''));
      parts.push(`<div style="${BASE};padding:6px 8px 6px 24px;line-height:1.6"><span style="color:${theme.bullet};font-weight:700;font-size:16px">☐</span>&nbsp;&nbsp;${clean}</div>`);
    }
    else if (trimmed === '') {
      parts.push('<div style="height:10px"></div>');
    }
    // Regular text
    else {
      parts.push(`<div style="${BASE};padding:4px 0;line-height:1.7">${escapeHtml(line)}</div>`);
    }
  });
  return `<div dir="rtl" style="${BASE};max-width:640px;margin:0 auto;padding:20px 24px;line-height:1.6">${parts.join('')}</div>`;
}

// Default greetings by hour — customizable in Settings → 👋 ברכות לפי שעה
const DEFAULT_GREETINGS = [
  { untilHour: 12, text: 'בוקר טוב' },
  { untilHour: 17, text: 'צהריים טובים' },
  { untilHour: 22, text: 'ערב טוב' },
  { untilHour: 24, text: 'לילה טוב' },
];
function greetingByHour() {
  const h = new Date().getHours();
  const src = (state.settings && Array.isArray(state.settings.greetings) && state.settings.greetings.length)
    ? state.settings.greetings : DEFAULT_GREETINGS;
  const sorted = src.slice().sort((a, b) => (a.untilHour || 0) - (b.untilHour || 0));
  const match = sorted.find(g => h < (Number(g.untilHour) || 24));
  return (match && match.text) || 'שלום';
}

// Strip trailing parenthesised suffix like "(הרחבה)" or "(יד שנייה)" from a title — those are internal
// deal-purpose markers appended at seeding time and shouldn't appear in client-facing messages.
function _cleanItemTitle(title) {
  return String(title || '').replace(/\s*\([^)]*\)\s*$/, '').trim();
}

// Split a borrower-like object into {family, first}. Prefers stored firstName/familyName; otherwise
// assumes the stored full-name string is in "family first…" order (the Hebrew convention).
function _splitHebrewName(p) {
  p = p || {};
  if (p.familyName || p.firstName) return { family: p.familyName || '', first: p.firstName || '' };
  const full = (p.name || '').trim();
  if (!full) return { family: '', first: '' };
  const parts = full.split(/\s+/);
  if (parts.length === 1) return { family: parts[0], first: '' };
  return { family: parts[0], first: parts.slice(1).join(' ') };
}
// Returns a borrower's first name — using stored firstName if available, else falling back to
// splitting the full name (second word onwards in Hebrew family-first convention).
function getPersonFirstName(p) {
  if (!p) return '';
  if (p.firstName) return p.firstName;
  return _splitHebrewName(p).first || p.name || '';
}
// Natural-order full name for emails to the client ("ברוך משה ארנפלד" — first then family)
function getPersonDisplayFirstLast(p) {
  if (!p) return '';
  const parts = _splitHebrewName(p);
  if (parts.first && parts.family) return parts.first + ' ' + parts.family;
  return parts.first || parts.family || p.name || '';
}

// Detect banker gender from name (Hebrew heuristic + known female names)
function detectBankerGender(banker) {
  if (!banker) return 'male';
  if (banker.gender === 'female' || banker.gender === 'male') return banker.gender;
  const name = (banker.name || '').trim();
  if (!name) return 'male';
  const firstName = name.split(/\s+/)[0];
  const knownFemale = new Set(['בלהה','גאולה','נחמה','סימה','שיפי','שרה','לאה','רבקה','רחל','חנה','מירי','מרים','אסתר','דבורה','יעל','נועה','שירה','דנה','טליה','אפרת','אורית','שני','ליאת','גל','אביה','בת שבע','רותי','גילה','עדינה','טובה','חדוה','ברכה','שלומית','אביבה','זהבה','ורד','מיכל','דליה','לילך','מיטל','שרון','שלומית','שני','דניאלה']);
  if (knownFemale.has(firstName)) return 'female';
  // Hebrew female name heuristic: ends with ה (unless it's clearly male like משה, יהודה)
  const knownMaleEndingH = new Set(['משה','יהודה','אליה','נחמיה','ישעיה','ירמיה','זכריה']);
  if (firstName.endsWith('ה') && !knownMaleEndingH.has(firstName)) return 'female';
  // Ends in ית / ות / ת / ילה — likely female
  if (/ית$|ות$|ילה$/.test(firstName)) return 'female';
  return 'male';
}
function youWordFor(banker) { return detectBankerGender(banker) === 'female' ? 'תוכלי' : 'תוכל'; }

function refreshBankTasks(clientId) {
  const c = state.clients.find(x => x.id === clientId);
  if (!c) return;
  const regType = c.registrationType || '';
  const purposes = (c.purposes && c.purposes.length) ? c.purposes : (c.purpose ? [c.purpose] : []);
  if (!regType) { alert('חסר סוג רישום נכס — ערוך את הלקוח ובחר רישום נכס'); return; }
  if (!purposes.length) { alert('חסר סוג עסקה — ערוך את הלקוח ובחר סוג עסקה'); return; }
  const preview = [];
  const regMap = ((state.settings && state.settings.bankTasksByRegAndDeal) || BANK_TASKS_BY_REG_AND_DEAL)[regType] || {};
  const seen = new Set();
  purposes.forEach(p => (regMap[p]||[]).forEach(t => { if (!seen.has(t)) { seen.add(t); preview.push(t); } }));
  if (!confirm('רענון ייצור מחדש ' + preview.length + ' משימות לפי:\n• רישום: ' + (REGISTRATION_DOCS[regType]?.label||regType) + '\n• עסקאות: ' + purposes.join(', ') + '\n\nמשימות שסימנת כ"בוצע" יישמרו לפי שם. משימות שהוספת ידנית לא ייגעו. להמשיך?')) return;
  // Preserve statuses by title (bank-stage seed tasks + any existing bank task with matching title)
  const statusMap = {};
  c.tasks.filter(t => t.stage === 'bank').forEach(t => {
    statusMap[t.title] = { status: t.status, done: t.done, doneAt: t.doneAt, history: t.history };
  });
  // Remove all auto-seeded bank tasks (both source='bank-seed' and untagged legacy ones matching known titles)
  const allKnownTitles = new Set();
  const _bankTasksSrc = (state.settings && state.settings.bankTasksByRegAndDeal) || BANK_TASKS_BY_REG_AND_DEAL;
  Object.values(_bankTasksSrc).forEach(regMap => Object.values(regMap).forEach(list => list.forEach(t => allKnownTitles.add(t))));
  c.tasks = c.tasks.filter(t => {
    if (t.stage !== 'bank') return true;
    if (t.source === 'bank-seed') return false;
    if (allKnownTitles.has(t.title)) return false; // legacy auto-seed
    return true; // keep custom tasks
  });
  seedBankStageTasks(c);
  // Restore statuses
  c.tasks.filter(t => t.stage === 'bank' && t.source === 'bank-seed').forEach(t => {
    const prev = statusMap[t.title];
    if (prev && prev.status && prev.status !== 'active') {
      t.status = prev.status; t.done = prev.done; t.doneAt = prev.doneAt; t.history = prev.history || t.history;
    }
  });
  save(); renderClientDetail();
}

// Seeds the "נשלח לבחינה" floating task when the client enters the approval stage.
// The task is non-blocking (floating) and carries to later stages until both it and its sub-check "בחינה תקין?" are done.
function seedApprovalInspectionTask(client) {
  if (!client.tasks.some(t => t.title === 'נשלח לבחינה' && t.source === 'bank-inspection')) {
    client.tasks.push({
      id: uid(), stage: 'approval', title: 'נשלח לבחינה',
      status: 'active', done: false, doneAt: null,
      createdAt: now(), history: [{ status: 'active', at: now() }],
      source: 'bank-inspection', floating: true
    });
  }
}

function seedBankStageTasks(client) {
  const regType = client.registrationType;
  if (!regType) return;
  const bankTasks = (state.settings && state.settings.bankTasksByRegAndDeal) || BANK_TASKS_BY_REG_AND_DEAL;
  const regMap = bankTasks[regType];
  if (!regMap) return;
  const purposes = (client.purposes && client.purposes.length) ? client.purposes : (client.purpose ? [client.purpose] : []);
  const seen = new Set();
  purposes.forEach(purpose => {
    const tasks = regMap[purpose] || [];
    tasks.forEach(title => {
      if (seen.has(title)) return;
      seen.add(title);
      if (!client.tasks.some(t => t.stage === 'bank' && t.title === title)) {
        client.tasks.push({
          id: uid(), stage: 'bank', title,
          status: 'active', done: false, doneAt: null,
          createdAt: now(), history: [{ status: 'active', at: now() }],
          source: 'bank-seed'
        });
      }
    });
  });
  // Conditional: יד שנייה + single seller → add "הסכמת בן/בת הזוג למכירה"
  if (purposes.includes('יד שנייה')) {
    const nesachTask = (client.tasks || []).find(t => t.stage === 'submission' && t.title === 'בדקת את הנסח האם יש הערות?');
    const twoSellers = nesachTask && nesachTask.subChecks && nesachTask.subChecks.twoSellers;
    if (twoSellers === 'no') {
      const title = 'הסכמת בן/בת הזוג של המוכר למכירה';
      if (!client.tasks.some(t => t.stage === 'bank' && t.title === title)) {
        client.tasks.push({
          id: uid(), stage: 'bank', title,
          status: 'active', done: false, doneAt: null,
          createdAt: now(), history: [{ status: 'active', at: now() }],
          source: 'bank-seed-conditional'
        });
      }
    }
  }
}

function seedAppraisalTasks(client) {
  if (!client.requiresAppraisal) return;
  // Universal appraisal tasks — always seeded regardless of deal type / registration type
  if (!client.tasks.some(t => t.stage === 'appraisal' && t.title === 'הפניה לשמאי')) {
    client.tasks.push({
      id: uid(), stage: 'appraisal', title: 'הפניה לשמאי',
      status: 'active', done: false, doneAt: null, createdAt: now(),
      history: [{ status: 'active', at: now() }],
      source: 'appraisal-seed'
    });
  }
  // Add floating task — appraiser value — that persists through later stages
  if (!client.tasks.some(t => t.title === 'כמה אושר שווי ע"פ השמאי' && t.floating)) {
    client.tasks.push({
      id: uid(), stage: 'appraisal', title: 'כמה אושר שווי ע"פ השמאי',
      status: 'active', done: false, doneAt: null, createdAt: now(),
      history: [{ status: 'active', at: now() }],
      source: 'appraisal-value-check', floating: true
    });
  }
  const regType = client.registrationType;
  if (!regType) return;
  const regMap = (state.settings.appraisalTasksByReg || {})[regType] || {};
  const purposes = Array.isArray(client.purposes) && client.purposes.length ? client.purposes : (client.purpose ? [client.purpose] : []);
  const isRented = !!client.isRented;
  const rentApplies = state.settings.dealRentApplies || [];
  const seen = new Set();
  purposes.forEach(p => {
    const tasks = regMap[p] || [];
    tasks.forEach(name => {
      const key = name + '::' + p;
      if (seen.has(key)) return; seen.add(key);
      client.tasks.push({ id: uid(), stage: 'appraisal', title: name + ' (' + p + ')', status: 'active', done: false, doneAt: null, createdAt: now(), history: [{ status: 'active', at: now() }], source: 'appraisal-seed' });
    });
    if (isRented && rentApplies.includes(p)) {
      const key = 'חוזה שכירות::' + p;
      if (!seen.has(key)) { seen.add(key); client.tasks.push({ id: uid(), stage: 'appraisal', title: 'חוזה שכירות (' + p + ')', status: 'active', done: false, doneAt: null, createdAt: now(), history: [{ status: 'active', at: now() }], source: 'appraisal-seed' }); }
    }
  });
}

function seedDealDocsForPurposes(client) {
  const purposes = Array.isArray(client.purposes) && client.purposes.length ? client.purposes : (client.purpose ? [client.purpose] : []);
  const isRented = !!client.isRented;
  const rentDoc = 'חוזה שכירות';
  const dealDocsFor = state.settings.dealDocs || DEFAULT_DATA.settings.dealDocs;
  const rentApplies = state.settings.dealRentApplies || DEFAULT_DATA.settings.dealRentApplies || [];
  // Names already added at client-stage (from registration or previous deal) — skip dupes
  const existingNames = new Set(client.requirements.filter(r => r.stage === 'client' && r.section === 'deal').map(r => r.name));
  purposes.forEach(p => {
    (dealDocsFor[p] || []).forEach(name => {

      existingNames.add(name);
      client.requirements.push({ id: uid(), stage: 'client', section: 'deal', dealType: p, name, status: 'pending' });
    });
    if (isRented && rentApplies.includes(p)) {
      if (!existingNames.has(rentDoc)) {
        existingNames.add(rentDoc);
        client.requirements.push({ id: uid(), stage: 'client', section: 'deal', dealType: p, name: rentDoc, status: 'pending' });
      }
    }
  });
}

      </ul>
    </div>
  `;
  document.body.appendChild(div);
  makeDraggable(div, div.querySelector('#floatReminderHeader'));
  // Auto-close after 12s
  const bar = div.querySelector('#floatReminderBar');
  const closeTimer = setTimeout(() => { div.remove(); }, 12000);
  div._closeTimer = closeTimer;
  div._paused = false;
}

function toggleReminderPause() {
  const div = document.getElementById('floatReminders');
  if (!div) return;
  const bar = div.querySelector('#floatReminderBar');
  const btn = div.querySelector('#floatReminderPause');
  if (!div._paused) {
    // Pause
    bar.style.animationPlayState = 'paused';
    clearTimeout(div._closeTimer);
    div._closeTimer = null;
    div._paused = true;
    btn.textContent = '▶';
    btn.title = 'המשך ספירה';
  } else {
    // Resume — calculate remaining time from current bar width
    const rect = bar.getBoundingClientRect();
    const totalWidth = div.getBoundingClientRect().width;
    const remainingPct = rect.width / totalWidth;
    const remainingMs = remainingPct * 12000;
    bar.style.animationPlayState = 'running';
    div._closeTimer = setTimeout(() => { div.remove(); }, remainingMs);
    div._paused = false;
    btn.textContent = '⏸';
    btn.title = 'השהה';
  }
}

function closeReminders() {
  const div = document.getElementById('floatReminders');
  if (!div) return;
  if (div._closeTimer) clearTimeout(div._closeTimer);
  div.remove();
}

// Inject reminder countdown animation once
if (!document.getElementById('reminderStyle')) {
  const s = document.createElement('style');
  s.id = 'reminderStyle';
  s.textContent = '@keyframes reminderCountdown { from { transform:scaleX(1) } to { transform:scaleX(0) } }';
  document.head.appendChild(s);
}

function makeDraggable(el, handle) {
  let sx=0, sy=0, sl=0, st=0, dragging=false;
  handle.addEventListener('mousedown', (e) => {
    dragging = true;
    sx = e.clientX; sy = e.clientY;
    const rect = el.getBoundingClientRect();
    sl = rect.left; st = rect.top;
    el.style.insetInlineStart = 'auto';
    el.style.left = sl + 'px';
    el.style.top = st + 'px';
    e.preventDefault();
  });
  document.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    el.style.left = (sl + (e.clientX - sx)) + 'px';
    el.style.top = (st + (e.clientY - sy)) + 'px';
  });
  document.addEventListener('mouseup', () => { dragging = false; });
}

  const _guarantorReqs = pendingReqs.filter(r => /— ערב\s*\d/.test(r.name));
  const _boxCh = '☐';
  const _cleanG = n => n.replace(/\s*—\s*ערב\s*\d+\s*$/, '');
  const _sections = [];
  if (_borrowerReqs.length) _sections.push('▬▬▬ 📋 ניירת של הלווים ▬▬▬\n' + _borrowerReqs.map(r => _boxCh + '  ' + r.name).join('\n'));
  if (_guarantorReqs.length) {
    const _byG = {};
    _guarantorReqs.forEach(r => {
      const m = r.name.match(/—\s*ערב\s*(\d+)/);
      const gNum = m ? m[1] : '1';
      (_byG[gNum] = _byG[gNum] || []).push(_cleanG(r.name));
    });
    const _nums = Object.keys(_byG).sort();
    const _multi = _nums.length > 1;
    let _out = '▬▬▬ 🤝 ניירת של הערבים ▬▬▬\n';
    _nums.forEach(g => {
      if (_multi) _out += `\n【 ערב ${g} 】\n`;
      _out += _byG[g].map(n => _boxCh + '  ' + n).join('\n') + '\n';
    });
    _sections.push(_out.trimEnd());
  }
  const missing = _sections.length ? _sections.join('\n\n') : 'אין';

    banker.branch ? 'סניף ' + banker.branch : '',
    banker.branchAddress || ''
  ].filter(Boolean).join(' · ') : '';
  return (text||'')
    .replace(/\{name\}/g, c.name || '')
    .replace(/\{phone\}/g, c.phone || '')

function replaceTemplateVars(text, c) {
  const banker = c.bankerId ? state.settings.bankers.find(b => b.id === c.bankerId) : null;
  const pendingReqs = (c.requirements || []).filter(r => r.status === 'pending');
  const _borrowerReqs = pendingReqs.filter(r => !/— ערב\s*\d/.test(r.name));
  const _guarantorReqs = pendingReqs.filter(r => /— ערב\s*\d/.test(r.name));
  const _boxCh = '☐';
  const _cleanG = n => n.replace(/\s*—\s*ערב\s*\d+\s*$/, '');
  const _sections = [];
  if (_borrowerReqs.length) _sections.push('▬▬▬ 📋 ניירת של הלווים ▬▬▬\n' + _borrowerReqs.map(r => _boxCh + '  ' + r.name).join('\n'));
  if (_guarantorReqs.length) {
    const _byG = {};
    _guarantorReqs.forEach(r => {
      const m = r.name.match(/—\s*ערב\s*(\d+)/);
      const gNum = m ? m[1] : '1';
      (_byG[gNum] = _byG[gNum] || []).push(_cleanG(r.name));
    });
    const _nums = Object.keys(_byG).sort();
    const _multi = _nums.length > 1;
    let _out = '▬▬▬ 🤝 ניירת של הערבים ▬▬▬\n';
    _nums.forEach(g => {
      if (_multi) _out += `\n【 ערב ${g} 】\n`;
      _out += _byG[g].map(n => _boxCh + '  ' + n).join('\n') + '\n';
    });
    _sections.push(_out.trimEnd());
  }
  const missing = _sections.join('\n\n');
  const purposes = (c.purposes && c.purposes.length) ? c.purposes.join(', ') : (c.purpose || '');
  return (text||'')
    .replace(/\{name\}/g, c.name || '')
    .replace(/\{phone\}/g, c.phone || '')
    .replace(/\{propertyAddress\}/g, c.propertyAddress || '')
    .replace(/\{stage\}/g, (STAGES.find(s => s.id === c.stage) || {}).label || '')
    .replace(/\{missingDocs\}/g, missing || '(אין)')
    .replace(/\{bankerName\}/g, banker ? banker.name : '')
    .replace(/\{bank\}/g, banker ? (banker.bank || '') : '')
    .replace(/\{branch\}/g, banker ? (banker.branch || '') : '')
    .replace(/\{branchAddress\}/g, banker ? (banker.branchAddress || '') : '')
    .replace(/\{bankerFullBranch\}/g, banker ? [banker.bank, banker.branch].filter(Boolean).join(' · ') : '')
    .replace(/\{purpose\}/g, purposes);
}

function sendClientEmail(clientId) {
  const to = document.getElementById('emailTo').value;

  // Detect if this is a missing-docs email by subject/body — mark it for the 24h nag
  const isMissingDocs = /מסמכים חסרים|ניירת להשלמה|רשימת מסמכים/.test(subject + ' ' + body);
  const isFollowUp = /תזכורת/.test(subject);
  logCommunication(clientId, 'email', { to, subject, body, missingDocsRequest: isMissingDocs, followUp: isMissingDocs && isFollowUp });

      c.missingDocsRequestCount = (c.missingDocsRequestCount || 0) + 1;
      if (isFollowUp) c.missingDocsFollowUpAt = now();

}

function buildDailySummary(dateStr) {
  // dateStr YYYY-MM-DD; default today
  const day = dateStr ? new Date(dateStr + 'T00:00:00') : new Date(new Date().setHours(0,0,0,0));
  const dayStart = new Date(day); dayStart.setHours(0,0,0,0);
  const dayEnd = new Date(day); dayEnd.setHours(23,59,59,999);
  const inRange = iso => { if (!iso) return false; const t = new Date(iso).getTime(); return t >= dayStart.getTime() && t <= dayEnd.getTime(); };

  const newLeads = [];
  const newClients = [];
  const tasksDone = [];
  const tasksFollowUp = [];
  const notesAdded = [];
  const stageTransitions = [];
  const whatsappSent = [];
  const emailsSent = [];

  state.clients.forEach(c => {
    // Leads created today (stage === 'lead' AND created today)
    if (c.stage === 'lead' && inRange(c.leadAt || c.createdAt)) {
      newLeads.push(c);
    }
    // Clients created today (was moved past lead in same day, or created directly as client)
    const clientEntry = (c.stageHistory || []).find(h => h.stage === 'client');
    if (clientEntry && inRange(clientEntry.enteredAt)) {
      newClients.push(c);
    }
    // Task history — done today, follow-up today
    (c.tasks || []).forEach(t => {
      const hist = t.history || [];
      hist.forEach(h => {
        if (!inRange(h.at)) return;
        if (h.status === 'done') tasksDone.push({ client: c, task: t, at: h.at });
        if (h.status === 'follow-up') tasksFollowUp.push({ client: c, task: t, at: h.at });
      });
    });
    // Notes added today
    (c.leadNotes || []).forEach(n => {
      if (inRange(n.createdAt)) notesAdded.push({ client: c, note: n });
    });
    // Stage transitions today (excluding 'client' — already counted above)
    (c.stageHistory || []).forEach(h => {
      if (inRange(h.enteredAt) && h.stage !== 'lead') {
        stageTransitions.push({ client: c, stage: h.stage, at: h.enteredAt });
      }
    });
    // Communications today
    (c.commLog || []).forEach(l => {
      if (!inRange(l.at)) return;
      if (l.type === 'whatsapp') whatsappSent.push({ client: c, log: l });
      if (l.type === 'email') emailsSent.push({ client: c, log: l });
    });
  });

  return { day, newLeads, newClients, tasksDone, tasksFollowUp, notesAdded, stageTransitions, whatsappSent, emailsSent };
}

function formatDailySummaryText(sum) {
  const dayStr = sum.day.toLocaleDateString('he-IL', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  const lines = [];
  lines.push('סיכום יומי — ' + dayStr);
  lines.push('='.repeat(50));
  lines.push('');

  lines.push('📊 סיכום מספרי:');
  lines.push('• לידים חדשים: ' + sum.newLeads.length);
  lines.push('• לקוחות חדשים (הוזזו ללקוח): ' + sum.newClients.length);
  lines.push('• משימות שבוצעו: ' + sum.tasksDone.length);
  lines.push('• משימות שהועברו למעקב: ' + sum.tasksFollowUp.length);
  lines.push('• הערות שנרשמו: ' + sum.notesAdded.length);
  lines.push('• מעברי שלב: ' + sum.stageTransitions.length);
  lines.push('• הודעות WhatsApp שנשלחו: ' + sum.whatsappSent.length);
  lines.push('• מיילים שנשלחו: ' + sum.emailsSent.length);
  lines.push('');

  const fmtTime = iso => { const d = new Date(iso); return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); };

  if (sum.newLeads.length) {
    lines.push('📞 לידים חדשים:');
    sum.newLeads.forEach(c => lines.push('  • ' + (c.name || '—') + (c.phone ? ' · ' + c.phone : '') + (c.email ? ' · ' + c.email : '')));
    lines.push('');
  }
  if (sum.newClients.length) {
    lines.push('🎯 לידים שהפכו ללקוחות:');
    sum.newClients.forEach(c => lines.push('  • ' + (c.name || '—')));
    lines.push('');
  }
  if (sum.tasksDone.length) {
    lines.push('✅ משימות שבוצעו (' + sum.tasksDone.length + '):');
    sum.tasksDone.forEach(({client, task, at}) => {
      lines.push('  • [' + fmtTime(at) + '] ' + (task.title || '—') + ' — ' + (client.name || '—'));
    });
    lines.push('');
  }
  if (sum.tasksFollowUp.length) {
    lines.push('⏳ משימות במעקב:');
    sum.tasksFollowUp.forEach(({client, task, at}) => {
      lines.push('  • [' + fmtTime(at) + '] ' + (task.title || '—') + ' — ' + (client.name || '—'));
    });
    lines.push('');
  }
  if (sum.stageTransitions.length) {
    lines.push('🔄 מעברי שלב:');
    sum.stageTransitions.forEach(({client, stage, at}) => {
      const lbl = (STAGES.find(s => s.id === stage) || {}).label || stage;
      lines.push('  • [' + fmtTime(at) + '] ' + (client.name || '—') + ' → ' + lbl);
    });
    lines.push('');
  }
  if (sum.notesAdded.length) {
    lines.push('📝 הערות שנרשמו:');
    sum.notesAdded.forEach(({client, note}) => {
      lines.push('  • [' + fmtTime(note.createdAt) + '] ' + (client.name || '—') + ': ' + note.text);
    });
    lines.push('');
  }
  if (sum.whatsappSent.length) {
    lines.push('💬 הודעות WhatsApp:');
    sum.whatsappSent.forEach(({client, log}) => {
      lines.push('  • [' + fmtTime(log.at) + '] ' + (client.name || '—') + ((log.meta && log.meta.messagePreview) ? ' — ' + log.meta.messagePreview : ''));
    });
    lines.push('');
  }
  if (sum.emailsSent.length) {
    lines.push('📧 מיילים שנשלחו:');
    sum.emailsSent.forEach(({client, log}) => {
      lines.push('  • [' + fmtTime(log.at) + '] ' + (client.name || '—') + ((log.meta && log.meta.subject) ? ' — ' + log.meta.subject : ''));
    });
    lines.push('');
  }

  if (!sum.newLeads.length && !sum.newClients.length && !sum.tasksDone.length && !sum.tasksFollowUp.length && !sum.notesAdded.length && !sum.stageTransitions.length && !sum.whatsappSent.length && !sum.emailsSent.length) {
    lines.push('— אין פעילות מתועדת ליום זה —');
  }

  return lines.join('\n');
}

// ============================
// Morning briefing — semi-automatic
// ============================
// On first app open each day (after 6 AM), auto-show a modal with today's plan.
// User clicks "📧 שלח לי במייל" to open a Gmail draft pre-filled with everything.

function buildMorningBriefing() {
  const now = new Date();
  const dayStart = new Date(now); dayStart.setHours(0,0,0,0);
  const dayEnd = new Date(now); dayEnd.setHours(23,59,59,999);
  const yStart = new Date(dayStart.getTime() - 86400000);
  const inToday = iso => { if (!iso) return false; const t = new Date(iso).getTime(); return t >= dayStart.getTime() && t <= dayEnd.getTime(); };
  const inYesterday = iso => { if (!iso) return false; const t = new Date(iso).getTime(); return t >= yStart.getTime() && t < dayStart.getTime(); };

  // Urgent items — clients classified as 'urgent' or 'stuck' by overview criteria
  const urgent = [];
  const stuck = [];
  const attention = [];
  const dueToday = [];
  const followupsToday = [];
  const meetingsToday = [];
  const yesterdayDone = [];
  const unreadNotes = [];

  state.clients.forEach(c => {
    if (c.stage === 'archive' || c.stage === 'execution') return;
    const daysStage = daysBetween(c.stageEnteredAt);
    const openTasks = (c.tasks || []).filter(t => (t.status||'active') !== 'done');
    const overdueTask = openTasks.find(t => t.reminderAt && new Date(t.reminderAt) < now);
    if (overdueTask) urgent.push({ client: c, task: overdueTask });
    else if (daysStage > 14) stuck.push({ client: c, days: daysStage });
    else if (daysStage > 7 && ['submission','appraisal','approval','bank'].includes(c.stage)) attention.push({ client: c, days: daysStage });

    // Due today: any task with reminderAt today
    openTasks.forEach(t => {
      if (t.reminderAt && inToday(t.reminderAt)) dueToday.push({ client: c, task: t });
      if ((t.status||'active') === 'follow-up') followupsToday.push({ client: c, task: t });
      if (t.isCoordinationTask && t.meetingDate && t.meetingDate === todayLocal()) {
        meetingsToday.push({ client: c, task: t });
      }
    });

    // Yesterday done: task history entries with status='done' in yesterday
    (c.tasks || []).forEach(t => {
      (t.history || []).forEach(h => {
        if (h.status === 'done' && inYesterday(h.at)) yesterdayDone.push({ client: c, task: t });
      });
    });

    // Unread notes
    (c.leadNotes || []).forEach(n => {
      if (!n.readByOwner) unreadNotes.push({ client: c, note: n });
    });
  });

  // Missing docs stale (24h+ without response) + banker waiting 5+ days
  const staleMissingDocs = (typeof getStaleMissingDocsAlerts === 'function' ? getStaleMissingDocsAlerts().filter(a => a.isStale) : []);
  const stuckAtBanker = (typeof getStaleAtBankerAlerts === 'function' ? getStaleAtBankerAlerts() : []);

  return { now, urgent, stuck, attention, dueToday, followupsToday, meetingsToday, yesterdayDone, unreadNotes, staleMissingDocs, stuckAtBanker };
}

  const lines = [];

  lines.push('• תקוע (14+ ימים בשלב): ' + b.stuck.length);
  lines.push('• תשומת לב (אצל בנקאי 7+ ימים): ' + b.attention.length);
  lines.push('• ⏰ ניירת שנשלחה 24+ שעות ולא הגיעה: ' + (b.staleMissingDocs||[]).length);
  lines.push('• 📞 תיקים תקועים אצל בנקאי 5+ ימים: ' + (b.stuckAtBanker||[]).length);

  lines.push('');
  if ((b.staleMissingDocs||[]).length) {
    lines.push('⏰ ניירת שנשלחה וטרם התקבלה:');
    b.staleMissingDocs.forEach(a => {
      lines.push('  • ' + a.client.name + ' — לפני ' + (a.hours < 48 ? a.hours + ' שעות' : Math.floor(a.hours/24) + ' ימים'));

    });
    lines.push('');
  }

  if (b.urgent.length) {
    lines.push('🔴 דחוף לטפל היום:');
    b.urgent.forEach(({client, task}) => lines.push('  • ' + (client.name||'—') + ' — ' + task.title + ' (תזכורת ' + fmtShort(task.reminderAt) + ')'));
    lines.push('');
  }
  if (b.meetingsToday.length) {
    lines.push('📅 פגישות היום:');
    b.meetingsToday.forEach(({client, task}) => {
      const time = task.meetingTime ? ' בשעה ' + task.meetingTime : '';
      lines.push('  • ' + (client.name||'—') + ' — ' + task.title + time);
    });
    lines.push('');
  }
  if (b.dueToday.length) {
    lines.push('⏰ תזכורות להיום:');
    b.dueToday.forEach(({client, task}) => lines.push('  • ' + (client.name||'—') + ' — ' + task.title));
    lines.push('');
  }
  if (b.stuck.length) {
    lines.push('🟠 תיקים תקועים (14+ ימים):');
    b.stuck.slice(0, 10).forEach(({client, days}) => {
      const stg = (STAGES.find(s => s.id === client.stage) || {}).label || '—';
      lines.push('  • ' + (client.name||'—') + ' — ' + stg + ' · ' + days + ' ימים');
    });
    if (b.stuck.length > 10) lines.push('  ... ועוד ' + (b.stuck.length - 10));
    lines.push('');
  }
  if (b.attention.length) {
    lines.push('🟡 אצל בנקאי 7+ ימים:');
    b.attention.slice(0, 10).forEach(({client, days}) => {
      const banker = client.bankerId ? state.settings.bankers.find(x => x.id === client.bankerId) : null;
      lines.push('  • ' + (client.name||'—') + ' — ' + (banker ? banker.name + (banker.bank?' ('+banker.bank+')':'') : '—') + ' · ' + days + ' ימים');
    });
    if (b.attention.length > 10) lines.push('  ... ועוד ' + (b.attention.length - 10));
    lines.push('');
  }
  if (b.followupsToday.length) {
    lines.push('⏳ במעקב:');
    b.followupsToday.slice(0, 10).forEach(({client, task}) => lines.push('  • ' + (client.name||'—') + ' — ' + task.title));
    if (b.followupsToday.length > 10) lines.push('  ... ועוד ' + (b.followupsToday.length - 10));
    lines.push('');
  }
  if (b.unreadNotes.length) {
    lines.push('📝 הערות שלא נקראו:');
    b.unreadNotes.slice(0, 10).forEach(({client, note}) => lines.push('  • ' + (client.name||'—') + ': ' + (note.text||'').slice(0, 80)));
    if (b.unreadNotes.length > 10) lines.push('  ... ועוד ' + (b.unreadNotes.length - 10));
    lines.push('');
  }
  if (b.yesterdayDone.length) {
    lines.push('✅ מה סגרת אתמול (' + b.yesterdayDone.length + '):');
    b.yesterdayDone.slice(0, 10).forEach(({client, task}) => lines.push('  • ' + (client.name||'—') + ' — ' + task.title));
    if (b.yesterdayDone.length > 10) lines.push('  ... ועוד ' + (b.yesterdayDone.length - 10));
    lines.push('');
  }

  const nothingToday = !b.urgent.length && !b.dueToday.length && !b.meetingsToday.length && !b.stuck.length && !b.attention.length;
  if (nothingToday) {
    lines.push('🎉 יום נקי — אין דחיפויות ואין תיקים תקועים.');
    lines.push('');
  }

  lines.push('---');
  lines.push('שיהיה יום פורה 💪');
  return lines.join('\n');
}
