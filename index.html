function onWaTimeKey(e) {
  // Allow backspace to remove ":" naturally
  if (e.key === 'Backspace') {
    const el = e.target;
    if (el.value.endsWith(':')) {
      e.preventDefault();
      el.value = el.value.slice(0, -1);
      applyMeetingDateTime();
    }
  }
}

function onWaTimeInput(e) {
  const el = e.target;
  let raw = (el.value || '').replace(/[^0-9:]/g, '');
  // Extract digits only
  const digits = raw.replace(/:/g, '');
  let formatted = digits;
  if (digits.length >= 2) {
    formatted = digits.slice(0, 2) + ':' + digits.slice(2, 4);
  }
  el.value = formatted;
  // Move cursor to end
  const pos = formatted.length;
  try { el.setSelectionRange(pos, pos); } catch (err) {}
  applyMeetingDateTime();
}

function applyMeetingDateTime() {
  const c = window._waCurrentClient;
  const tid = document.getElementById('waTemplate')?.value;
  const t = (state.settings.whatsappTemplates || []).find(x => x.id === tid);
  if (!c || !t) return;
  const dateVal = document.getElementById('waMeetingDate')?.value || '';
  const timeVal = (document.getElementById('waMeetingTime')?.value || '').trim();
  let dateStr = '', timeStr = timeVal;
  if (dateVal) {
    const dt = new Date(dateVal + 'T00:00:00');
    const days = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
    dateStr = days[dt.getDay()] + ' ' + dt.toLocaleDateString('he-IL', { day: '2-digit', month: '2-digit', year: 'numeric' });
  }
  // Re-fill template with new date/time
  const filled = fillTemplate(t.body, c)
    .replace(/\{meetingDate\}/g, dateStr || '____')
    .replace(/\{meetingTime\}/g, timeStr || '____');
  document.getElementById('waMessage').value = filled;
  updateWaPreview();
}

function updateWaPreview() {
  const raw = document.getElementById('waMessage')?.value || '';
  const preview = document.getElementById('waPreview');
  if (!preview) return;
  // WhatsApp formatting: *bold*, _italic_, ~strike~, ```mono```
  const escaped = raw
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const formatted = escaped
    .replace(/```([\s\S]+?)```/g, '<code style="background:#eef;padding:2px 4px;border-radius:4px">$1</code>')
    .replace(/\*([^\*\n]+?)\*/g, '<strong style="font-weight:800;color:#000">$1</strong>')
    .replace(/_([^_\n]+?)_/g, '<em>$1</em>')
    .replace(/~([^~\n]+?)~/g, '<s>$1</s>');
  preview.innerHTML = formatted;
}

function applyWhatsAppTemplate(clientId) {
  const tid = document.getElementById('waTemplate').value;
  const t = (state.settings.whatsappTemplates || []).find(x => x.id === tid);
  const meetingRow = document.getElementById('waMeetingRow');
  if (meetingRow) meetingRow.style.display = (tid === 'sig-reminder') ? '' : 'none';
  if (!t) { document.getElementById('waMessage').value = ''; updateWaPreview(); return; }
  const c = state.clients.find(x => x.id === clientId);
  window._waCurrentClient = c;
  // Compose: bold subject header (if present) + body
  const subjectLine = (t.subject && t.subject.trim()) ? ('*' + t.subject.trim() + '*\n\n') : '';
  let filled = fillTemplate(subjectLine + (t.body || ''), c);
  // If sig-reminder template, use current date+time inputs (leave blanks if empty)
  if (tid === 'sig-reminder') {
    applyMeetingDateTime();
    return;
  }
  document.getElementById('waMessage').value = filled;
  updateWaPreview();
}

function sendWhatsApp(clientId) {
  const c = state.clients.find(x => x.id === clientId);
  let phone = (c.phone||'').replace(/[^0-9]/g, '');
  if (!phone) { alert('אין מספר טלפון'); return; }
  // Israeli number normalization: 05X → 972 5X
  if (phone.startsWith('0')) phone = '972' + phone.slice(1);
  const message = document.getElementById('waMessage').value;
  const url = 'https://wa.me/' + phone + '?text=' + encodeURIComponent(message);
  const link = document.createElement('a');
  link.href = url; link.target = '_blank'; link.rel = 'noopener';
  document.body.appendChild(link); link.click(); document.body.removeChild(link);
  // Detect missing-docs by content — mark for 24h nag
  const isMissingDocs = /מסמכים חסרים|ניירת להשלמה|רשימת מסמכים/.test(message || '');
  const isFollowUp = /תזכורת/.test(message || '');
  logCommunication(clientId, 'whatsapp', { to: phone, messagePreview: (message||'').slice(0, 200), missingDocsRequest: isMissingDocs, followUp: isMissingDocs && isFollowUp });
  if (isMissingDocs) {
    c.missingDocsRequestSentAt = now();
    c.missingDocsRequestChannel = 'whatsapp';
    c.missingDocsRequestCount = (c.missingDocsRequestCount || 0) + 1;
    if (isFollowUp) c.missingDocsFollowUpAt = now();
  }
  closeModal();
  if (currentTab === 'dashboard') renderDashboard();
  refreshTaskAlertsFloat();
}

function renderGlobalSearchResults() {
  const q = document.getElementById('globalSearchInput').value.trim().toLowerCase();
  const el = document.getElementById('globalSearchResults');
  if (!q) { el.innerHTML = '<div class="empty" style="padding:20px">התחל להקליד לחיפוש...</div>'; return; }
  const matches = state.clients.filter(c => {
    const fields = [c.name, c.idNumber, c.phone, c.propertyAddress, c.purpose, (c.purposes||[]).join(' ')];
    (c.borrowers||[]).forEach(b => fields.push(b.name, b.idNumber, b.phone));
    (c.guarantors||[]).forEach(g => fields.push(g.name, g.idNumber, g.phone));
    const dd = c.dealDetails || {};
    if (dd.secondHand) fields.push(dd.secondHand.sellerName, dd.secondHand.buyerLawyer, dd.secondHand.sellerLawyer);
    if (dd.firstHand) fields.push(dd.firstHand.contractor, dd.firstHand.buyerLawyer, dd.firstHand.contractorLawyer);
    if (dd.tenant) fields.push(dd.tenant.name, dd.tenant.phone);
    if (c.bankerId) { const b = state.settings.bankers.find(x=>x.id===c.bankerId); if(b) fields.push(b.name, b.bank); }
    return fields.some(f => (f||'').toString().toLowerCase().includes(q));
  }).slice(0, 30);
  if (matches.length === 0) { el.innerHTML = '<div class="empty" style="padding:20px">לא נמצאו תוצאות</div>'; return; }
  el.innerHTML = matches.map(c => `
    <div style="padding:10px 12px;border-radius:8px;cursor:pointer;border:1px solid var(--border);margin-bottom:4px" onmouseover="this.style.background='#eef2ff'" onmouseout="this.style.background=''" onclick="closeModal();openClient('${c.id}')">
      <div style="font-weight:700;display:flex;align-items:center;gap:8px">
        <span>${escapeHtml(c.name)}</span>
        <span class="stage-pill" style="background:${stageInfo(c.stage).color}">${stageInfo(c.stage).label}</span>
      </div>
      <div style="font-size:12px;color:var(--muted)">📞 ${escapeHtml(c.phone||'—')} · ${escapeHtml((c.purposes||[]).join(', ')||'—')}${c.propertyAddress?' · 🏠 '+escapeHtml(c.propertyAddress):''}</div>
    </div>
  `).join('');
}

  const t = now();
  const newC = {
    id: uid(),
    // KEEP: contact/personal + income
    name: src.name,
    idNumber: src.idNumber,
    phone: src.phone,
    maritalStatus: src.maritalStatus,
    borrowers: JSON.parse(JSON.stringify(src.borrowers || [])),
    guarantors: JSON.parse(JSON.stringify(src.guarantors || [])),

    // RESET: everything deal-related
    purpose: '',
    purposes: [],
    propertyValue: 0,
    loanAmount: 0,
    propertyAddress: '',
    isRented: false,
    hasBankAccompaniment: false,
    refinanceType: '',
    registrationType: '',
    bankerId: '',
    dealDetails: {},
    approvals: [],
    submittedToBankerIds: [],
    submittedToBankerId: '',
    sentToAppraiserIds: [],
    loanComposition: { tracks: {} },
    goalsAndTasks: '',
    notes: '',
    appraisalSentStatus: 'active',
    requiresAppraisal: true,

    leadAt: t,
    clientAt: null,
    stageEnteredAt: t,
    stageHistory: [{ stage: 'lead', enteredAt: t }],
    tasks: [],

  seedStageContent(newC, 'lead');

// Separate overlay for bank accounts dialog (doesn't replace the edit modal)
function openBankAccountsDialog(which) {
  const raw = document.getElementById('fBankAccountsData' + which)?.value || '[]';
  let selected = [];
  try { selected = JSON.parse(raw); } catch(e) {}
  const banksList = (state.settings.banksList || []);
  const isSelected = bank => selected.some(s => s.bank === bank);
  const hasLoansFor = bank => { const s = selected.find(x => x.bank === bank); return s && s.hasLoans; };
  // Remove any existing overlay
  const existing = document.getElementById('bankAcOverlay');
  if (existing) existing.remove();
  const overlay = document.createElement('div');
  overlay.id = 'bankAcOverlay';
  overlay.setAttribute('data-which', which);
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,42,0.55);display:flex;align-items:center;justify-content:center;z-index:2000;padding:20px';
  overlay.innerHTML = `
    <div style="background:var(--panel);border-radius:12px;padding:24px;max-width:600px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.3)">
      <h2 style="margin:0 0 16px;font-size:20px;font-weight:700">🏦 בנקים לניהול עו"ש</h2>
      <p style="color:var(--muted);font-size:12px;margin:0 0 10px">בחר את הבנקים בהם מנוהל עו"ש. לכל בנק ניתן לסמן אם יש הלוואות (יופיע "פירוט הלוואות — [שם בנק]").</p>
      <div style="max-height:360px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;padding:6px">
        <table style="width:100%;font-size:13px">
          <thead>
            <tr style="background:#eef2ff">
              <th style="padding:6px;text-align:right">בנק</th>
              <th style="padding:6px;text-align:center;width:80px">בחר</th>
              <th style="padding:6px;text-align:center;width:100px">יש הלוואות</th>
            </tr>
          </thead>
          <tbody>
            ${banksList.map(b => `
              <tr>
                <td style="padding:6px 10px">${escapeHtml(b)}</td>
                <td style="padding:6px;text-align:center"><input type="checkbox" class="bkAcSel" data-bank="${escapeAttr(b)}" ${isSelected(b)?'checked':''} style="width:18px;height:18px;accent-color:var(--accent)"></td>
                <td style="padding:6px;text-align:center"><input type="checkbox" class="bkAcLoans" data-bank="${escapeAttr(b)}" ${hasLoansFor(b)?'checked':''} style="width:18px;height:18px;accent-color:var(--warning)"></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
      <div style="display:flex;justify-content:flex-start;gap:8px;margin-top:16px">
        <button class="btn" id="bkAcSaveBtn">💾 שמור</button>
        <button class="btn secondary" id="bkAcCancelBtn">ביטול</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById('bkAcSaveBtn').onclick = () => saveBankAccountsDialog(which);
  document.getElementById('bkAcCancelBtn').onclick = closeBankAccountsDialog;
  overlay.addEventListener('click', e => { if (e.target === overlay) closeBankAccountsDialog(); });
  overlay.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); saveBankAccountsDialog(which); }
    if (e.key === 'Escape') { e.preventDefault(); closeBankAccountsDialog(); }
  });
  // Focus a checkbox so Enter works immediately
  setTimeout(() => { const first = overlay.querySelector('.bkAcSel'); if (first) first.focus(); }, 50);
}

function closeBankAccountsDialog() {
  const el = document.getElementById('bankAcOverlay');
  if (el) el.remove();
}

function saveBankAccountsDialog(which) {
  const overlay = document.getElementById('bankAcOverlay');
  if (!overlay) return;
  const sel = Array.from(overlay.querySelectorAll('.bkAcSel:checked')).map(x => x.getAttribute('data-bank'));
  const loansSet = new Set(Array.from(overlay.querySelectorAll('.bkAcLoans:checked')).map(x => x.getAttribute('data-bank')));
  const data = sel.map(b => ({ bank: b, hasLoans: loansSet.has(b) }));
  const dataEl = document.getElementById('fBankAccountsData' + which);
  if (dataEl) { dataEl.value = JSON.stringify(data); updateBankAccountsLabel(which); }
  closeBankAccountsDialog();
}

function updateBankAccountsLabel(which) {
  const raw = document.getElementById('fBankAccountsData' + which)?.value || '[]';
  let data = [];
  try { data = JSON.parse(raw); } catch(e) {}
  const label = document.getElementById('fBankAccountsLabel' + which);
  if (!label) return;
  if (data.length === 0) { label.textContent = '— בחר בנקים —'; return; }
  label.textContent = data.map(d => d.bank + (d.hasLoans ? ' 💰' : '')).join(' · ');
}

function addSignatureTask(regType, deal) {
  const inp = document.getElementById('newSigTask_' + regType + '_' + deal);
  const val = (inp?.value || '').trim();
  if (!val) return;
  if (!state.settings.signatureTasksByRegAndDeal) state.settings.signatureTasksByRegAndDeal = {};
  if (!state.settings.signatureTasksByRegAndDeal[regType]) state.settings.signatureTasksByRegAndDeal[regType] = {};
  if (!state.settings.signatureTasksByRegAndDeal[regType][deal]) state.settings.signatureTasksByRegAndDeal[regType][deal] = [];
  state.settings.signatureTasksByRegAndDeal[regType][deal].push(val);
  save(); renderSettings();
}

function removeSignatureTask(regType, deal, idx) {
  const map = state.settings.signatureTasksByRegAndDeal;
  if (!map || !map[regType] || !map[regType][deal]) return;
  map[regType][deal].splice(idx, 1);
  save(); renderSettings();
}

        💡 כל תבנית מייל שיוצרים כאן נוצרת גם כתבנית וואטסאפ (מסומנת ב-📧). ניתן לערוך את שתיהן בנפרד בטאב "תבניות WhatsApp".
      </div>
      <div style="font-size:12px;color:var(--muted);margin-bottom:6px">משתני החלפה זמינים: <code>{name}</code>, <code>{phone}</code>, <code>{propertyAddress}</code>, <code>{stage}</code>, <code>{missingDocs}</code>, <code>{bankerName}</code>, <code>{bank}</code>, <code>{branch}</code>, <code>{branchAddress}</code>, <code>{bankerFullBranch}</code>, <code>{purpose}</code></div>
      ${(state.settings.emailTemplates||[]).map((t, i) => `
        <div style="background:#f8fafc;border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:8px">
          <div class="form-row">
            <div class="form-group" style="margin:0;flex:1"><label style="font-size:12px">כותרת</label><input value="${escapeAttr(t.title||'')}" onchange="updateEmailTemplate(${i},'title',this.value)"></div>
            <div class="form-group" style="margin:0;flex:2"><label style="font-size:12px">נושא המייל</label><input value="${escapeAttr(t.subject||'')}" onchange="updateEmailTemplate(${i},'subject',this.value)"></div>
            <div style="align-self:flex-end">
              <button class="btn danger small" onclick="removeEmailTemplate(${i})">✕ מחק</button>
            </div>
          </div>
          <div class="form-group" style="margin-top:8px;margin-bottom:0"><label style="font-size:12px">גוף המייל</label><textarea style="width:100%;min-height:120px;font-family:inherit;padding:8px;border:1px solid var(--border);border-radius:6px" onchange="updateEmailTemplate(${i},'body',this.value)">${escapeHtml(t.body||'')}</textarea></div>
        </div>
      `).join('')}
      <button class="btn small" onclick="addEmailTemplate()">+ הוסף תבנית</button>
    </div>`;

  if (id === 'appraisers') return renderAppraisersSection();
  if (id === 'contacts') return renderContactsSection();
  if (id === 'bankers') return renderBankersSection();
  if (id === 'incomeTypes') return renderIncomeTypesSection();
  if (id === 'dealDocs') return renderDealDocsSection();
  if (id === 'stageTasks') return renderStageTasksSection();
  if (id === 'stageReqs') return renderStageReqsSection();
  return '<div class="panel">בחר סעיף מהתפריט</div>';
}

const CONTACT_CATEGORIES = ['איש קשר', 'סוכן ביטוח', 'שמאי', 'בנקאי', 'עורך דין', 'קבלן', 'רואה חשבון', 'מפקח בנייה', 'יועץ מס', 'ספק שירות', 'אחר'];

function renderContactsSection() {
  const contactsBase = state.settings.contacts || [];
  const bankersList = (state.settings.bankers || []).map(b => ({
    id: b.id, name: b.name || '', category: b.category || 'בנקאי',
    company: b.bank || '', mobile: b.phone || '', phone: '',
    email: b.email || '', notes: b.branch ? ('סניף: ' + b.branch) : '',
    _sourceType: 'banker', _sourceId: b.id
  }));
  const appraisersList = (state.settings.appraisers || []).map(a => ({
    id: a.id, name: a.name || '', category: a.category || 'שמאי',
    company: '', mobile: a.phone || '', phone: '',
    email: a.email || '', notes: a.notes || '',
    _sourceType: 'appraiser', _sourceId: a.id
  }));
  const contacts = contactsBase.concat(bankersList, appraisersList);
  // Filter state — search + category
  const search = (state._contactSearch || '').toLowerCase();
  const catFilter = state._contactCatFilter || '';
  const filtered = contacts.filter(c => {
    if (catFilter && c.category !== catFilter) return false;
    if (!search) return true;
    return (c.name||'').toLowerCase().includes(search)
      || (c.mobile||'').includes(search)
      || (c.phone||'').includes(search)
      || (c.email||'').toLowerCase().includes(search)
      || (c.notes||'').toLowerCase().includes(search)
      || (c.company||'').toLowerCase().includes(search);
  }).sort((a,b) => (a.name||'').localeCompare(b.name||'', 'he'));

  const catCounts = {};
  contacts.forEach(c => { catCounts[c.category] = (catCounts[c.category] || 0) + 1; });
  // Union of fixed categories + custom categories from user + bankers/appraisers pseudo-categories
  const customCats = Array.isArray(state.settings.customContactCategories) ? state.settings.customContactCategories : [];
  const extraFromData = Array.from(new Set(contactsBase.map(c => c.category).filter(x => x && !CONTACT_CATEGORIES.includes(x) && !customCats.includes(x))));
  const allCategoriesForFilter = Array.from(new Set(CONTACT_CATEGORIES.concat(customCats, extraFromData, ['בנקאי', 'שמאי'])));

  return `<div class="panel">
    <h2 class="panel-title">👥 אנשי קשר (${contacts.length}) <span style="font-size:12px;font-weight:400;color:var(--muted)">— כולל ${bankersList.length} בנקאים ו־${appraisersList.length} שמאים</span></h2>
    <div style="background:#eff6ff;border:1px solid #93c5fd;padding:10px 14px;border-radius:8px;font-size:12px;color:#1e3a8a;margin-bottom:14px">
      💡 תצוגה מאוחדת של כל אנשי הקשר — כולל בנקאים ושמאים (מסומנים בצבע). הוסף בנקאי/שמאי על־ידי בחירת הסיווג המתאים. עריכת בנק/סניף/מגדר של בנקאי — לחץ 🏦 בשורה.
    </div>
    <div style="background:#fef3c7;border:1px solid #fbbf24;border-radius:8px;padding:12px;margin-bottom:12px">
      <div style="font-weight:700;font-size:13px;color:#78350f;margin-bottom:6px">🛡 סוכן ביטוח ברירת מחדל</div>
      <div style="font-size:12px;color:var(--muted);margin-bottom:6px">אליו יישלחו בקשות הצעת ביטוח מתוך משימת "שלח פרטים לקבלת הצעת ביטוח" בשלב חתימות.</div>
      <select onchange="setDefaultInsuranceContact(this.value)" style="width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:6px">
        <option value="">— לא הוגדר —</option>
        ${contacts.slice().sort((a,b)=>(a.name||'').localeCompare(b.name||'','he')).map(c => `<option value="${c.id}" ${state.settings.defaultInsuranceContactId===c.id?'selected':''}>${escapeHtml(c.name)}${c.company?' · '+escapeHtml(c.company):''}${c.category?' · '+escapeHtml(c.category):''}</option>`).join('')}
      </select>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">
      <input id="contactSearchInp" placeholder="🔍 חיפוש לפי שם / טלפון / מייל / הערות" value="${escapeAttr(state._contactSearch||'')}" oninput="state._contactSearch=this.value;renderSettings();const el=document.getElementById('contactSearchInp');if(el){el.focus();try{const v=el.value;el.setSelectionRange(v.length,v.length);}catch(e){}}" style="flex:1;min-width:220px;padding:8px 12px;border:1px solid var(--border);border-radius:8px">
      <select onchange="state._contactCatFilter=this.value;renderSettings()" style="padding:8px 12px;border:1px solid var(--border);border-radius:8px">
        <option value="">כל הסיווגים (${contacts.length})</option>
        ${allCategoriesForFilter.map(c => `<option value="${escapeAttr(c)}" ${catFilter===c?'selected':''}>${escapeHtml(c)} (${catCounts[c]||0})</option>`).join('')}
      </select>
      <button class="btn secondary small" onclick="openManageCategoriesDialog()" title="נהל את רשימת הסיווגים — הוסף/מחק סיווגים משלך" style="padding:6px 12px">🏷️ נהל סיווגים</button>
    </div>
    <div style="background:#f8fafc;border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:12px">
      <div style="font-weight:700;color:#334155;font-size:13px;margin-bottom:8px">➕ הוסף איש קשר חדש</div>
      <div class="form-row">
        <div class="form-group" style="flex:1;margin:0"><label style="font-size:11px">שם *</label><input id="newContactName" placeholder="שם מלא" style="width:100%"></div>
        <div class="form-group" style="width:90px;margin:0"><label style="font-size:11px">כינוי</label>
          <select id="newContactGender" title="נדרש לפניה נכונה במיילים ובוואטסאפ">
            <option value="male">מר</option>
            <option value="female">גברת</option>
          </select>
        </div>
        <div class="form-group" style="flex:1;margin:0"><label style="font-size:11px">סיווג *</label>
          <select id="newContactCategory" onchange="toggleContactCategoryCustom('new');toggleNewBankerFields()">
            ${CONTACT_CATEGORIES.map(c => `<option value="${escapeAttr(c)}">${escapeHtml(c)}</option>`).join('')}
            ${customCats.map(c => `<option value="${escapeAttr(c)}">${escapeHtml(c)}</option>`).join('')}
            <option value="בנקאי">🏦 בנקאי</option>
            <option value="שמאי">📐 שמאי</option>
            <option value="__custom__">✎ מלל חופשי…</option>
          </select>
          <input id="newContactCategoryCustom" placeholder="הקלד סיווג חדש…" style="display:none;margin-top:6px;width:100%">
        </div>
      </div>
      <div id="newBankerFields" class="form-row" style="margin-top:8px;display:none;background:#dcfce7;padding:8px;border-radius:6px">
        <div class="form-group" style="flex:1;margin:0"><label style="font-size:11px">בנק</label><input id="newBankerBankInp" placeholder="מזרחי / פאג״י / ..."></div>
        <div class="form-group" style="flex:1;margin:0"><label style="font-size:11px">סניף</label><input id="newBankerBranchInp" placeholder="מס' / שם"></div>
      </div>
      <div class="form-row" style="margin-top:8px">
        <div class="form-group" style="flex:1;margin:0"><label style="font-size:11px">📱 נייד</label><input id="newContactMobile" type="tel" placeholder="050-..."></div>
        <div class="form-group" style="flex:1;margin:0"><label style="font-size:11px">☎️ טלפון</label><input id="newContactPhone" type="tel" placeholder="02-..."></div>
      </div>
      <div class="form-row" style="margin-top:8px">
        <div class="form-group" style="flex:1;margin:0"><label style="font-size:11px">מייל</label><input id="newContactEmail" type="email" placeholder="name@..."></div>
        <div class="form-group" style="flex:1;margin:0"><label style="font-size:11px">חברה</label><input id="newContactCompany" placeholder="שם חברה"></div>
      </div>
      <div class="form-group" style="margin-top:8px;margin-bottom:0"><label style="font-size:11px">הערות</label><input id="newContactNotes" placeholder="מידע נוסף..."></div>
      <button class="btn small" onclick="addContact()" style="margin-top:8px">+ הוסף</button>
    </div>
    ${filtered.length === 0 ? '<div style="text-align:center;color:var(--muted);padding:20px">אין אנשי קשר מתאימים</div>' :
      `<table style="width:100%;border-collapse:collapse;font-size:13px">
        <thead>
          <tr style="background:#eef2ff;font-size:12px">
            <th style="padding:8px;text-align:right">שם</th>
            <th style="padding:8px;text-align:right">סיווג</th>
            <th style="padding:8px;text-align:right">חברה</th>
            <th style="padding:8px;text-align:right">📱 נייד</th>
            <th style="padding:8px;text-align:right">☎️ טלפון</th>
            <th style="padding:8px;text-align:right">מייל</th>
            <th style="padding:8px;text-align:right">הערות</th>
            <th style="padding:8px;text-align:center;width:80px">פעולות</th>
          </tr>
        </thead>
        <tbody>
          ${filtered.map((c, i) => {
            const idx = contactsBase.findIndex(x => x.id === c.id);
            const isBanker = c._sourceType === 'banker';
            const isAppraiser = c._sourceType === 'appraiser';
            const catBg = isBanker ? '#dcfce7' : (isAppraiser ? '#fef3c7' : '#eef2ff');
            const catColor = isBanker ? '#166534' : (isAppraiser ? '#92400e' : 'var(--accent)');
            const editAction = isBanker ? `unifiedEditContact('banker','${c._sourceId}')` : (isAppraiser ? `unifiedEditContact('appraiser','${c._sourceId}')` : `unifiedEditContact('contact','${c.id}')`);
            const removeAction = isBanker ? `removeBanker('${c._sourceId}')` : (isAppraiser ? `removeAppraiser('${c._sourceId}')` : `removeContact(${idx})`);
            return `<tr style="border-top:1px solid var(--border)">
              <td style="padding:8px"><strong>${escapeHtml(c.name||'')}</strong></td>
              <td style="padding:8px"><span style="background:${catBg};color:${catColor};padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700">${escapeHtml(c.category||'')}</span></td>
              <td style="padding:8px">${escapeHtml(c.company||'—')}</td>
              <td style="padding:8px">${c.mobile ? `<a href="tel:${escapeAttr(c.mobile)}" style="color:inherit">${escapeHtml(c.mobile)}</a>` : '—'}</td>
              <td style="padding:8px">${c.phone ? `<a href="tel:${escapeAttr(c.phone)}" style="color:inherit">${escapeHtml(c.phone)}</a>` : '—'}</td>
              <td style="padding:8px">${c.email ? `<a href="mailto:${escapeAttr(c.email)}" style="color:inherit">${escapeHtml(c.email)}</a>` : '—'}</td>
              <td style="padding:8px;font-size:11px;color:var(--muted)">${escapeHtml(c.notes||'')}</td>
              <td style="padding:8px;text-align:center;white-space:nowrap">
                <button class="icon-btn" onclick="${editAction}" title="ערוך">✎</button>
                ${isBanker ? `<button class="icon-btn" onclick="editBanker('${c._sourceId}')" title="בנק / סניף / מגדר">🏦</button>` : ''}
                <button class="icon-btn" onclick="${removeAction}" title="מחק" style="color:var(--danger)">✕</button>
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>`}
  </div>`;
}

function setDefaultInsuranceContact(id) {
  state.settings.defaultInsuranceContactId = id || '';
  save();
}

function openManageCategoriesDialog() {
  const custom = Array.isArray(state.settings.customContactCategories) ? state.settings.customContactCategories : [];
  showModal(`
    <h2 class="modal-title">🏷️ ניהול סיווגי אנשי קשר</h2>
    <p style="color:var(--muted);font-size:13px;margin:0 0 12px">כאן אפשר להוסיף סיווגים חדשים משלך שיופיעו ב־dropdown של הוספת/עריכת איש קשר וגם בסינון.</p>

    <div style="background:#f8fafc;border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:12px">
      <div style="font-weight:700;color:#334155;font-size:13px;margin-bottom:8px">➕ הוסף סיווג חדש</div>
      <div style="display:flex;gap:8px">
        <input id="mgrNewCategory" placeholder="למשל: מתווך, יועץ פנסיוני..." style="flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:6px" onkeydown="if(event.key==='Enter'){event.preventDefault();addCustomCategory();}">
        <button class="btn" onclick="addCustomCategory()">+ הוסף</button>
      </div>
    </div>

    <div style="margin-bottom:10px">
      <div style="font-weight:700;color:#334155;font-size:13px;margin-bottom:6px">סיווגי ברירת מחדל (לא ניתנים לעריכה):</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px">
        ${CONTACT_CATEGORIES.map(c => `<span style="background:#e2e8f0;color:#475569;padding:4px 10px;border-radius:999px;font-size:12px">${escapeHtml(c)}</span>`).join('')}
      </div>
    </div>

    <div>
      <div style="font-weight:700;color:#334155;font-size:13px;margin-bottom:6px">הסיווגים שלך (${custom.length}):</div>
      ${custom.length === 0
        ? '<div style="color:var(--muted);font-size:13px;padding:12px;background:#f8fafc;border-radius:6px;text-align:center">עדיין לא הוספת סיווגים משלך</div>'
        : `<div style="display:flex;flex-wrap:wrap;gap:6px">
            ${custom.map((c, i) => `<span style="background:#dbeafe;color:#1e40af;padding:4px 10px;border-radius:999px;font-size:12px;display:inline-flex;align-items:center;gap:6px">
              ${escapeHtml(c)}
              <button onclick="removeCustomCategory(${i})" title="מחק" style="background:none;border:none;color:#dc2626;cursor:pointer;font-size:14px;padding:0;line-height:1">✕</button>
            </span>`).join('')}
          </div>`}
    </div>

    <div class="modal-actions" style="margin-top:16px">
      <button class="btn secondary" onclick="closeModal()">סגור</button>
    </div>
  `);
}

function addCustomCategory() {
  const inp = document.getElementById('mgrNewCategory');
  const val = (inp && inp.value || '').trim();
  if (!val) { alert('הקלד שם סיווג'); return; }
  if (!Array.isArray(state.settings.customContactCategories)) state.settings.customContactCategories = [];
  if (CONTACT_CATEGORIES.includes(val) || state.settings.customContactCategories.includes(val)) {
    alert('הסיווג "' + val + '" כבר קיים');
    return;
  }
  state.settings.customContactCategories.push(val);
  save();
  openManageCategoriesDialog();
  renderSettings();
}

function removeCustomCategory(idx) {
  const cat = (state.settings.customContactCategories || [])[idx];
  if (!cat) return;
  // Warn if in use
  const inUse = (state.settings.contacts || []).filter(c => c.category === cat).length;
  const msg = inUse > 0
    ? 'הסיווג "' + cat + '" בשימוש אצל ' + inUse + ' אנשי קשר. אם תמחק — הם יופיעו עם הסיווג הזה אך הוא לא יופיע יותר ברשימה. להמשיך?'
    : 'למחוק את הסיווג "' + cat + '"?';
  if (!confirm(msg)) return;
  state.settings.customContactCategories.splice(idx, 1);
  save();
  openManageCategoriesDialog();
  renderSettings();
}

function toggleContactCategoryCustom(mode) {
  const prefix = mode === 'edit' ? 'editContact' : 'newContact';
  const sel = document.getElementById(prefix + 'Category');
  const inp = document.getElementById(prefix + 'CategoryCustom');
  if (!sel || !inp) return;
  if (sel.value === '__custom__') {
    inp.style.display = '';
    inp.focus();
  } else {
    inp.style.display = 'none';
    inp.value = '';
  }
}

function resolveContactCategory(mode) {
  const prefix = mode === 'edit' ? 'editContact' : 'newContact';
  const sel = document.getElementById(prefix + 'Category');
  const inp = document.getElementById(prefix + 'CategoryCustom');
  let cat = (sel && sel.value) || '';
  if (cat === '__custom__') {
    cat = (inp && inp.value || '').trim();
    if (cat) {
      if (!Array.isArray(state.settings.customContactCategories)) state.settings.customContactCategories = [];
      if (!CONTACT_CATEGORIES.includes(cat) && !state.settings.customContactCategories.includes(cat)) {
        state.settings.customContactCategories.push(cat);
      }
    }
  }
  return cat || 'איש קשר';
}

function toggleNewBankerFields() {
  const sel = document.getElementById('newContactCategory');
  const wrap = document.getElementById('newBankerFields');
  if (!sel || !wrap) return;
  wrap.style.display = (sel.value === 'בנקאי') ? 'flex' : 'none';
}

function addContact() {
  const name = (document.getElementById('newContactName').value || '').trim();
  const category = resolveContactCategory('new');
  const gender = (document.getElementById('newContactGender')||{}).value || 'male';
  const mobile = (document.getElementById('newContactMobile').value || '').trim();
  const phone = (document.getElementById('newContactPhone').value || '').trim();
  const email = (document.getElementById('newContactEmail').value || '').trim();
  const company = (document.getElementById('newContactCompany').value || '').trim();
  const notes = (document.getElementById('newContactNotes').value || '').trim();
  if (!name) { alert('שם חובה'); return; }

  if (category === 'בנקאי') {
    const bank = ((document.getElementById('newBankerBankInp')||{}).value || '').trim();
    const branch = ((document.getElementById('newBankerBranchInp')||{}).value || '').trim();
    if (!Array.isArray(state.settings.bankers)) state.settings.bankers = [];
    state.settings.bankers.push({ id: uid(), name, gender, bank, branch, branchAddress: '', phone: mobile || phone, mobile, phone2: phone, email, notes });
  } else if (category === 'שמאי') {
    if (!Array.isArray(state.settings.appraisers)) state.settings.appraisers = [];
    state.settings.appraisers.push({ id: uid(), name, gender, phone: mobile || phone, mobile, phone2: phone, email, notes });
  } else {
    if (!Array.isArray(state.settings.contacts)) state.settings.contacts = [];
    state.settings.contacts.push({ id: uid(), name, category, gender, mobile, phone, email, company, notes });
  }
  save();
  renderSettings();
}

function removeContact(idx) {
  if (!confirm('למחוק את איש הקשר?')) return;
  state.settings.contacts.splice(idx, 1);
  save();
  renderSettings();
}

function editContact(idx) {
  const c = state.settings.contacts[idx];
  if (!c) return;
  const customCats = Array.isArray(state.settings.customContactCategories) ? state.settings.customContactCategories : [];
  const inList = CONTACT_CATEGORIES.includes(c.category) || customCats.includes(c.category);
  const selectedValue = inList ? c.category : (c.category ? '__custom__' : 'איש קשר');
  showModal(`
    <h2 class="modal-title">✎ עריכת איש קשר</h2>
    <div class="form-row">
      <div class="form-group" style="flex:1"><label>שם</label><input id="editContactName" value="${escapeAttr(c.name||'')}"></div>
      <div class="form-group" style="flex:1"><label>סיווג</label>
        <select id="editContactCategory" onchange="toggleContactCategoryCustom('edit')">
          ${CONTACT_CATEGORIES.map(cat => `<option value="${escapeAttr(cat)}" ${selectedValue===cat?'selected':''}>${escapeHtml(cat)}</option>`).join('')}
          ${customCats.map(cat => `<option value="${escapeAttr(cat)}" ${selectedValue===cat?'selected':''}>${escapeHtml(cat)}</option>`).join('')}

// Unified contact edit — same form (שם / סיווג / נייד / טלפון / מייל / הערות) for contacts, bankers, appraisers.
// For bankers/appraisers, specialized fields (bank/branch/gender) are preserved on the record but not editable here.
function unifiedEditContact(sourceType, id) {
  let record = null, idx = -1;
  if (sourceType === 'banker') {
    record = (state.settings.bankers || []).find(x => x.id === id);
  } else if (sourceType === 'appraiser') {
    record = (state.settings.appraisers || []).find(x => x.id === id);
  } else {
    idx = (state.settings.contacts || []).findIndex(x => x.id === id);
    record = idx >= 0 ? state.settings.contacts[idx] : null;
  }
  if (!record) { alert('הרשומה לא נמצאה'); return; }

  // Derive current values from source's schema. record.category (if set) overrides the source-type default.
  const currentCategory = record.category
                        || (sourceType === 'banker' ? 'בנקאי'
                          : sourceType === 'appraiser' ? 'שמאי'
                          : 'איש קשר');
  const currentMobile = record.mobile || (sourceType !== 'contact' ? (record.phone || '') : '');
  const currentPhone = sourceType === 'contact' ? (record.phone || '') : (record.mobile ? (record.phone || '') : '');
  const currentEmail = record.email || '';
  const currentNotes = record.notes || (sourceType === 'banker' && record.branch ? ('סניף: ' + record.branch) : '');

  const customCats = Array.isArray(state.settings.customContactCategories) ? state.settings.customContactCategories : [];
  const inList = CONTACT_CATEGORIES.includes(currentCategory) || customCats.includes(currentCategory) || currentCategory === 'בנקאי' || currentCategory === 'שמאי';
  const selectedValue = inList ? currentCategory : (currentCategory ? '__custom__' : 'איש קשר');
  const isSpecialType = sourceType === 'banker' || sourceType === 'appraiser';
  const specialNote = sourceType === 'banker'
    ? `<div style="background:#dcfce7;border:1px solid #86efac;padding:8px 10px;border-radius:6px;font-size:12px;color:#166534;margin-bottom:10px">🏦 <strong>בנקאי</strong>${record.bank ? ' · ' + escapeHtml(record.bank) : ''}${record.branch ? ' · סניף ' + escapeHtml(record.branch) : ''}. לעריכת בנק/סניף/מגדר — לחץ 🏦 בשורה של הבנקאי.</div>`
    : sourceType === 'appraiser'
      ? '<div style="background:#fef3c7;border:1px solid #fbbf24;padding:8px 10px;border-radius:6px;font-size:12px;color:#92400e;margin-bottom:10px">📐 <strong>שמאי</strong></div>'
      : '';

  const currentGender = record.gender || (typeof detectBankerGender === 'function' ? detectBankerGender(record) : 'male');
  showModal(`
    <h2 class="modal-title">✎ עריכת איש קשר</h2>
    ${specialNote}
    <div class="form-row">
      <div class="form-group" style="flex:1"><label>1. שם</label><input id="uecName" value="${escapeAttr(record.name||'')}" style="width:100%"></div>
      <div class="form-group" style="width:110px"><label>כינוי</label>
        <select id="uecGender" title="נדרש לפניה נכונה במיילים ובוואטסאפ">
          <option value="male" ${currentGender==='male'?'selected':''}>מר</option>
          <option value="female" ${currentGender==='female'?'selected':''}>גברת</option>
        </select>
      </div>
    </div>
    <div class="form-group"><label>2. סיווג</label>
      <select id="uecCategory" onchange="uecToggleCustom()" style="width:100%">
        ${CONTACT_CATEGORIES.map(cat => `<option value="${escapeAttr(cat)}" ${selectedValue===cat?'selected':''}>${escapeHtml(cat)}</option>`).join('')}
        ${customCats.map(cat => `<option value="${escapeAttr(cat)}" ${selectedValue===cat?'selected':''}>${escapeHtml(cat)}</option>`).join('')}
        <option value="__custom__" ${selectedValue==='__custom__'?'selected':''}>✎ מלל חופשי…</option>
      </select>
      <input id="uecCategoryCustom" placeholder="הקלד סיווג חדש…" style="display:${selectedValue==='__custom__'?'block':'none'};margin-top:6px;width:100%" value="${selectedValue==='__custom__'?escapeAttr(currentCategory||''):''}">
    </div>
    <div class="form-row">
      <div class="form-group" style="flex:1"><label>3. 📱 נייד</label><input id="uecMobile" type="tel" value="${escapeAttr(currentMobile)}"></div>
      <div class="form-group" style="flex:1"><label>4. ☎️ טלפון</label><input id="uecPhone" type="tel" value="${escapeAttr(currentPhone)}"></div>
    </div>
    <div class="form-group"><label>5. מייל</label><input id="uecEmail" type="email" value="${escapeAttr(currentEmail)}" style="width:100%"></div>
    <div class="form-group"><label>6. הערות</label><textarea id="uecNotes" style="width:100%;min-height:80px;padding:8px;border:1px solid var(--border);border-radius:6px;font-family:inherit">${escapeHtml(currentNotes)}</textarea></div>
    <div class="modal-actions">
      <button class="btn" onclick="saveUnifiedContact('${sourceType}','${id}')">💾 שמור</button>
      <button class="btn secondary" onclick="closeModal()">ביטול</button>
    </div>
  `);
}

function uecToggleCustom() {
  const sel = document.getElementById('uecCategory');
  const inp = document.getElementById('uecCategoryCustom');
  if (!sel || !inp) return;

  else { inp.style.display = 'none'; inp.value = ''; }
}

function saveUnifiedContact(sourceType, id) {
  const name = (document.getElementById('uecName').value || '').trim();
  if (!name) { alert('שם חובה'); return; }
  const sel = document.getElementById('uecCategory');
  const inp = document.getElementById('uecCategoryCustom');
  let category = (sel && sel.value) || '';
  if (category === '__custom__') {
    category = (inp && inp.value || '').trim();
    if (category) {
      if (!Array.isArray(state.settings.customContactCategories)) state.settings.customContactCategories = [];
      if (!CONTACT_CATEGORIES.includes(category) && !state.settings.customContactCategories.includes(category)) {
        state.settings.customContactCategories.push(category);
      }
    }
  }
  if (!category) category = 'איש קשר';
  const mobile = (document.getElementById('uecMobile').value || '').trim();
  const phone = (document.getElementById('uecPhone').value || '').trim();
  const email = (document.getElementById('uecEmail').value || '').trim();
  const notes = (document.getElementById('uecNotes').value || '').trim();
  const gender = (document.getElementById('uecGender') || {}).value || 'male';

  if (sourceType === 'banker') {
    const b = (state.settings.bankers || []).find(x => x.id === id);
    if (!b) { alert('בנקאי לא נמצא'); return; }
    b.name = name;
    // Bankers historically stored only "phone" — keep it as the mobile field (used across the system for WhatsApp)
    b.phone = mobile || phone;
    b.mobile = mobile;
    b.phone2 = phone;
    b.email = email;
    b.notes = notes;
    b.gender = gender;
    b.category = category; // allow the user to override the display category
    // bank/branch/branchAddress preserved as-is
  } else if (sourceType === 'appraiser') {
    const a = (state.settings.appraisers || []).find(x => x.id === id);
    if (!a) { alert('שמאי לא נמצא'); return; }
    a.name = name;
    a.phone = mobile || phone;
    a.mobile = mobile;
    a.phone2 = phone;
    a.email = email;
    a.notes = notes;
    a.gender = gender;
    a.category = category;
  } else {
    const c = (state.settings.contacts || []).find(x => x.id === id);
    if (!c) { alert('איש קשר לא נמצא'); return; }
    c.name = name;
    c.category = category;
    c.mobile = mobile;
    c.phone = phone;
    c.email = email;
    c.notes = notes;
    c.gender = gender;
    // company field preserved as-is (not in unified form)
  }
  save();
  closeModal();
  renderSettings();
}

// Silent variant used on app startup — adds any configured stage tasks/requirements that are missing
// from existing clients, without an alert / confirmation.
// Matches "title" against existing stage tasks loosely so legacy renamed-and-done tasks
// (e.g. the old "הוגש ב:" being renamed to "הוגש ל: X") are still recognised as present
// and don't get re-added by the silent sync.
function _hasEquivalentStageTask(c, stageId, title) {
  const firstWord = (title || '').trim().split(/\s+/)[0] || '';
  return (c.tasks || []).some(t => {
    if (t.stage !== stageId) return false;
    if (t.title === title) return true;
    // Legacy variants: if the settings title starts with "הוגש" and the existing done task
    // also starts with "הוגש" — treat as the same task (it was renamed by confirmSubmittedTo).
    if (firstWord === 'הוגש' && (t.title || '').startsWith('הוגש') && (t.done || t.status === 'done')) return true;
    return false;
  });
}

function _silentSyncStageDefaults() {
  const tasksMap = (state.settings && state.settings.stageTasks) || {};
  const reqsMap = (state.settings && state.settings.stageRequirements) || {};
  let changed = false;
  // Universal appraisal task: "הפניה לשמאי" — must exist on every client that reached the appraisal stage
  const apprIdx = STAGES.findIndex(s => s.id === 'appraisal');
  if (apprIdx >= 0) {
    (state.clients || []).forEach(c => {
      if (c.stage === 'lead') return;
      const curIdx = STAGES.findIndex(x => x.id === c.stage);
      if (curIdx < apprIdx) return;
      if (c.requiresAppraisal === false) return;
      if (!(c.tasks || []).some(t => t.stage === 'appraisal' && t.title === 'הפניה לשמאי')) {
        c.tasks = c.tasks || [];
        c.tasks.push({ id: uid(), stage: 'appraisal', title: 'הפניה לשמאי', status: 'active', done: false, doneAt: null, createdAt: now(), history: [{ status: 'active', at: now(), note: 'סונכרן אוטומטית' }], source: 'appraisal-seed' });
        changed = true;
      }
    });
  }
  STAGES.forEach((s, stageIdx) => {
    const stageId = s.id;
    const taskTitles = Array.isArray(tasksMap[stageId]) ? tasksMap[stageId] : [];
    const reqNames = Array.isArray(reqsMap[stageId]) ? reqsMap[stageId] : [];
    if (!taskTitles.length && !reqNames.length) return;
    (state.clients || []).forEach(c => {
      if (c.stage === 'lead' && stageId !== 'lead') return;
      const curIdx = STAGES.findIndex(x => x.id === c.stage);
      if (curIdx < stageIdx) return;
      taskTitles.forEach(title => {
        if (!_hasEquivalentStageTask(c, stageId, title)) {
          c.tasks.push({ id: uid(), stage: stageId, title, status: 'active', done: false, doneAt: null, createdAt: now(), history: [{ status: 'active', at: now(), note: 'סונכרן מההגדרות' }] });
          changed = true;
        }
      });
      c.requirements = c.requirements || [];
      reqNames.forEach(name => {
        if (!c.requirements.some(r => r.stage === stageId && r.name === name)) {
          c.requirements.push({ id: uid(), stage: stageId, name, status: 'pending' });
          changed = true;
        }
      });
    });
  });
  if (changed) {
    save();
    if (typeof renderClientDetail === 'function' && currentTab === 'detail') renderClientDetail();
    if (typeof renderKanban === 'function') renderKanban();
  }
}

// Sync all configured stage tasks + requirements to every existing client that has already visited the
// relevant stage. Used by the "🔄 סנכרן תיקים קיימים" button in settings — handy when the user already
// added items to settings before this feature existed and wants them backfilled onto older clients.
function syncStageDefaultsToAllClients() {
  const tasksMap = state.settings.stageTasks || {};
  const reqsMap = state.settings.stageRequirements || {};
  let addedTasks = 0, addedReqs = 0, affectedClients = new Set();
  STAGES.forEach((s, stageIdx) => {
    const stageId = s.id;
    const taskTitles = Array.isArray(tasksMap[stageId]) ? tasksMap[stageId] : [];
    const reqNames = Array.isArray(reqsMap[stageId]) ? reqsMap[stageId] : [];
    if (!taskTitles.length && !reqNames.length) return;
    (state.clients || []).forEach(c => {
      if (c.stage === 'lead' && stageId !== 'lead') return;
      const curIdx = STAGES.findIndex(x => x.id === c.stage);
      if (curIdx < stageIdx) return;
      taskTitles.forEach(title => {
        if (!c.tasks.some(t => t.stage === stageId && t.title === title)) {
          c.tasks.push({ id: uid(), stage: stageId, title, status: 'active', done: false, doneAt: null, createdAt: now(), history: [{ status: 'active', at: now(), note: 'סונכרן מההגדרות' }] });
          addedTasks++; affectedClients.add(c.id);
        }
      });
      c.requirements = c.requirements || [];
      reqNames.forEach(name => {
        if (!c.requirements.some(r => r.stage === stageId && r.name === name)) {
          c.requirements.push({ id: uid(), stage: stageId, name, status: 'pending' });
          addedReqs++; affectedClients.add(c.id);
        }
      });
    });
  });
  if (addedTasks === 0 && addedReqs === 0) {
    alert('כל התיקים כבר מכילים את ברירות המחדל — לא נדרש סנכרון.');
    return;
  }
  save();
  if (typeof renderClientDetail === 'function' && currentTab === 'detail') renderClientDetail();
  if (typeof renderKanban === 'function') renderKanban();
  alert('✓ הסנכרון הושלם:\n\n• משימות נוספו: ' + addedTasks + '\n• מסמכים נוספו: ' + addedReqs + '\n• תיקים שעודכנו: ' + affectedClients.size);
}

// Adds a newly-created stage task/requirement to all existing clients that have already visited
// that stage — silently, no confirmation prompt. "Visited" = client's current stage index is >= the
// target stage's index (so passed through or currently on it).
function _propagateNewStageItemToClients(stageId, title, kind) {
  const stageIdx = STAGES.findIndex(s => s.id === stageId);
  if (stageIdx < 0) return;
  const affected = (state.clients || []).filter(c => {
    if (c.stage === 'lead' && stageId !== 'lead') return false;
    const curIdx = STAGES.findIndex(s => s.id === c.stage);
    if (curIdx < stageIdx) return false; // hasn't reached that stage yet
    if (kind === 'task') return !c.tasks.some(t => t.stage === stageId && t.title === title);
    return !(c.requirements || []).some(r => r.stage === stageId && r.name === title);
  });
  if (affected.length === 0) return;
  affected.forEach(c => {
    if (kind === 'task') {
      c.tasks.push({ id: uid(), stage: stageId, title, status: 'active', done: false, doneAt: null, createdAt: now(), history: [{ status: 'active', at: now(), note: 'נוספה אוטומטית מהגדרות' }] });
    } else {
      c.requirements = c.requirements || [];
      c.requirements.push({ id: uid(), stage: stageId, name: title, status: 'pending' });
    }
  });
  if (typeof renderClientDetail === 'function' && currentTab === 'detail') renderClientDetail();
}

// Ensure every email template has a matching WhatsApp template so they're usable in both channels.
// Mirrored templates carry id "wa-mirror-<emailId>". Only NEW mirrors are added — existing ones keep any user edits.
function syncEmailTemplatesToWhatsApp() {
  if (!Array.isArray(state.settings.emailTemplates)) return;
  if (!Array.isArray(state.settings.whatsappTemplates)) state.settings.whatsappTemplates = [];
  const emails = state.settings.emailTemplates;
  const wa = state.settings.whatsappTemplates;
  emails.forEach(et => {
    const mirrorId = 'wa-mirror-' + et.id;
    if (wa.some(t => t.id === mirrorId)) return; // already exists — don't overwrite user edits
    const title = (et.title || 'תבנית מייל') + ' 📧';
    // Use the same subject/body split — the sender adds *subject*\n\n automatically
    wa.push({ id: mirrorId, title, subject: et.subject || '', body: et.body || '' });
  });
}
function resetWaTemplate(id) {
  const def = (DEFAULT_DATA.settings.whatsappTemplates||[]).find(t => t.id === id);

  t.title = def.title;

  alert('התבנית שוחזרה בהצלחה');
}

// On mobile, don't just try mailto (relies on OS defaults). Show a proper "ready to send" popup with:
// - a big "פתח באפליקציה" button
// - explicit "העתק" buttons for to/subject/body
// - fallback options if the mail app doesn't open
(function(){
  const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
  if (!isMobile) return;
  const isAndroid = /Android/i.test(navigator.userAgent);

  function isGmailComposeUrl(url) {
    return typeof url === 'string' && url.indexOf('mail.google.com/mail/') !== -1 && (url.indexOf('view=cm') !== -1 || url.indexOf('fs=1') !== -1);
  }

  function parseGmailUrl(url) {
    try {
      const q = url.split('?')[1] || '';
      const params = new URLSearchParams(q);
      return {
        to: params.get('to') || '',
        cc: params.get('cc') || '',
        subject: params.get('su') || '',
        body: params.get('body') || ''
      };
    } catch (e) { return null; }
  }

  function buildMailto(p) {
    let m = 'mailto:' + p.to;
    const parts = [];
    if (p.cc) parts.push('cc=' + encodeURIComponent(p.cc));
    if (p.subject) parts.push('subject=' + encodeURIComponent(p.subject));
    if (p.body) parts.push('body=' + encodeURIComponent(p.body));
    if (parts.length) m += '?' + parts.join('&');
    return m;
  }

  // Android — Gmail-specific intent URL that opens Gmail directly with subject/body populated.
  // Uses S.EXTRA fields (the reliable way to pass compose fields to Gmail on Android).
  function buildGmailAndroidIntent(p) {
    const extras = [];
    if (p.subject) extras.push('S.android.intent.extra.SUBJECT=' + encodeURIComponent(p.subject).replace(/#/g, '%23'));
    if (p.body) extras.push('S.android.intent.extra.TEXT=' + encodeURIComponent(p.body).replace(/#/g, '%23'));
    if (p.cc) extras.push('S.android.intent.extra.CC=' + encodeURIComponent(p.cc).replace(/#/g, '%23'));
    // action=SENDTO + data=mailto: → Gmail treats as compose to that address
    return 'intent:#Intent;action=android.intent.action.SENDTO;data=' + encodeURIComponent('mailto:' + (p.to||'')) + (extras.length ? ';' + extras.join(';') : '') + ';package=com.google.android.gm;end';
  }

  // iOS — direct Gmail app URL scheme
  function buildGmailIosScheme(p) {
    const parts = [];
    if (p.to) parts.push('to=' + encodeURIComponent(p.to));
    if (p.cc) parts.push('cc=' + encodeURIComponent(p.cc));
    if (p.subject) parts.push('subject=' + encodeURIComponent(p.subject));
    if (p.body) parts.push('body=' + encodeURIComponent(p.body));
    return 'googlegmail://co' + (parts.length ? '?' + parts.join('&') : '');
  }

  function showMobileMailPopup(p) {
    // Remove existing popup if any
    const old = document.getElementById('mobileMailPopup'); if (old) old.remove();
    const overlay = document.createElement('div');
    overlay.id = 'mobileMailPopup';
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:99999;display:flex;align-items:flex-end;justify-content:center;padding:0;font-family:inherit;direction:rtl';
    const mailto = buildMailto(p);
    const gmailIntent = isAndroid ? buildGmailAndroidIntent(p) : buildGmailIosScheme(p);
    overlay.innerHTML = `
      <div style="background:#fff;border-radius:16px 16px 0 0;max-width:640px;width:100%;max-height:90vh;display:flex;flex-direction:column;overflow:hidden">
        <div style="padding:14px 18px;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center">
          <h3 style="margin:0;font-size:17px;color:#1e40af">📧 שליחת מייל</h3>
          <button onclick="document.getElementById('mobileMailPopup').remove()" style="background:none;border:none;font-size:24px;color:#6b7280;cursor:pointer;line-height:1;padding:0 4px">✕</button>
        </div>
        <div style="padding:14px 18px;overflow-y:auto;flex:1">
          <div style="margin-bottom:12px">
            <a href="${gmailIntent}" onclick="setTimeout(function(){document.getElementById('mobileMailPopup')&&document.getElementById('mobileMailPopup').remove()},300)" style="display:block;padding:14px;background:linear-gradient(135deg,#ea4335,#c62828);color:#fff;text-align:center;text-decoration:none;border-radius:10px;font-weight:700;font-size:15px;box-shadow:0 4px 12px rgba(234,67,53,0.35)">📧 פתח ב־Gmail (אפליקציה)</a>
          </div>
          <div style="margin-bottom:12px">
            <a href="${mailto}" onclick="setTimeout(function(){document.getElementById('mobileMailPopup')&&document.getElementById('mobileMailPopup').remove()},300)" style="display:block;padding:12px;background:#3b82f6;color:#fff;text-align:center;text-decoration:none;border-radius:10px;font-weight:600;font-size:14px">📮 פתח באפליקציית מייל אחרת</a>
          </div>
          <div style="font-size:12px;color:var(--muted);text-align:center;margin:8px 0 12px">— או העתק ידנית —</div>

var SB_KEY='sb_publishable_iOafusxiYK5ZBPqEb3IwOQ_jijlKgvO';
var SB_AUTH='mortgage_crm_sb_auth_v1';
var SB_TABLE='mortgage_crm_state';
var SB={mode:'off',user:null,token:null,refresh:null,rowUpdated:null,saveTimer:null,ws:null,wsRetry:0,pending:false,hb:null};

function sbHdrs(withAuth){
  var h={apikey:SB_KEY,'Content-Type':'application/json'};
  if(withAuth&&SB.token)h.Authorization='Bearer '+SB.token;
  return h;
}
function sbLoadSession(){
  try{
    var raw=localStorage.getItem(SB_AUTH);if(!raw)return null;
    var s=JSON.parse(raw);if(!s||!s.access_token)return null;
    if(s.expires_at&&s.expires_at*1000<Date.now()+30000)return {stale:true,s:s};
    return {stale:false,s:s};
  }catch(e){return null}
}
function sbSaveSession(s){
  try{
    if(s)localStorage.setItem(SB_AUTH,JSON.stringify(s));
    else localStorage.removeItem(SB_AUTH);
  }catch(e){}
}
async function sbSignIn(email,pw){
  var r=await fetch(SB_URL+'/auth/v1/token?grant_type=password',{
    method:'POST',headers:sbHdrs(false),
    body:JSON.stringify({email:email,password:pw})});
  var body=await r.json();
  if(!r.ok)throw new Error(body.error_description||body.msg||body.error||('שגיאה '+r.status));
  sbApplySession(body);return body;
}
async function sbRefresh(){
  var raw=localStorage.getItem(SB_AUTH);if(!raw)return null;
  var old=JSON.parse(raw);if(!old.refresh_token)return null;
  var r=await fetch(SB_URL+'/auth/v1/token?grant_type=refresh_token',{
    method:'POST',headers:sbHdrs(false),
    body:JSON.stringify({refresh_token:old.refresh_token})});
  var body=await r.json();
  if(!r.ok){sbSaveSession(null);return null}
  sbApplySession(body);return body;
}
function sbApplySession(s){
  SB.token=s.access_token;SB.user=s.user;
  s.expires_at=Math.floor(Date.now()/1000)+(s.expires_in||3600);
  sbSaveSession(s);
  clearTimeout(SB.refresh);
  var ms=Math.max(30000,(s.expires_in-60)*1000);
  SB.refresh=setTimeout(function(){sbRefresh()},ms);
}
async function sbSignOut(){
  try{if(SB.token)await fetch(SB_URL+'/auth/v1/logout',{method:'POST',headers:sbHdrs(true)});}catch(e){}
  if(SB.ws){try{SB.ws.close()}catch(e){}SB.ws=null}
  clearTimeout(SB.refresh);clearTimeout(SB.saveTimer);
  SB.token=null;SB.user=null;SB.mode='off';
  sbSaveSession(null);
  location.reload();
}

async function sbFetchState(){
  var r=await fetch(SB_URL+'/rest/v1/'+SB_TABLE+'?id=eq.1&select=state,updated_at,updated_by',
    {headers:sbHdrs(true)});
  if(!r.ok)throw new Error('טעינה נכשלה ('+r.status+')');
  var rows=await r.json();
  if(!rows.length)return {state:null,updated_at:null};
  return {state:rows[0].state,updated_at:rows[0].updated_at,updated_by:rows[0].updated_by};
}
async function sbPushState(){
  SB.pending=false;
  if(!SB.token||SB.mode!=='on')return;
  sbBadge('saving');
  try{
    if(SB.user&&SB.user.email){
      state._lastEditor=SB.user.email;
      state._lastEditedAt=new Date().toISOString();
    }
    var body=JSON.stringify({state:state,updated_at:new Date().toISOString()});
    var r=await fetch(SB_URL+'/rest/v1/'+SB_TABLE+'?id=eq.1',{
      method:'PATCH',headers:Object.assign(sbHdrs(true),{Prefer:'return=representation'}),
      body:body});
    if(!r.ok){var t=await r.text();throw new Error('שמירה נכשלה ('+r.status+') '+t.slice(0,120))}
    var rows=await r.json();
    if(rows&&rows[0])SB.rowUpdated=rows[0].updated_at;
    sbBadge('ok');sbUpdateLast();
  }catch(e){sbBadge('err',e.message);setTimeout(function(){sbQueueSave()},5000);}
}
function sbQueueSave(immediate){
  if(SB.mode!=='on')return;
  SB.pending=true;sbBadge('pending');
  clearTimeout(SB.saveTimer);
  if (immediate) {
    // Flush right away — no debounce. Used for critical actions like client creation/deletion.
    sbPushState();
  } else {
    SB.saveTimer=setTimeout(sbPushState,1200);
  }
}

// Explicit "save and push to cloud immediately" — call after critical mutations (create/delete client, etc.)
function saveNow(){
  save();
  if (typeof SB !== 'undefined' && SB.mode === 'on') sbQueueSave(true);
}
async function sbPullState(){
  try{
    // Never overwrite the local state while we have pending writes queued —
    // that could wipe out a just-created client before it gets pushed to the cloud.
    if (SB && SB.pending) return;
    var r=await sbFetchState();
    if(!r.state||Object.keys(r.state).length===0)return;
    if(r.updated_at===SB.rowUpdated)return;
    if(r.updated_by===(SB.user&&SB.user.id)&&SB.rowUpdated&&r.updated_at<=SB.rowUpdated)return;
    SB.rowUpdated=r.updated_at;
    sbApplyRemoteState(r.state);
    if(currentTab==='dashboard')renderDashboard();
    if(currentTab==='clients')renderClientsList();
    if(currentTab==='tasks')renderTasksTab();
    if(currentTab==='settings')renderSettings();
    if(currentTab==='detail')renderClientDetail();
    if(currentTab==='leads' && typeof renderLeadsTab==='function')renderLeadsTab();
    renderKanban();
    // Refresh floating alerts popup so deleted/updated reminders vanish
    if(typeof refreshTaskAlertsFloat==='function')refreshTaskAlertsFloat();
    sbBadge('ok');sbUpdateLast();
  }catch(e){sbBadge('err',e.message)}
}

// Periodic fallback pull — every 30 seconds. Catches updates that the WebSocket may have missed
// (mobile browser tab woke up, network dropped and reconnected, etc.)
setInterval(function(){
  if(SB.mode==='on' && SB.token) sbPullState();
}, 30000);

function sbApplyRemoteState(obj){
  if(!obj||typeof obj!=='object')return;
  state=obj;
  if(!state.settings)state.settings=JSON.parse(JSON.stringify(DEFAULT_DATA.settings));
  if(!Array.isArray(state.clients))state.clients=[];
  if(!Array.isArray(state.settings.bankers))state.settings.bankers=[];
  if(!Array.isArray(state.settings.dealTypes))state.settings.dealTypes=DEFAULT_DATA.settings.dealTypes.slice();
  if(!state.settings.stageTasks)state.settings.stageTasks=JSON.parse(JSON.stringify(DEFAULT_DATA.settings.stageTasks));
  if(!state.settings.stageRequirements)state.settings.stageRequirements=JSON.parse(JSON.stringify(DEFAULT_DATA.settings.stageRequirements));
  if(!Array.isArray(state.settings.whatsappTemplates)||state.settings.whatsappTemplates.length===0){
    state.settings.whatsappTemplates=JSON.parse(JSON.stringify(DEFAULT_DATA.settings.whatsappTemplates));
  }
  // Sig-reminder migration: unconditional overwrite
  {
    var _sig=state.settings.whatsappTemplates.find(function(t){return t.id==='sig-reminder'});
    if(_sig)_sig.body='שלום {name},\nתזכורת לפגישת החתימה שקבענו ביום {meetingDate} בשעה {meetingTime}.\nאצל הבנקאי {bankerName}\n\n*מיקום:* בנק {bank} · סניף {branch}\n*כתובת:* {branchAddress}\n\n*תזכורת: להביא איתכם:*\n• תעודת זהות + ספח - מקוריים\n\nנא לאשר הגעה.\nתודה,\nיצחק';
  }
  state.clients.forEach(migrateClient);
}

function sbConnectRT(){
  if(!SB.token||SB.mode!=='on')return;
  if(SB.ws){try{SB.ws.close()}catch(e){}}
  var url=SB_URL.replace('https://','wss://')+'/realtime/v1/websocket?apikey='+encodeURIComponent(SB_KEY)+'&vsn=1.0.0';
  var ws;
  try{ws=new WebSocket(url)}catch(e){sbBadge('err','WebSocket נכשל');return}
  SB.ws=ws;
  ws.onopen=function(){
    SB.wsRetry=0;
    ws.send(JSON.stringify({topic:'realtime:public:'+SB_TABLE,event:'phx_join',
      payload:{config:{postgres_changes:[{event:'UPDATE',schema:'public',table:SB_TABLE}]},access_token:SB.token},ref:'1'}));
    SB.hb=setInterval(function(){try{ws.send(JSON.stringify({topic:'phoenix',event:'heartbeat',payload:{},ref:'hb'}))}catch(e){}},25000);
  };
  ws.onmessage=function(e){
    try{var m=JSON.parse(e.data);
      if(m.event==='postgres_changes'&&m.payload&&m.payload.data){
        var d=m.payload.data;
        if(d.record&&d.record.updated_at!==SB.rowUpdated)sbPullState();
      }
    }catch(err){}
  };
  ws.onclose=function(){
    clearInterval(SB.hb);
    if(SB.mode!=='on')return;
    SB.wsRetry++;var wait=Math.min(30000,1000*Math.pow(2,SB.wsRetry));
    setTimeout(sbConnectRT,wait);
  };
  ws.onerror=function(){};
}

    'saving':{c:'#f59e0b',t:'שומר...'},
    'ok':{c:'#22c55e',t:'מחובר · נתונים משותפים'},
    'err':{c:'#ef4444',t:'שגיאה: '+(msg||'')}
  };
  var m=map[st]||map.off;
  dot.style.background=m.c;
  lbl.textContent=m.t;
}

function sbUpdateLast(){
  var el=document.getElementById('sb-last');if(!el||!state)return;
  var who=state._lastEditor||'',at=state._lastEditedAt||'';
  if(!who||!at){el.textContent='';return}
  var mine=SB.user&&who===SB.user.email;
  var diff=Math.floor((Date.now()-new Date(at).getTime())/1000);
  var when;
  if(diff<45)when='עכשיו';
  else if(diff<3600)when='לפני '+Math.floor(diff/60)+' דקות';
  else if(diff<86400)when='לפני '+Math.floor(diff/3600)+' שעות';
  else when='ב־'+new Date(at).toLocaleDateString('he-IL');
  el.innerHTML='עודכן '+(mine?'על ידך':'ע"י <b>'+escapeHtml(who)+'</b>')+' · '+when;
}

function sbLoginOpen(err, mode){
  var em=(SB.user&&SB.user.email)||'';
  var isSignup = mode === 'signup';
  showModal(`
    <h2 class="modal-title">${isSignup ? '📝 הרשמה למערכת' : '🔑 כניסה למערכת המשותפת'}</h2>
    <div class="form-group"><label>כתובת דוא"ל</label><input id="sb-em" type="email" autocomplete="${isSignup?'email':'username'}" value="${escapeAttr(em)}"></div>
    <div class="form-group"><label>סיסמה ${isSignup?'(לפחות 6 תווים)':''}</label><input id="sb-pw" type="password" autocomplete="${isSignup?'new-password':'current-password'}"></div>
    ${err?`<div style="background:#fee2e2;color:#991b1b;padding:10px;border-radius:8px;font-size:13px;margin-bottom:12px">${escapeHtml(err)}</div>`:''}
    <div style="color:var(--muted);font-size:12px;margin-bottom:12px">${isSignup ? 'צור חשבון חדש. אחרי הרישום תוכל להיכנס גם מהמובייל עם אותם פרטים.' : 'המערכת משותפת. כל שינוי מסתנכרן בין כל המכשירים תוך שנייה.'}</div>
    <div class="modal-actions">
      ${isSignup
        ? `<button class="btn" id="sb-up">✓ הרשם</button>
           <button class="btn secondary" onclick="sbLoginOpen()">← חזרה להתחברות</button>`
        : `<button class="btn" id="sb-in">התחבר</button>
           <button class="btn secondary" onclick="sbLoginOpen(null,'signup')">📝 הרשמה חדשה</button>`
      }
      <button class="btn secondary" onclick="closeModal()">אחר כך</button>
    </div>
    ${!isSignup ? `<div style="margin-top:12px;text-align:center"><a href="#" onclick="event.preventDefault();sbForgotPassword()" style="color:var(--accent);font-size:12px;text-decoration:underline">שכחתי סיסמה</a></div>` : ''}
  `);
  setTimeout(function(){var e=document.getElementById('sb-em');if(e)e.focus()},50);
  var doAction=function(){
    var e=document.getElementById('sb-em').value.trim(),p=document.getElementById('sb-pw').value;
    if(!e||!p){alert('מלא דוא"ל וסיסמה');return}
    if(isSignup && p.length < 6){alert('הסיסמה חייבת להכיל לפחות 6 תווים');return}
    var btnId = isSignup ? 'sb-up' : 'sb-in';
    var btn=document.getElementById(btnId);btn.textContent = isSignup ? 'רושם...' : 'מתחבר...';btn.disabled=true;
    if (isSignup) {
      sbSignUp(e,p).then(function(res){
        // Some Supabase projects auto-confirm; others require email verification.
        // Try immediate sign-in — if it fails with "email not confirmed", show a friendly message.
        sbSignIn(e,p).then(function(){closeModal();sbStart('after-signup');})
          .catch(function(){
            alert('✓ נרשמת בהצלחה!\n\nייתכן שנשלח מייל אימות לכתובת ' + e + '.\nאשר את המייל ואז התחבר עם אותם פרטים.');
            sbLoginOpen();
          });
      }).catch(function(err){sbLoginOpen(err.message||'הרשמה נכשלה','signup');});
    } else {
      sbSignIn(e,p).then(function(){closeModal();sbStart('after-login');}).catch(function(err){sbLoginOpen(err.message||'התחברות נכשלה');});
    }
  };
  var actionBtn = document.getElementById(isSignup ? 'sb-up' : 'sb-in');
  if (actionBtn) actionBtn.onclick=doAction;
  ['sb-em','sb-pw'].forEach(function(id){var el=document.getElementById(id);if(el)el.addEventListener('keydown',function(e){if(e.key==='Enter')doAction()});});

function sbForgotPassword(){
  var em = document.getElementById('sb-em')?.value.trim() || '';
  var email = prompt('כתובת המייל לשליחת קישור לאיפוס סיסמה:', em);
  if (!email) return;
  sbResetPassword(email).then(function(){
    alert('✓ נשלח קישור לאיפוס סיסמה למייל ' + email + '.\nבדוק את תיבת המייל (כולל spam).');
  }).catch(function(err){
    alert('שגיאה: ' + (err.message || 'איפוס נכשל'));
  });
}

async function sbStart(source){
  var sess=sbLoadSession();
  if(!sess){sbLoginOpen();return}
  if(sess.stale){var refreshed=await sbRefresh();if(!refreshed){sbLoginOpen();return}}
  else sbApplySession(sess.s);
  sbBadge('sync');
  try{
    var r=await sbFetchState();
    if(r.state&&Object.keys(r.state).length>0){
      SB.rowUpdated=r.updated_at;
      sbApplyRemoteState(r.state);
      renderKanban();
      // Restore last view now that remote state is loaded
      try {
        var _lv = JSON.parse(localStorage.getItem('mortgage_crm_lastView')||'null');
        if (_lv && _lv.tab === 'detail' && _lv.clientId && state.clients.some(function(c){return c.id===_lv.clientId})) {
          currentClientId = _lv.clientId;
          switchTab('detail');
        } else if (_lv && ['dashboard','clients','tasks','settings'].includes(_lv.tab)) {
          switchTab(_lv.tab);
        } else {
          switchTab(currentTab||'dashboard');
        }
      } catch(e) { switchTab(currentTab||'dashboard'); }
      SB.mode='on';sbBadge('ok');sbUpdateLast();
    } else {
      SB.mode='on';
      await sbPushState();
    }
    sbConnectRT();
    sbHeaderShow();
  }catch(e){
    sbBadge('err',e.message);
    SB.mode='off';
    alert('החיבור לענן נכשל: '+e.message+'\n\nהמערכת עובדת מקומית עד שיתחדש החיבור.');
  }
}

},200);
