// Copy the styled HTML to the clipboard as text/html so pasting into Gmail preserves the formatting.
async function _copyBankLetterHtmlToClipboard() {
  const html = _buildBankLetterHtml();
  if (!html) return false;
  try {
    if (navigator.clipboard && window.ClipboardItem) {
      const printable = document.getElementById('bankLetterPrintable');
      const plainText = printable ? printable.innerText : '';
      const item = new ClipboardItem({
        'text/html': new Blob([html], { type: 'text/html' }),
        'text/plain': new Blob([plainText], { type: 'text/plain' })
      });
      await navigator.clipboard.write([item]);
      return true;
    }
    // Fallback — copy plain text only
    const printable = document.getElementById('bankLetterPrintable');
    if (printable && navigator.clipboard) {
      await navigator.clipboard.writeText(printable.innerText);
      return 'text-only';
    }
  } catch (e) {}
  return false;
}

async function _sendBankLetterEmail(clientId) {
  const c = state.clients.find(x => x.id === clientId);
  if (!c) return;
  const sel = document.getElementById('blkRecipient');
  const manual = (document.getElementById('blkManualEmail').value || '').trim();
  const to = manual || (sel ? sel.value : '');
  if (!to) { alert('נדרש להזין נמען'); return; }
  const printable = document.getElementById('bankLetterPrintable');
  if (!printable) return;
  const subj = 'בקשת הלוואת משכנתא — ' + _emailSubjectClient(c);
  const htmlBody = _buildBankLetterHtml();
  // Try Gmail API for a full-HTML draft (frames + styles preserved). Prompts consent if needed.
  try {
    const draftResp = await gmailCreateDraft({ to, subject: subj, htmlBody });
    const msgId = draftResp && draftResp.message && draftResp.message.id;
    window.open(msgId ? 'https://mail.google.com/mail/u/0/#drafts/' + msgId : 'https://mail.google.com/mail/u/0/#drafts', '_blank');
    if (typeof logCommunication === 'function') {
      logCommunication(c.id, 'email', { to, subject: subj, body: printable.innerText, context: 'bank-letter' });
    }
    return;
  } catch (err) {
    // Fallback #1 — copy the styled HTML to clipboard so the user can paste it into Gmail.
    const copyResult = await _copyBankLetterHtmlToClipboard();
    const url = 'https://mail.google.com/mail/?authuser=a035591712@gmail.com&view=cm&fs=1'
              + '&to=' + encodeURIComponent(to)
              + '&su=' + encodeURIComponent(subj);
    window.open(url, '_blank');
    if (copyResult === true) {
      alert('📋 המכתב המעוצב הועתק ללוח.\nב-Gmail: לחץ בגוף המייל והדבק (Ctrl+V) — העיצוב עם המסגרות יופיע.');
    } else if (copyResult === 'text-only') {
      alert('📋 הטקסט הועתק ללוח.\nב-Gmail: לחץ בגוף המייל והדבק (Ctrl+V). לקבלת עיצוב מלא — התחבר ל-Gmail דרך "התחבר ל-Gmail" בהגדרות.');
    } else {
      alert('נפתחה טיוטת Gmail. לעיצוב מלא — התחבר לחשבון Gmail דרך "התחבר ל-Gmail" בהגדרות ונסה שוב.');
    }
    if (typeof logCommunication === 'function') {
      logCommunication(c.id, 'email', { to, subject: subj, body: printable.innerText, context: 'bank-letter' });
    }
  }
}

function submitApproval(clientId) {
  const c = state.clients.find(x => x.id === clientId);
  const amount = Number(document.getElementById('apAmount').value) || 0;
  if (amount <= 0) { alert('הזן סכום שאושר'); return; }
  const sel = document.getElementById('apBankSel').value;
  let bankName = '';
  if (sel === '__other__') {
    bankName = document.getElementById('apOtherBank').value.trim();
  } else {
    bankName = sel;
  }
  if (!bankName) { alert('בחר בנק'); return; }
  const dateStr = document.getElementById('apDate').value;
  const approvedAt = dateStr ? new Date(dateStr + 'T12:00:00').toISOString() : now();
  const note = document.getElementById('apNote').value.trim();
  c.approvals.push({ id: uid(), bankName, amount, approvedAt, note });
  // Auto-advance from approval stage to bank collateral
  const wasApprovalStage = c.stage === 'approval';
  if (wasApprovalStage) {
    moveStage(c, 'bank');
  }
  save(); closeModal(); renderClientDetail(); renderKanban();
  // Warn if shortfall
  if (c.loanAmount > 0 && amount < c.loanAmount) {
    setTimeout(() => alert('⚠️ הסכום שאושר (' + fmtMoney(amount) + ') נמוך מהסכום שנרשם בהתחלה (' + fmtMoney(c.loanAmount) + '). חסר ' + fmtMoney(c.loanAmount - amount)), 100);
  }
}

function deleteApproval(clientId, apId) {
  if (!confirm('למחוק את האישור?')) return;
  const c = state.clients.find(x => x.id === clientId);
  c.approvals = c.approvals.filter(a => a.id !== apId);
  save(); renderClientDetail();
}

function acceptApproval(clientId, apId) {
  const c = state.clients.find(x => x.id === clientId);
  const a = c.approvals.find(x => x.id === apId);
  if (!a) return;
  const oldAmount = c.loanAmount;
  if (!confirm('לעדכן את סכום המשכנתא ל־' + fmtMoney(a.amount) + '?\n(סכום נוכחי: ' + fmtMoney(oldAmount) + ')')) return;
  // Mark all approvals as not accepted, then this one as accepted
  c.approvals.forEach(x => x.accepted = false);
  a.accepted = true;
  // Update the loan amount
  c.loanAmount = a.amount;
  save(); renderClientDetail();
}

function toggleAppraisal(clientId) {
  const c = state.clients.find(x => x.id === clientId);
  c.requiresAppraisal = !c.requiresAppraisal;
  // If appraisal no longer required — remove the floating "כמה אושר שווי ע"פ השמאי" task and any appraisal-seed tasks
  if (!c.requiresAppraisal) {
    c.tasks = (c.tasks || []).filter(t => !(t.source === 'appraisal-value-check' || t.source === 'appraisal-seed' || t.source === 'appraisal-post-send'));
  }
  save(); renderClientDetail();
}

function setClientBanker(clientId, bankerId) {
  const c = state.clients.find(x => x.id === clientId);
  c.bankerId = bankerId;
  save(); renderClientDetail();
}

// Auto-seed sources — tasks in these categories are generated automatically
const AUTO_SEED_SOURCES = new Set([
  'bank-seed', 'bank-seed-conditional',
  'seller-seed', 'seller-seed-conditional',
  'signature-base', 'signature-seed', 'signature-seed-conditional',
  'appraisal-seed', 'appraisal-value-check', 'appraisal-post-send',
  'execution-seed'
]);

function refreshClientTasks(clientId) {
  const c = state.clients.find(x => x.id === clientId);
  if (!c) return;
  const undoneAutoCount = (c.tasks || []).filter(t => AUTO_SEED_SOURCES.has(t.source) && t.status !== 'done').length;
  const msg = 'רענון משימות אוטומטיות לפי סוג עסקה + רישום נוכחי.\n\n' +
              '• יוסרו ' + undoneAutoCount + ' משימות שלא בוצעו שנוצרו אוטומטית קודם\n' +
              '• יתווספו משימות חדשות לפי הגדרות סוג העסקה והרישום הנוכחיים\n' +
              '• משימות שסימנת ✓ ומשימות שהוספת ידנית יישארו\n\nלהמשיך?';
  if (!confirm(msg)) return;
  // Remove undone auto-seeded tasks
  c.tasks = (c.tasks || []).filter(t => !(AUTO_SEED_SOURCES.has(t.source) && t.status !== 'done'));
  // Re-seed for all stages the client has entered (or is currently in)
  const visitedStages = new Set((c.stageHistory || []).map(h => h.stage));
  visitedStages.add(c.stage);
  if (visitedStages.has('appraisal') && c.requiresAppraisal) seedAppraisalTasks(c);
  if (visitedStages.has('approval')) seedApprovalInspectionTask(c);
  if (visitedStages.has('bank')) seedBankStageTasks(c);
  if (visitedStages.has('seller')) seedSellerStageTasks(c);
  if (visitedStages.has('signature')) seedSignatureStageTasks(c);
  if (visitedStages.has('execution')) seedExecutionStageTasks(c);
  if (typeof dedupRequirementsAndTasks === 'function') dedupRequirementsAndTasks(c);
  save(); renderClientDetail();
  alert('המשימות רועננו ✓');
}

      <div style="display:flex;gap:8px;margin-top:12px">
        <div class="chip ${leadsFilter.status==='active'?'active':''}" onclick="leadsFilter.status='active';renderLeadsTab()">🟢 פעילים (${activeLeads.length})</div>
        <div class="chip ${leadsFilter.status==='waiting'?'active':''}" onclick="leadsFilter.status='waiting';renderLeadsTab()">🕐 בהמתנה (${waitingLeads.length})</div>
      </div>
    </div>
    ${list.length === 0 ? `<div class="empty" style="padding:24px;text-align:center;color:var(--muted)">${leadsFilter.status==='waiting'?'אין לידים בהמתנה.':'אין לידים פעילים. לחץ "+ ליד חדש" כדי להתחיל.'}</div>` :
      list.map(c => renderLeadCard(c, false)).join('')}
  `;
}

function deleteLead(clientId) {
  const c = state.clients.find(x => x.id === clientId);
  if (!c) return;
  if (!confirm('להעביר את הליד "' + (c.name||'—') + '" לפח?\n\nיישמר 30 יום ותוכל לשחזר מהפח.')) return;
  moveClientsToTrash([clientId]);
  saveNow();
  renderLeadsTab();
  renderKanban();
}

function moveLeadToWaiting(clientId) {
  const c = state.clients.find(x => x.id === clientId);
  if (!c) return;
  c.leadWaiting = true;
  c.leadWaitingSince = now();
  save();
  renderLeadsTab();
  renderKanban();
}

function revertLeadFromWaiting(clientId) {
  const c = state.clients.find(x => x.id === clientId);
  if (!c) return;
  c.leadWaiting = false;
  c.leadWaitingSince = null;
  save();
  renderLeadsTab();
  renderKanban();
}

function renderLeadCard(c, isClosed) {
  // One-time migration: convert old lead-note tasks to c.leadNotes
  const oldNoteTasks = (c.tasks || []).filter(t => t.source === 'lead-note');
  if (oldNoteTasks.length) {
    c.leadNotes = c.leadNotes || [];
    oldNoteTasks.forEach(t => {
      c.leadNotes.push({ id: t.id, text: t.title, createdAt: t.createdAt });
    });
    c.tasks = c.tasks.filter(t => t.source !== 'lead-note');
    save();
  }
  const notes = (c.leadNotes || []).slice().sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
  const followUpTasks = (c.tasks || []).filter(t => t.stage === 'lead').slice().sort((a, b) => {
    const rank = t => { const st = t.status || 'active'; return st === 'active' ? 0 : st === 'follow-up' ? 1 : 2; };
    return rank(a) - rank(b);
  });
  const days = daysBetween(c.leadAt);
  const currentStageInfo = stageInfo(c.stage);
  const bg = isClosed ? '#f8fafc' : '#fff';
  const border = isClosed ? 'var(--border)' : '#7dd3fc';
  return `
    <div id="leadCard_${c.id}" class="panel" style="margin-bottom:12px;background:${bg};border:2px solid ${border};padding:14px;transition:box-shadow 0.3s">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap">
        <div style="flex:1;min-width:200px">
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
            <button onclick="event.stopPropagation();openCustomTaskModal('${c.id}')" title="הוסף משימה לליד זה" style="display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:16px;border:none;cursor:pointer;line-height:1;flex-shrink:0">+</button>
            <span style="font-size:17px;font-weight:800;cursor:pointer;color:var(--accent)" onclick="openClient('${c.id}')" title="פתח פרטי לקוח">${escapeHtml(c.name || '(ללא שם)')}</span>
            ${isClosed
              ? `<span class="stage-pill" style="background:${currentStageInfo.color}">${currentStageInfo.label}</span>`
              : (c.leadWaiting
                  ? `<span class="badge" style="background:#fef3c7;color:#78350f">🕐 בהמתנה · ${days} ימים</span>`
                  : `<span class="badge" style="background:#dbeafe;color:#1e40af">🟢 ליד · ${days} ימים</span>`)}
          </div>
          <div style="font-size:13px;color:var(--muted);margin-top:4px">
            ${c.phone ? '📞 <a href="tel:'+escapeAttr(c.phone)+'" style="color:inherit">'+escapeHtml(c.phone)+'</a>' : ''}
            ${c.email ? '· 📧 <a href="mailto:'+escapeAttr(c.email)+'" style="color:inherit">'+escapeHtml(c.email)+'</a>' : ''}
            ${!c.phone && !c.email ? '<em>— אין פרטי קשר —</em>' : ''}
          </div>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          ${!isClosed ? `
            ${c.phone ? `<button class="btn small" onclick="openWhatsAppDialog('${c.id}')" style="background:#22c55e" title="שלח הודעת WhatsApp">💬 WhatsApp</button>` : ''}
            ${(c.email || (c.borrowers||[]).some(b=>b.email)) ? `<button class="btn small" onclick="openClientEmail('${c.id}')" style="background:#3b82f6" title="שלח מייל">📧 מייל</button>` : ''}
            <button class="btn small" onclick="closeLeadAsDeal('${c.id}')" style="background:var(--success)">✅ סגרנו עסקה</button>
            ${c.leadWaiting
              ? `<button class="btn small" onclick="revertLeadFromWaiting('${c.id}')" style="background:#0ea5e9" title="החזר לליד פעיל">🔙 הפוך לליד</button>`
              : `<button class="btn small" onclick="moveLeadToWaiting('${c.id}')" style="background:#f59e0b" title="העבר להמתנה — לא ייעלם מהמערכת, יופיע בטאב 'בהמתנה'">🕐 הועבר להמתנה</button>`
            }
          ` : ''}
          <button class="btn secondary small" onclick="${isClosed ? `openEditModal('${c.id}')` : `openEditLeadModal('${c.id}')`}">✎ ערוך</button>
          <button class="btn danger small" onclick="deleteLead('${c.id}')" title="מחק ליד לצמיתות">🗑 מחק</button>
        </div>
      </div>

      ${!isClosed ? `
        <div style="margin-top:12px;padding:10px;background:#f8fafc;border-radius:8px">
          <div style="font-size:12px;font-weight:700;color:#334155;margin-bottom:6px">📝 הערות (Enter = הערה חדשה עם חתימת זמן)</div>
          <div style="display:flex;gap:6px">
            <input id="leadNote_${c.id}" placeholder="הקלד הערה ולחץ Enter..." style="flex:1;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px" onkeydown="if(event.key==='Enter'){event.preventDefault();addLeadNote('${c.id}')}">
            <button class="btn small" onclick="addLeadNote('${c.id}')">+ הוסף</button>
          </div>
        </div>
      ` : ''}

      ${notes.length > 0 ? `
        <div style="margin-top:10px">
          <div style="font-size:12px;font-weight:700;color:#334155;margin-bottom:6px">📌 הערות (${notes.length}):</div>
          <div style="display:flex;flex-direction:column;gap:4px;max-height:220px;overflow-y:auto">
            ${notes.map(n => `
              <div style="padding:6px 10px;background:#fef3c7;border:1px solid #fcd34d;border-radius:6px;font-size:13px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start">
                <span style="flex:1">${escapeHtml(n.text)}</span>
                <span style="font-size:11px;color:var(--muted);white-space:nowrap">${fmtDateTime(n.createdAt)}</span>
                ${!isClosed ? `<button class="icon-btn" onclick="openContactEmailDialog('${c.id}','הערה: ${escapeAttr((n.text||'').slice(0,60))}')" title="שלח מייל" style="padding:0 4px;color:var(--accent)">📧</button><button class="icon-btn" onclick="editLeadNote('${c.id}','${n.id}')" title="ערוך" style="padding:0 4px;color:var(--accent)">✎</button><button class="icon-btn" onclick="deleteLeadNote('${c.id}','${n.id}')" title="מחק הערה" style="padding:0 4px">✕</button>` : ''}
              </div>
            `).join('')}
          </div>
        </div>
      ` : ''}

      ${followUpTasks.length > 0 ? `
        <div style="margin-top:10px;padding:8px;background:#eff6ff;border-radius:6px;border:1px dashed #bfdbfe">
          <div style="font-size:11px;font-weight:700;color:#1e40af;margin-bottom:4px">📞 משימות ליד:</div>
          ${followUpTasks.map(t => {
            const st = t.status || 'active';
            return `<div style="display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12px">
              <span style="flex:1;${st==='done'?'text-decoration:line-through;opacity:0.6':''}">${escapeHtml(t.title)}</span>
              ${!isClosed ? `<div class="task-status-group">
                <span class="status-pill ${st==='active'?'active':''}" data-tstatus="active" onclick="setTaskStatus('${c.id}','${t.id}','active')">פעיל</span>
                <span class="status-pill ${st==='follow-up'?'active':''}" data-tstatus="follow-up" onclick="setTaskStatus('${c.id}','${t.id}','follow-up')">מעקב</span>
                <span class="status-pill ${st==='done'?'active':''}" data-tstatus="done" onclick="setTaskStatus('${c.id}','${t.id}','done')">בוצע</span>
              </div>` : ''}
            </div>`;
          }).join('')}
        </div>
      ` : ''}
    </div>
  `;
}

let editingLeadId = null;

            <button type="button" class="btn small" style="padding:4px 10px" onclick="addCustomLeadEmpType('1')">+</button>

          <label style="display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;cursor:pointer;font-size:14px;white-space:nowrap" onmouseover="this.style.background='#eef2ff'" onmouseout="this.style.background=''">

function toggleLeadSpouse() {
  const sel = document.getElementById('leadMarital');
  const marital = sel ? sel.value : 'single';
  const wrap = document.getElementById('leadSpouseWrap');
  if (wrap) wrap.style.display = marital === 'married' ? 'block' : 'none';
}

function toggleLeadEmpMenu(which, e) {
  e && e.stopPropagation();
  const menu = document.getElementById('leadEmpMenu' + which);
  if (!menu) return;
  const isOpen = menu.style.display === 'block';
  // Close other menus
  ['leadEmpMenu1','leadEmpMenu2','leadPurposeMenu'].forEach(id => { const el = document.getElementById(id); if (el) el.style.display = 'none'; });
  menu.style.display = isOpen ? 'none' : 'block';
}

function updateLeadEmpLabel(which) {
  const chosen = Array.from(document.querySelectorAll('.leadEmp' + which + ':checked')).map(x => x.value);
  const lbl = document.getElementById('leadEmpLabel' + which);
  if (lbl) lbl.textContent = chosen.length ? chosen.join(' + ') : '— בחר —';
}

function toggleLeadPurposeMenu(e) {
  e && e.stopPropagation();
  const menu = document.getElementById('leadPurposeMenu');
  if (!menu) return;
  const isOpen = menu.style.display === 'block';
  ['leadEmpMenu1','leadEmpMenu2','leadPurposeMenu'].forEach(id => { const el = document.getElementById(id); if (el) el.style.display = 'none'; });
  menu.style.display = isOpen ? 'none' : 'block';
}

function updateLeadPurposeLabel() {
  const chosen = Array.from(document.querySelectorAll('.leadPurpose:checked')).map(x => x.value);
  const lbl = document.getElementById('leadPurposeLabel');
  if (lbl) lbl.textContent = chosen.length ? chosen.join(' + ') : '— בחר —';
}

// Close lead menus on outside click
document.addEventListener('click', (e) => {
  const isInside = e.target.closest('#leadEmpMenu1, #leadEmpMenu2, #leadPurposeMenu, [onclick*="toggleLeadEmpMenu"], [onclick*="toggleLeadPurposeMenu"]');
  if (isInside) return;
  ['leadEmpMenu1','leadEmpMenu2','leadPurposeMenu'].forEach(id => { const el = document.getElementById(id); if (el) el.style.display = 'none'; });
});

function openEditLeadModal(clientId) {
  const c = state.clients.find(x => x.id === clientId);
  if (!c) return;
  openNewLeadModal(c);
}

function submitNewLead() {
  const name = (document.getElementById('leadName').value || '').trim();
  const phone = (document.getElementById('leadPhone').value || '').trim();
  const email = (document.getElementById('leadEmail').value || '').trim();
  const marital = (document.getElementById('leadMarital')?.value) || 'single';
  const emp1 = Array.from(document.querySelectorAll('.leadEmp1:checked')).map(x => x.value);
  const emp2 = Array.from(document.querySelectorAll('.leadEmp2:checked')).map(x => x.value);
  const purposes = Array.from(document.querySelectorAll('.leadPurpose:checked')).map(x => x.value);
  const isEdit = !!editingLeadId;
  const notesRaw = isEdit ? '' : ((document.getElementById('leadNotes')?.value) || '').trim();
  if (!phone && !email && !name) { alert('צריך לפחות טלפון, מייל, או שם'); return; }
  const displayName = name || phone || email;
  const spouseName = marital === 'married' ? ((document.getElementById('leadName2')?.value || '').trim()) : '';
  const isCouple = marital === 'married';
  const borrowers = [{
    role: isCouple ? 'בעל' : 'לווה',
    name: name,
    idNumber: '',
    employmentTypes: emp1,
    employmentType: emp1.join(' + '),
    incomeTypes: [],
    customIncome: ''
  }];
  if (isCouple) {
    borrowers.push({
      role: 'אשה',
      name: spouseName,
      idNumber: '',
      employmentTypes: emp2,
      employmentType: emp2.length ? emp2.join(' + ') : 'ללא הכנסות',
      incomeTypes: [],
      customIncome: ''
    });
  }
  if (isEdit) {
    const c = state.clients.find(x => x.id === editingLeadId);
    if (!c) { editingLeadId = null; return; }
    c.name = displayName + (isCouple && spouseName ? ' ו' + spouseName : '');
    c.phone = phone;
    c.email = email;
    c.maritalStatus = marital;
    // Merge the lead-form fields into the existing borrowers (preserving jobIncomes, phones, emails, banks, etc.)
    const _oldBrws = c.borrowers || [];
    const _mergedBrws = borrowers.map((nb, i) => {
      const ob = _oldBrws[i] || {};
      return Object.assign({}, ob, nb);
    });
    c.borrowers = _mergedBrws;
    c.employmentType = emp1.join(' + ');
    c.purposes = purposes;
    c.purpose = purposes[0] || '';
    // Re-seed docs for this lead based on the new info
    // Remove old auto-seeded borrower + deal + registration doc requirements (keep already-provided/not-required)
    const preserved = (c.requirements || []).filter(r => r.status && r.status !== 'pending');
    c.requirements = preserved;
    seedDocumentRequirements(c);
    // Deduplicate
    if (typeof dedupRequirementsAndTasks === 'function') dedupRequirementsAndTasks(c);
    editingLeadId = null;
    save();
    closeModal();
    renderLeadsTab();
    renderKanban();
    return;
  }
  const client = newClient({
    name: displayName + (isCouple && spouseName ? ' ו' + spouseName : ''),
    phone: phone,
    maritalStatus: marital,
    borrowers: borrowers,
    purposes: purposes,
    purpose: purposes[0] || '',
    employmentType: emp1.join(' + ')
  });
  client.email = email;
  client.leadNotes = [];
  if (notesRaw) {
    const lines = notesRaw.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    lines.forEach(line => {
      client.leadNotes.push({ id: uid(), text: line, createdAt: now() });
    });
  }
  // Seed doc requirements from the info entered
  if (purposes.length > 0 || emp1.length > 0 || emp2.length > 0) {
    seedDocumentRequirements(client);
  }
  state.clients.push(client);
  saveNow();
  closeModal();
  renderLeadsTab();
  renderKanban();
}

function addLeadNote(clientId) {
  const inp = document.getElementById('leadNote_' + clientId);
  const val = (inp?.value || '').trim();
  if (!val) return;
  const c = state.clients.find(x => x.id === clientId);

  c.leadNotes = c.leadNotes || [];

  if (currentTab === 'detail') renderClientDetail();

function deleteLeadNote(clientId, noteId) {
  const c = state.clients.find(x => x.id === clientId);

  c.leadNotes = c.leadNotes.filter(n => n.id !== noteId);

function fmtDateTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const pad = n => String(n).padStart(2,'0');
  return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function showModal(html) {
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modalBackdrop').classList.add('open');
}
function closeModal() {
  document.getElementById('modalBackdrop').classList.remove('open');
  const mc = document.getElementById('modalContent');
  if (mc) delete mc.dataset.noBackdropClose;
  // If the user closed the "לקוח חדש" form without saving during a "סגרנו עסקה" flow —
  // keep the lead in 'lead' stage (don't consume the pending flag on submit failure/cancel).
  pendingCloseLeadId = null;
  pendingCloseLeadTaskId = null;
}
document.getElementById('modalBackdrop').addEventListener('click', (e) => {
  if (e.target.id !== 'modalBackdrop') return;
  // Modals that opted out of backdrop-close (e.g. the incomes editor) — require an explicit close button.
  const mc = document.getElementById('modalContent');
  if (mc && mc.dataset.noBackdropClose === '1') return;
  closeModal();
});
// Enter-to-save: pressing Enter inside a modal input triggers the primary button
document.getElementById('modalBackdrop').addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  const t = e.target;
  if (!t) return;
  // Skip textareas, select, and buttons — they need Enter for their own behavior
  const tag = (t.tagName || '').toLowerCase();
  if (tag === 'textarea' || tag === 'button' || tag === 'select') return;
  if (t.type === 'submit') return;
  // Find the primary button in the modal (first .btn without .secondary/.danger)
  const modal = document.getElementById('modalContent');
  if (!modal) return;
  const primary = modal.querySelector('.modal-actions .btn:not(.secondary):not(.danger)') || modal.querySelector('.btn:not(.secondary):not(.danger)');
  if (primary) { e.preventDefault(); primary.click(); }
});

      if (document.getElementById('fTenantName')) document.getElementById('fTenantName').value = t.name || '';
      if (document.getElementById('fTenantPhone')) document.getElementById('fTenantPhone').value = t.phone || '';
      if (document.getElementById('fTenantEmail')) document.getElementById('fTenantEmail').value = t.email || '';
    }
    if (dd.secondHand) {
      const s = dd.secondHand;
      // Lawyer + tenant fields — set via IDs
      ['buyerLawyer','buyerLawyerPhone','buyerLawyerEmail','sellerLawyer','sellerLawyerPhone','sellerLawyerEmail','tenantName','tenantPhone','tenantEmail'].forEach(k => {
        const el = document.getElementById('sh_'+k);
        if (el) el.value = s[k] || '';
      });
      // Sellers list — array preferred; falls back to legacy single seller
      if (document.getElementById('shSellersList')) {
        const sellers = Array.isArray(s.sellers) && s.sellers.length
          ? s.sellers
          : ((s.sellerName || s.sellerPhone || s.sellerEmail) ? [{ name: s.sellerName || '', phone: s.sellerPhone || '', email: s.sellerEmail || '' }] : []);
        if (sellers.length === 0) {
          addSellerRow();
        } else {
          sellers.forEach(x => addSellerRow(x));
        }
      }
    } else if (document.getElementById('shSellersList')) {
      addSellerRow();
    }
    if (dd.firstHand) {
      const f = dd.firstHand;
      ['contractor','contractorPhone','contractorEmail','buyerLawyer','buyerLawyerPhone','buyerLawyerEmail','contractorLawyer','contractorLawyerPhone','contractorLawyerEmail'].forEach(k => {
        const el = document.getElementById('fh_'+k);
        if (el) el.value = f[k] || '';
      });
    }
    if (dd.mchirLm) {
      const m = dd.mchirLm;
      ['contractor','contractorPhone','contractorEmail','buyerLawyer','buyerLawyerPhone','buyerLawyerEmail','contractorLawyer','contractorLawyerPhone','contractorLawyerEmail'].forEach(k => {
        const el = document.getElementById('ml_'+k);
        if (el) el.value = m[k] || '';
      });
    }
    if (dd.mortgageGuarantors && document.getElementById('mgList')) {
      dd.mortgageGuarantors.forEach(g => {
        addMortgageGuarantorRow();

        row.querySelector('.mgName').value = g.name || '';
        row.querySelector('.mgId').value = g.idNumber || '';
        row.querySelector('.mgPhone').value = g.phone || '';
        if (row.querySelector('.mgEmail')) row.querySelector('.mgEmail').value = g.email || '';
      });
    }
  }
  setTimeout(() => { const el = document.getElementById('fName1'); if (el && !isEdit) el.focus(); }, 50);
  if (!isEdit) {

// Read person's declared jobs from the saved data (types + employers). Returns [{type, employer}]
// Prefers `employersByType` map when present (one bucket per income type). Falls back to the
// flat `employers` array for older records (assigned only to שכיר/עצמאי).
function _jobsForPerson(person) {
  const jobs = [];
  const types = Array.isArray(person.employmentTypes)
    ? person.employmentTypes
    : (person.employmentType ? [person.employmentType] : []);
  const byType = (person.employersByType && typeof person.employersByType === 'object') ? person.employersByType : null;
  const flatEmployers = Array.isArray(person.employers) ? person.employers.filter(Boolean) : [];
  types.forEach(type => {
    const arr = byType && Array.isArray(byType[type]) ? byType[type].filter(Boolean) : null;
    if (arr && arr.length) {
      arr.forEach(name => jobs.push({ type, employer: name }));
    } else if (!byType && flatEmployers.length > 0 && (type === 'שכיר' || type === 'עצמאי')) {
      flatEmployers.forEach(emp => jobs.push({ type, employer: emp }));
    } else {
      jobs.push({ type, employer: '' });
    }
  });
  return jobs;
}

// For שעצמאי (self-employed) rows are per YEAR (annual tax filing). For everyone else — per month.
function _isYearlyType(type) { return type === 'עצמאי'; }

// Default period seeds for a fresh card — matches the pay-stub / tax-return conventions
// used elsewhere in the system (3 months back for salaried, 2 last years for self-employed).
function _defaultPayslipMonthsISO() {
  const now = new Date();
  const day = now.getDate();
  const month = now.getMonth();
  const year = now.getFullYear();
  const startBack = day >= 10 ? 1 : 2;
  const out = [];
  for (let i = startBack; i < startBack + 3; i++) {
    const d = new Date(year, month - i, 1);
    out.push(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'));
  }
  return out;
}
function _defaultYearsForSelfEmployed() {
  const y = new Date().getFullYear();
  return [String(y), String(y - 1), String(y - 2)]; // current + 2 years back
}

// The bank rule: until June (month 06) → previous year is the basis for average;
// from July onwards → current year is the basis. Returns the year string to seed as "included".
function _defaultIncludedYearForSelfEmployed() {
  const now = new Date();
  const y = now.getFullYear();
  return (now.getMonth() + 1) <= 6 ? String(y - 1) : String(y);
}
function _defaultSeedRowsForType(type) {
  if (_isYearlyType(type)) {
    const currY = String(new Date().getFullYear());
    const currMonth = new Date().getMonth() + 1; // 1-12
    const includedYear = _defaultIncludedYearForSelfEmployed();
    return _defaultYearsForSelfEmployed().map(m => ({
      month: m,
      amount: 0,
      // For the current year default the divisor to number of months elapsed; other years get full year
      mDiv: (m === currY) ? currMonth : 12,
      // Bank rule: pre-check only the year that should be used as the basis
      inAvg: (m === includedYear)
    }));
  }
  // שכיר / אברך / אישור רב / אישור ביטוח לאומי / others — last 3 months
  return _defaultPayslipMonthsISO().map(m => ({ month: m, amount: 0 }));
}

function _incRowHtml(data, type) {
  data = data || {};
  const amtStr = data.amount ? Number(data.amount).toLocaleString('he-IL') + ' ₪' : '';
  const yearly = _isYearlyType(type);
  if (yearly) {
    // Yearly (עצמאי) row: [year] [annual amount] [months divisor 1-12] [computed monthly avg] [include-in-avg checkbox]
    const currYear = new Date().getFullYear();
    const rowYear = Number(data.month) || currYear;
    // For the current year — default divisor to elapsed months; past years — 12
    const defaultDiv = (rowYear === currYear) ? (new Date().getMonth() + 1) : 12;
    const mDiv = Number(data.mDiv) > 0 ? Number(data.mDiv) : defaultDiv;
    const opts = Array.from({length: 12}, (_, i) => i + 1).map(v => `<option value="${v}" ${v === mDiv ? 'selected' : ''}>${v} חוד'</option>`).join('');
    // Default checkbox state: pre-checked if this year matches the bank rule (H1 → last year, H2 → current year)
    const includedYear = _defaultIncludedYearForSelfEmployed();
    const included = (typeof data.inAvg === 'boolean') ? data.inAvg : (String(data.month || currYear) === includedYear);
    return `
      <div class="jobIncRow" style="display:grid;grid-template-columns:70px 1fr 80px 1fr 34px auto;gap:4px;margin-bottom:4px;align-items:center">
        <input type="number" min="1990" max="2100" step="1" class="incMonth" value="${escapeAttr(data.month || String(currYear))}" oninput="_onJobIncInput(this)" placeholder="שנה" style="padding:4px 6px;font-size:12px">
        <input type="text" inputmode="numeric" class="incAmount" value="${escapeAttr(amtStr)}" oninput="onMoneyInput(this);_onJobIncInput(this)" placeholder="הכנסה שנתית" style="padding:4px 6px;font-size:12px">
        <select class="incDiv" onchange="_onJobIncInput(this)" style="padding:4px 6px;font-size:12px">${opts}</select>
        <div class="incMonthlyEq" style="padding:4px 6px;font-size:12px;background:#f0f9ff;border:1px solid #bae6fd;border-radius:6px;color:#0369a1;font-weight:700;text-align:center">—</div>
        <label style="display:flex;align-items:center;justify-content:center;gap:2px;font-size:11px;cursor:pointer" title="כלול בממוצע (ברירת מחדל לפי כלל הבנק — עד יוני שנה קודמת, מיולי שנה נוכחית)">
          <input type="checkbox" class="incInAvg" ${included ? 'checked' : ''} onchange="_onJobIncInput(this)" style="accent-color:var(--accent)">
        </label>
        <button type="button" class="icon-btn" onclick="this.closest('.jobIncRow').remove();_recalcJobCardAvg(this.closest('.jobIncCard'))" style="padding:2px 6px;font-size:12px" title="הסר">✕</button>
      </div>
    `;
  }
  return `
    <div class="jobIncRow" style="display:grid;grid-template-columns:1fr 1fr auto;gap:4px;margin-bottom:4px;align-items:center">
      <input type="month" class="incMonth" value="${escapeAttr(data.month || '')}" oninput="_onJobIncInput(this)" style="padding:4px 6px;font-size:12px">
      <input type="text" inputmode="numeric" class="incAmount" value="${escapeAttr(amtStr)}" oninput="onMoneyInput(this);_onJobIncInput(this)" placeholder="סכום" style="padding:4px 6px;font-size:12px">
      <button type="button" class="icon-btn" onclick="this.closest('.jobIncRow').remove();_recalcJobCardAvg(this.closest('.jobIncCard'))" style="padding:2px 6px;font-size:12px" title="הסר">✕</button>
    </div>
  `;
}

function _jobCardHtml(job, rows, warn) {
  const yearly = _isYearlyType(job.type);
  let effectiveRows = rows || [];
  if (!warn) {
    const seed = _defaultSeedRowsForType(job.type);
    const seenPeriods = new Set(effectiveRows.map(r => r.month || ''));
    const missing = seed.filter(s => !seenPeriods.has(s.month));
    effectiveRows = missing.concat(effectiveRows);
    effectiveRows.sort((a, b) => (b.month || '').localeCompare(a.month || ''));
  }
  const rowsHtml = effectiveRows.map(r => _incRowHtml(r, job.type)).join('');
  const bg = warn ? '#fef3c7' : '#eef2ff';
  const border = warn ? '#fbbf24' : '#c7d2fe';
  const titleColor = warn ? '#78350f' : '#3730a3';
  const addLabel = yearly ? '+ הוסף שנה' : '+ הוסף חודש';
  const isPrimary = !!job.isPrimary;
  // Editable type dropdown — includes the standard set + a marker for whatever custom type is on the job
  const knownTypes = ['שכיר', 'עצמאי', 'אברך', 'אישור רב', 'אישור ביטוח לאומי', 'קצבת ילדים'];
  const currType = job.type || '';
  const typeOptions = knownTypes.map(t => `<option value="${escapeAttr(t)}"${t === currType ? ' selected' : ''}>${escapeHtml(t)}</option>`).join('') +

        <div style="margin-inline-start:auto;display:flex;align-items:center;gap:6px">
          <label style="font-size:11px;color:${titleColor};font-weight:600;cursor:pointer">הכנסה עיקרית</label>
          <label class="switch" style="position:relative;display:inline-block;width:36px;height:20px;cursor:pointer">
            <input type="checkbox" class="jobIsPrimary" ${isPrimary ? 'checked' : ''} onchange="_onPrimaryToggle(this)" style="opacity:0;width:0;height:0">
            <span class="slider" style="position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:${isPrimary ? '#16a34a' : '#cbd5e1'};border-radius:20px;transition:.2s"></span>
            <span class="knob" style="position:absolute;top:2px;${isPrimary ? 'left:2px' : 'right:2px'};width:16px;height:16px;background:white;border-radius:50%;transition:.2s;pointer-events:none"></span>
          </label>
        </div>
      </div>
      <!-- Quick fields row: type + monthly avg + workplace -->
      <div style="display:grid;grid-template-columns:1fr 1fr 2fr;gap:8px;padding:10px">
        <div class="form-group" style="margin-bottom:0"><label style="font-size:11px;color:${titleColor}">סוג הכנסה</label>
          <select class="jobTypeSel" onchange="this.closest('.jobIncCard').dataset.type=this.value" style="width:100%;padding:5px 6px;font-size:12px">${typeOptions}</select>
        </div>
        <div class="form-group" style="margin-bottom:0"><label style="font-size:11px;color:${titleColor}">הכנסה חודשית ${yearly ? '(משוקלל)' : '(ממוצע)'}</label>
          <input type="text" class="jobIncAvgDisplay" readonly value="—" style="width:100%;padding:5px 6px;font-size:13px;font-weight:700;color:${titleColor};background:#fff">

          <input type="text" class="jobEmployer" value="${escapeAttr(job.employer || '')}" oninput="this.closest('.jobIncCard').dataset.employer=this.value.trim()" placeholder="למשל: משרד החינוך" style="width:100%;padding:5px 6px;font-size:12px">

      <div class="jobDetailsSummary" style="display:none;padding:2px 12px 10px;color:${titleColor};font-size:11px;line-height:1.5"></div>

      <div class="jobExpandedSection" style="display:none;padding:0 10px 10px">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
          <div class="form-group" style="margin-bottom:0"><label style="font-size:11px;color:${titleColor}">💼 תפקיד בעבודה</label>
            <input type="text" class="jobRole" value="${escapeAttr(job.role || '')}" placeholder="למשל: מנהל" oninput="_updateJobDetailsSummary(this.closest('.jobIncCard'))" style="width:100%;padding:5px 6px;font-size:12px">

// Update the primary-income toggle's slider color/position when clicked
function _onPrimaryToggle(cb) {
  const label = cb.closest('label.switch');
  if (!label) return;
  const slider = label.querySelector('.slider');
  const knob = label.querySelector('.knob');
  if (slider) slider.style.background = cb.checked ? '#16a34a' : '#cbd5e1';
  if (knob) { knob.style.left = cb.checked ? '2px' : ''; knob.style.right = cb.checked ? '' : '2px'; }
}

// Toggle the expanded details panel on a job card + swap the button caret.
// When collapsing: rebuild the compact summary so any filled details stay visible in the header.
// When expanding: hide the summary since the same info is right below in the editable form.
function _toggleJobCardExpand(btn) {
  const card = btn.closest('.jobIncCard');
  if (!card) return;
  const section = card.querySelector('.jobExpandedSection');
  const summary = card.querySelector('.jobDetailsSummary');
  if (!section) return;
  const shown = section.style.display !== 'none';
  section.style.display = shown ? 'none' : '';
  btn.textContent = shown ? 'פירוט מלא ▾' : 'פירוט מלא ▴';
  if (summary) {
    if (shown) {
      // Now collapsed → build & show the summary if there's anything to show
      _updateJobDetailsSummary(card);
    } else {
      summary.style.display = 'none';
    }
  }
}

// Rebuild the collapsed summary strip from the current values of the expanded inputs. Shown only when
// there's at least one filled field AND the expanded section is currently collapsed.
function _updateJobDetailsSummary(card) {
  if (!card) return;
  const summary = card.querySelector('.jobDetailsSummary');
  const section = card.querySelector('.jobExpandedSection');
  if (!summary) return;
  const role = (card.querySelector('.jobRole') || {}).value || '';
  const start = (card.querySelector('.jobStartDate') || {}).value || '';
  const addr = (card.querySelector('.jobWorkplaceAddress') || {}).value || '';
  const prev = (card.querySelector('.jobPreviousWorkplace') || {}).value || '';
  const parts = [];
  if (role.trim()) parts.push('💼 ' + escapeHtml(role.trim()));
  if (start) {
    const m = /^(\d{4})-(\d{2})$/.exec(start);
    const label = m ? (['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'][Number(m[2]) - 1] + ' ' + m[1]) : start;
    parts.push('📅 ' + escapeHtml(label));
  }
  if (addr.trim()) parts.push('🏢 ' + escapeHtml(addr.trim()));
  if (prev.trim()) parts.push('↩ קודם: ' + escapeHtml(prev.trim()));
  const collapsed = !section || section.style.display === 'none';
  if (parts.length === 0 || !collapsed) {
    summary.style.display = 'none';
    summary.innerHTML = '';
    return;
  }
  summary.style.display = '';
  summary.innerHTML = parts.join(' · ');
}

function addJobIncomeMonthRow(btn) {
  const card = btn.closest('.jobIncCard');
  if (!card) return;
  const rows = card.querySelector('.jobIncRows');
  const type = card.dataset.type || '';
  // Auto-fill the next period: one step before the earliest existing period; if the card is empty,
  // use the standard seed's first period. This gives the user rolling months/years without typing dates.
  const nextPeriod = _nextPeriodForCard(card, type);
  rows.insertAdjacentHTML('beforeend', _incRowHtml({ month: nextPeriod }, type));
  _recalcJobCardAvg(card);
}

// Given a card, determine which period value ("YYYY-MM" or "YYYY") to suggest for the next row.
function _nextPeriodForCard(card, type) {
  const existing = Array.from(card.querySelectorAll('.jobIncRow .incMonth'))
    .map(inp => (inp.value || '').trim())
    .filter(Boolean);
  const yearly = _isYearlyType(type);
  if (yearly) {
    if (existing.length === 0) {
      // Start from last full tax year
      return String(new Date().getFullYear() - 1);
    }
    // Find earliest year, go one back
    const years = existing.map(x => Number(x)).filter(y => y > 0);
    const minY = years.length ? Math.min(...years) : new Date().getFullYear();
    return String(minY - 1);
  }
  // Monthly — expects YYYY-MM
  if (existing.length === 0) {
    return _defaultPayslipMonthsISO()[0]; // most-recent seed month
  }
  // Parse YYYY-MM strings; go one month earlier than the earliest
  const parsed = existing.map(s => {
    const m = /^(\d{4})-(\d{1,2})$/.exec(s);
    return m ? { y: Number(m[1]), m: Number(m[2]) } : null;
  }).filter(Boolean);
  if (parsed.length === 0) return _defaultPayslipMonthsISO()[0];
  parsed.sort((a, b) => a.y - b.y || a.m - b.m);
  const earliest = parsed[0];
  const d = new Date(earliest.y, earliest.m - 1 - 1, 1); // one month earlier
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}

function _onJobIncInput(el) {
  const card = el.closest('.jobIncCard');
  if (card) _recalcJobCardAvg(card);
}

// Recomputes the top-of-modal summary strip (borrowers/guarantors/obligations/net/ratio) from the
// current DOM state. Cheap enough to call on every input change.
function _updateIncomesEditorSummary() {
  const modal = document.getElementById('incEditorSummary');
  if (!modal) return;
  // Sum monthly averages per container. Prefix pattern: fJobIncomesb0, fJobIncomesb1, fJobIncomesg0…
  const readAvg = (cardEl) => {
    const t = (cardEl.querySelector('.jobIncAvg') || {}).textContent || '';
    return parseFormattedNum(t) || 0;
  };
  const sumForPrefixLetter = (letter) => {
    let sum = 0;
    document.querySelectorAll('.jobIncomesWrap[id^="fJobIncomes' + letter + '"]').forEach(container => {
      container.querySelectorAll('.jobIncCard').forEach(card => { sum += readAvg(card); });
    });
    return sum;
  };
  const borrowersSum = sumForPrefixLetter('b');
  const guarantorsSumFull = sumForPrefixLetter('g');
  const guarantorsWeighted = Math.round(guarantorsSumFull * 0.5);
  // Obligations included in ratio — end date > 18 months (or blank), summed by monthly
  let obligIncluded = 0;
  const now = new Date();
  const monthsUntil = (iso) => {
    if (!iso) return null;
    const m = /^(\d{4})-(\d{1,2})$/.exec(iso);
    if (!m) return null;
    return (Number(m[1]) - now.getFullYear()) * 12 + (Number(m[2]) - 1 - now.getMonth());
  };
  document.querySelectorAll('#obligationsList .obligationRow').forEach(row => {
    const monthly = parseFormattedNum((row.querySelector('.obMonthly') || {}).value || '') || 0;
    if (monthly <= 0) return;
    const end = (row.querySelector('.obEnd') || {}).value || '';
    const m = monthsUntil(end);
    if (m !== null && m <= 18) return; // excluded from ratio
    obligIncluded += monthly;
  });
  const grossForRatio = Math.round(borrowersSum + guarantorsWeighted);
  const net = Math.max(0, grossForRatio - obligIncluded);
  const setText = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = val > 0 ? fmtMoney(Math.round(val)) : '—'; };
  setText('incSumBorrowers', borrowersSum);
  setText('incSumGuars', guarantorsWeighted);
  setText('incSumOblig', obligIncluded);
  setText('incSumNet', net);
  // Ratio uses the loan-composition monthly payment (if set) as the numerator
  const c = _incEditingClientId ? state.clients.find(x => x.id === _incEditingClientId) : null;
  const plannedMonthly = c ? getPlannedMonthlyRepayment(c) : 0;
  const ratioEl = document.getElementById('incSumRatio');
  if (ratioEl) {
    if (net > 0 && plannedMonthly > 0) {
      const ratio = Math.round((plannedMonthly / net) * 1000) / 10;
      ratioEl.textContent = ratio + '%';
      ratioEl.style.color = ratio <= 40 ? '#166534' : ratio <= 50 ? '#b45309' : '#991b1b';
    } else {
      ratioEl.textContent = '—';
      ratioEl.style.color = '#3730a3';
    }
  }
}

function _recalcJobCardAvg(card) {
  if (!card) return;
  const type = card.dataset.type || '';
  const yearly = _isYearlyType(type);
  const rows = Array.from(card.querySelectorAll('.jobIncRow'));
  const avgEl = card.querySelector('.jobIncAvg');
  const displayEl = card.querySelector('.jobIncAvgDisplay');
  if (!avgEl) return;
  const setAvgText = (txt) => { avgEl.textContent = txt; if (displayEl) displayEl.value = txt; };
  if (yearly) {
    // Each row is an annual amount + a months-divisor. The card's monthly average pools all CHECKED
    // rows into one bucket: monthly = Σ(amounts) / Σ(divisors). Example — 180,000 for 6 months + 12
    // for 12 months + 12 for 12 months → 180,024 / 30 = 6,001 /month.
    let sumAmt = 0, sumDiv = 0;
    rows.forEach(r => {
      const amt = parseFormattedNum(r.querySelector('.incAmount').value);
      const div = Math.max(1, Number((r.querySelector('.incDiv') || {}).value) || 12);
      const monthly = amt > 0 ? (amt / div) : 0;
      const eq = r.querySelector('.incMonthlyEq');
      if (eq) eq.textContent = monthly > 0 ? '≈ ' + fmtMoney(Math.round(monthly)) + ' /חודש' : '—';
      const inAvgCb = r.querySelector('.incInAvg');
      const inAvg = inAvgCb ? inAvgCb.checked : true;
      if (amt > 0 && inAvg) { sumAmt += amt; sumDiv += div; }
      if (inAvgCb) r.style.opacity = inAvg ? '' : '0.55';
    });
    if (sumDiv === 0 || sumAmt === 0) { setAvgText('—'); _updateIncomesEditorSummary(); return; }
    setAvgText(fmtMoney(Math.round(sumAmt / sumDiv)));
    _updateIncomesEditorSummary();
    return;
  }
  const amounts = rows.map(r => parseFormattedNum(r.querySelector('.incAmount').value)).filter(v => v > 0);
  if (amounts.length === 0) { setAvgText('—'); _updateIncomesEditorSummary(); return; }
  const sum = amounts.reduce((s, v) => s + v, 0);
  setAvgText(fmtMoney(Math.round(sum / amounts.length)));
  _updateIncomesEditorSummary();
}

// Fill a person's container with one card per declared job + orphan cards for saved data whose
// job no longer matches (so nothing is silently lost).
function loadJobIncomes(prefix, person, extraJobs) {
  const container = document.getElementById('fJobIncomes' + prefix);
  if (!container) return;
  const baseJobs = _jobsForPerson(person);
  // Append household extras (e.g. קצבת ילדים for married clients) — de-duplicate by (type,employer)
  const jobs = baseJobs.slice();
  (extraJobs || []).forEach(ex => {
    const dup = jobs.some(j => (j.type||'') === (ex.type||'') && (j.employer||'') === (ex.employer||''));
    if (!dup) jobs.push(ex);
  });
  const jobIncomes = Array.isArray(person.jobIncomes) ? person.jobIncomes : [];
  const legacy = Array.isArray(person.monthlyIncomes) ? person.monthlyIncomes : [];
  const usedKeys = new Set();
  const _mergeSavedIntoJob = (j, saved) => {
    if (!saved) return j;
    return Object.assign({}, j, {
      startDate: saved.startDate || j.startDate || '',
      role: saved.role || j.role || '',
      workplaceAddress: saved.workplaceAddress || j.workplaceAddress || '',
      previousWorkplace: saved.previousWorkplace || j.previousWorkplace || '',
      isPrimary: !!saved.isPrimary
    });
  };
  const cards = jobs.map(j => {
    const key = (j.type || '') + '|' + (j.employer || '');
    usedKeys.add(key);
    const saved = jobIncomes.find(s => (s.type||'') === (j.type||'') && (s.employer||'') === (j.employer||''));
    return _jobCardHtml(_mergeSavedIntoJob(j, saved), saved ? saved.months : [], false);
  });
  jobIncomes.forEach(s => {
    const key = (s.type||'') + '|' + (s.employer||'');
    if (!usedKeys.has(key) && (s.months||[]).length > 0) {
      usedKeys.add(key);
      cards.push(_jobCardHtml({
        type: s.type||'', employer: s.employer||'',
        startDate: s.startDate || '', role: s.role || '',
        workplaceAddress: s.workplaceAddress || '', previousWorkplace: s.previousWorkplace || '',
        isPrimary: !!s.isPrimary
      }, s.months, true));
    }
  });
  // Legacy flat monthlyIncomes → one "כללי" card once
  if (jobIncomes.length === 0 && legacy.length > 0) {
    cards.push(_jobCardHtml({type: '', employer: ''}, legacy, true));
  }
  // Fallback: if the person has NO declared jobs and no saved rows, still offer a single
  // blank generic card so the user can start entering numbers.
  if (cards.length === 0) {
    cards.push(_jobCardHtml({type: '', employer: ''}, [], false));
  }
  container.innerHTML = cards.join('');
  container.querySelectorAll('.jobIncCard').forEach(card => {
    _recalcJobCardAvg(card);
    _updateJobDetailsSummary(card);
  });
}

function collectJobIncomes(prefix) {
  const container = document.getElementById('fJobIncomes' + prefix);
  if (!container) return [];
  return Array.from(container.querySelectorAll('.jobIncCard')).map(card => {
    const rows = Array.from(card.querySelectorAll('.jobIncRow')).map(r => {
      const divEl = r.querySelector('.incDiv');
      const inAvgEl = r.querySelector('.incInAvg');
      const row = {
        month: r.querySelector('.incMonth').value,
        amount: parseFormattedNum(r.querySelector('.incAmount').value)
      };
      if (divEl) row.mDiv = Math.max(1, Number(divEl.value) || 12);
      if (inAvgEl) row.inAvg = inAvgEl.checked;
      return row;
    }).filter(x => x.amount > 0);
    const startEl = card.querySelector('.jobStartDate');
    const startDate = startEl ? (startEl.value || '').trim() : '';
    const roleEl = card.querySelector('.jobRole');
    const role = roleEl ? (roleEl.value || '').trim() : '';
    const addrEl = card.querySelector('.jobWorkplaceAddress');
    const workplaceAddress = addrEl ? (addrEl.value || '').trim() : '';
    const prevEl = card.querySelector('.jobPreviousWorkplace');
    const previousWorkplace = prevEl ? (prevEl.value || '').trim() : '';
    const primaryEl = card.querySelector('.jobIsPrimary');
    const isPrimary = !!(primaryEl && primaryEl.checked);
    const typeSelEl = card.querySelector('.jobTypeSel');
    const employerEl = card.querySelector('.jobEmployer');
    const type = typeSelEl ? (typeSelEl.value || card.dataset.type || '').trim() : (card.dataset.type || '');
    const employer = employerEl ? (employerEl.value || '').trim() : (card.dataset.employer || '');
    const keep = rows.length > 0 || startDate || role || workplaceAddress || previousWorkplace || type || employer;
    if (!keep) return null;
    return {
      type, employer,
      isPrimary,
      startDate, role,
      workplaceAddress, previousWorkplace,
      months: rows
    };
  }).filter(Boolean);
}

function saveIncomesEditor() {
  if (!_incEditingClientId) { closeModal(); return; }
  const c = state.clients.find(x => x.id === _incEditingClientId);
  if (!c) { closeModal(); return; }
  (c.borrowers || []).forEach((b, i) => { b.jobIncomes = collectJobIncomes('b' + i); });
  (c.guarantors || []).forEach((g, i) => { g.jobIncomes = collectJobIncomes('g' + i); });
  c.obligations = collectObligations();
  save();
  closeModal();
  _incEditingClientId = null;
  if (currentTab === 'detail') renderClientDetail();
}

// ============================================================================
// Monthly obligations — existing mortgage + bank loans, editable by user.
// Auto-seeded from what the client already declared in the main edit form:
//   - Existing mortgage panel (c.existingMortgage + c.existingMortgageBank)
//   - Any borrower's bankAccount rows marked hasLoans:true
// Stored on the client as c.obligations = [{ id, source, key, label, balance, monthly, endDate }]
// ============================================================================

function _uidObligation() { return 'ob_' + Math.random().toString(36).slice(2, 10); }

// Owner identifier: 'b0'/'b1' for borrowers, 'g0'/'g1'... for guarantors, '' for property-level.
function _peopleOwnerOptions(c) {
  const opts = [];
  (c.borrowers || []).forEach((b, i) => opts.push({ value: 'b' + i, label: (b.role || (i === 0 ? 'לווה' : 'בת/בן זוג')) + (b.name ? ' — ' + b.name : '') }));
  (c.guarantors || []).forEach((g, i) => opts.push({ value: 'g' + i, label: 'ערב ' + (i + 1) + (g.name ? ' — ' + g.name : '') }));
  return opts;
}
function _ownerLabelFromId(c, ownerId) {
  const opts = _peopleOwnerOptions(c);
  const f = opts.find(o => o.value === ownerId);
  return f ? f.label : '';
}

function _detectAutoObligations(c) {
  const auto = [];
  if (Number(c.existingMortgage) > 0) {
    const bank = (c.existingMortgageBank || '').trim();
    auto.push({
      source: 'existing-mortgage',
      key: 'existing-mortgage',
      label: bank ? ('משכנתא קיימת · ' + bank) : 'משכנתא קיימת',
      balance: Number(c.existingMortgage) || 0,
      monthly: 0,
      endDate: '',
      owner: '' // property-level
    });
  }
  const seenKeys = new Set();
  // Collect per-person bank loans — one auto row per (person, bank) combination
  const collectFromPerson = (person, ownerId) => {
    const banks = Array.isArray(person.bankAccounts) ? person.bankAccounts : [];
    banks.forEach(ba => {
      if (!ba || !ba.bank) return;
      if (ba.hasLoans === false) return;
      const bankName = String(ba.bank).trim();
      if (!bankName) return;
      const key = 'bank-loan|' + ownerId + '|' + bankName;
      if (seenKeys.has(key)) return;
      seenKeys.add(key);
      const ownerLabel = _ownerLabelFromId(c, ownerId);
      auto.push({
        source: 'bank-loan',
        key,
        label: 'הלוואה בבנק ' + bankName + (ownerLabel ? ' (' + ownerLabel + ')' : ''),
        balance: 0,
        monthly: 0,
        endDate: '',
        owner: ownerId
      });
    });
  };
  (c.borrowers || []).forEach((b, i) => collectFromPerson(b, 'b' + i));
  (c.guarantors || []).forEach((g, i) => collectFromPerson(g, 'g' + i));
  return auto;
}

function _mergeObligations(saved, auto) {
  const savedByKey = {};
  (saved || []).forEach(s => {
    if (s && s.key) savedByKey[s.key] = s;
  });
  const merged = [];
  const usedKeys = new Set();
  // Emit auto-detected first — with saved values overlaid when the same key exists
  auto.forEach(a => {
    const s = savedByKey[a.key];
    if (s) {
      merged.push({ ...a, ...s, source: a.source, key: a.key, label: s.label || a.label });
      usedKeys.add(a.key);
    } else {
      merged.push({ ...a, id: _uidObligation() });
    }
  });
  // Add any saved obligations that don't correspond to a current auto-detected one (custom rows or removed sources)
  (saved || []).forEach(s => {
    if (s && s.key && !usedKeys.has(s.key)) {
      merged.push(s);
    } else if (s && !s.key) {
      merged.push({ ...s, key: s.key || _uidObligation() });
    }
  });
  return merged;
}

// Auto-fill the end date for an obligation row from balance ÷ monthly. Skipped when the user has

function _maybeAutoEnd(input) {
  const row = input.closest('.obligationRow');
  if (!row) return;
  const endEl = row.querySelector('.obEnd');
  if (!endEl || endEl.dataset.manual === '1') return;
  const balance = parseFormattedNum(row.querySelector('.obBalance').value) || 0;
  const monthly = parseFormattedNum(row.querySelector('.obMonthly').value) || 0;
  if (balance <= 0 || monthly <= 0) { endEl.value = ''; return; }
  const monthsLeft = Math.ceil(balance / monthly);
  const d = new Date();
  d.setDate(1);
  d.setMonth(d.getMonth() + monthsLeft);
  endEl.value = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}

// ============================================================================
// Income / obligations / repayment ratio helpers used by the client detail card
// ============================================================================

// Average monthly income across all borrowers, computed from their jobIncomes.
// Yearly jobs (עצמאי) are divided by 12 to normalise to monthly.
// Monthly income per person (borrower or guarantor). Same formula for both.
function _personMonthlyIncome(p) {
  let total = 0;
  const jobs = Array.isArray(p.jobIncomes) ? p.jobIncomes : [];
  jobs.forEach(j => {
    const months = Array.isArray(j.months) ? j.months.filter(m => m.amount > 0) : [];
    if (months.length === 0) return;
    if (_isYearlyType(j.type)) {
      let sumAmt = 0, sumDiv = 0;
      months.forEach(m => {
        if (m.inAvg === false) return;
        const amt = Number(m.amount || 0);
        const div = Math.max(1, Number(m.mDiv) || 12);
        if (amt > 0) { sumAmt += amt; sumDiv += div; }
      });
      if (sumDiv > 0) total += sumAmt / sumDiv;
    } else {
      const sum = months.reduce((s, m) => s + Number(m.amount || 0), 0);
      total += sum / months.length;
    }
  });
  return total;
}
// Bank convention: guarantors' income counts at 50% for repayment ratio.
const GUARANTOR_INCOME_WEIGHT = 0.5;
function getBorrowersIncomeMonthly(c) {
  return Math.round((c.borrowers || []).reduce((s, b) => s + _personMonthlyIncome(b), 0));
}
function getGuarantorsIncomeMonthly(c) {
  return Math.round((c.guarantors || []).reduce((s, g) => s + _personMonthlyIncome(g), 0));
}
// The "gross" (used in the ratio) — borrowers 100% + guarantors 50%.
function getMonthlyIncomeGross(c) {
  return Math.round(getBorrowersIncomeMonthly(c) + getGuarantorsIncomeMonthly(c) * GUARANTOR_INCOME_WEIGHT);
}

// Sum of monthly repayments across the loan-composition tracks (הרכב הלוואה task).
function getPlannedMonthlyRepayment(c) {
  const tracks = (c.loanComposition && c.loanComposition.tracks) ? c.loanComposition.tracks : {};
  let sum = 0;
  Object.values(tracks).forEach(d => {
    if (!d) return;
    const m = calcMonthlyPayment(Number(d.amount)||0, Number(d.rate)||0, Number(d.years)||0);
    if (isFinite(m)) sum += m;
  });
  return Math.round(sum);
}

// Months between now and an ISO YYYY-MM string. Positive = future, negative = past. Null when unknown.
function _monthsUntilISO(iso) {
  if (!iso) return null;
  const m = /^(\d{4})-(\d{1,2})$/.exec(iso);
  if (!m) return null;
  const today = new Date();
  const end = new Date(Number(m[1]), Number(m[2]) - 1, 1);
  return (end.getFullYear() - today.getFullYear()) * 12 + (end.getMonth() - today.getMonth());
}

// Splits obligations into three buckets by end-date months-until:
//   inRatio: counted in the repayment ratio (end > 18 months OR no end date)
//   nearThreshold: end date is 15–18 months from now (soft warning)
//   excluded: ends in <= 18 months (shown but not summed)
function classifyObligations(c) {
  const list = Array.isArray(c.obligations) ? c.obligations : [];
  const inRatio = [], excluded = [], nearThreshold = [];
  list.forEach(o => {
    const monthly = Number(o.monthly) || 0;
    if (monthly <= 0 && !(o.balance > 0)) return;
    const m = _monthsUntilISO(o.endDate);
    if (m === null) { inRatio.push(o); return; }
    if (m <= 18) {
      excluded.push({ ...o, monthsLeft: m });
    } else if (m <= 21) {
      // Between 18 and 21 months — counted, but flag as "close to threshold"
      nearThreshold.push({ ...o, monthsLeft: m });
      inRatio.push(o);
    } else {
      inRatio.push(o);
    }
  });
  return { inRatio, excluded, nearThreshold };
}

function _renderIncomesSummaryCard(c) {
  const gross = getMonthlyIncomeGross(c);
  const { inRatio, excluded, nearThreshold } = classifyObligations(c);
  const inRatioSum = inRatio.reduce((s, o) => s + (Number(o.monthly) || 0), 0);
  const net = Math.max(0, gross - inRatioSum);
  const monthly = getPlannedMonthlyRepayment(c);
  const ratio = net > 0 && monthly > 0 ? Math.round((monthly / net) * 1000) / 10 : null;
  const ratioColor = ratio === null ? 'var(--muted)' : (ratio <= 40 ? '#16a34a' : ratio <= 50 ? '#f59e0b' : '#dc2626');
  const noIncome = gross === 0;
  const noMonthly = monthly === 0;
  // Header block: incomes summary
  const topBlock = `
    <div style="font-size:11px;font-weight:700;color:#166534;margin-top:6px;border-bottom:1px solid var(--border);padding-bottom:2px">הכנסות</div>
    <div style="display:flex;justify-content:space-between;align-items:baseline;font-size:12px;padding:1px 0"><span style="color:var(--muted)">הכנסה חודשית (ברוטו)</span><strong style="font-size:14px">${noIncome ? '—' : fmtMoney(gross)}</strong></div>
    ${inRatioSum > 0 ? `<div style="display:flex;justify-content:space-between;align-items:baseline;font-size:12px;padding:1px 0"><span style="color:var(--muted)">− התחייבויות</span><strong style="font-size:14px;color:#b45309">${fmtMoney(inRatioSum)}</strong></div>` : ''}
    <div style="display:flex;justify-content:space-between;align-items:baseline;font-size:12px;padding:1px 0"><span style="color:var(--muted)">הכנסה נטו</span><strong style="font-size:14px;color:#16a34a">${noIncome ? '—' : fmtMoney(net)}</strong></div>
  `;
  const bottomBlock = `
    <div style="font-size:11px;font-weight:700;color:#166534;margin-top:6px;border-bottom:1px solid var(--border);padding-bottom:2px">החזר חודשי (הרכב הלוואה)</div>
    <div style="display:flex;justify-content:space-between;align-items:baseline;font-size:12px;padding:1px 0"><span style="color:var(--muted)">סה"כ החזר</span><strong style="font-size:14px">${noMonthly ? '—' : fmtMoney(monthly)}</strong></div>
    <div style="display:flex;justify-content:space-between;align-items:baseline;font-size:12px;padding:2px 0;background:#f0fdf4;border-radius:4px;padding:2px 4px"><span style="color:#166534;font-weight:700">יחס החזר</span><strong style="font-size:16px;color:${ratioColor}">${ratio === null ? '—' : ratio + '%'}</strong></div>
  `;
  const nearHtml = nearThreshold.length
    ? `<div style="margin-top:4px;padding:4px 6px;background:#fef3c7;border:1px solid #fbbf24;border-radius:4px;font-size:10px;color:#78350f;line-height:1.4">
        ⏳ ${nearThreshold.map(o => `<div>${escapeHtml(o.label || 'הלוואה')} — עוד ${o.monthsLeft} חודשים לסיום, קרוב לסף 18</div>`).join('')}
      </div>` : '';
  const excludedHtml = excluded.length
    ? `<div style="margin-top:4px;padding:4px 6px;background:#eef2ff;border:1px solid #c7d2fe;border-radius:4px;font-size:10px;color:#3730a3;line-height:1.4">
        ℹ️ ${excluded.length} הלוואות מסתיימות בפחות מ־18 חודשים ולא נכללות ביחס:${excluded.map(o => `<div>• ${escapeHtml(o.label || 'הלוואה')} (${o.monthsLeft} חודשים)</div>`).join('')}
      </div>` : '';
  return topBlock + bottomBlock + nearHtml + excludedHtml;
}

    gemachsWrap.style.display = gemachsCb.checked ? '' : 'none';
    div.querySelector('.gGemachs').value = Array.isArray(data.gemachs) ? data.gemachs.join(', ') : (data.gemachs || '');
    const _empEl = div.querySelector('.gEmployers');
    if (_empEl) _empEl.value = Array.isArray(data.employers) ? data.employers.join(', ') : (data.employers || '');
  }
}

function collectGuarantors() {
  return Array.from(document.querySelectorAll('.gRow')).map(row => {
    const emps = Array.from(row.querySelectorAll('.gEmpCb:checked')).map(cb => cb.value);
    const bankData = row.querySelector('.gBankAccountsData');
    let bankAccounts = [];
    try { bankAccounts = JSON.parse(bankData?.value || '[]'); } catch(e) {}
    const gemachsRaw = row.querySelector('.gGemachs')?.value || '';
    const gemachs = gemachsRaw.split(',').map(x => x.trim()).filter(Boolean);
    const employersRaw = row.querySelector('.gEmployers')?.value || '';
    const employers = employersRaw.split(',').map(x => x.trim()).filter(Boolean);
    return {
      name: row.querySelector('.gName').value.trim(),
      idNumber: row.querySelector('.gId').value.trim(),
      phone: row.querySelector('.gPhone').value.trim(),
      email: row.querySelector('.gEmail').value.trim(),
      employmentType: emps[0] || '', // keep first for backward-compat
      employmentTypes: emps,
      employers,
      bankAccounts,
      jointAccount: !!row.querySelector('.gJointAccount')?.checked,
      hasGemachs: !!row.querySelector('.gHasGemachs')?.checked,
      gemachs
    };
  }).filter(g => g.name || g.idNumber);
}

function addSellerRow(data) {
  data = data || {};
  const list = document.getElementById('shSellersList');
  if (!list) return;
  const idx = list.querySelectorAll('.sh-seller-row').length + 1;
  const row = document.createElement('div');
  row.className = 'sh-seller-row';
  row.style.cssText = 'background:white;border:1px solid var(--border);border-radius:8px;padding:8px;margin-bottom:8px';
  row.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
      <strong style="font-size:12px;color:#334155">מוכר <span class="sh-idx">${idx}</span></strong>
      <button type="button" class="icon-btn" onclick="removeSellerRow(this)" title="הסר מוכר">✕</button>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
      <div class="form-group" style="margin-bottom:0"><label style="font-size:12px">שם המוכר (בחר או הקלד)</label><input class="sh_sellerName" list="dl_contacts_all" value="${escapeAttr(data.name||'')}"></div>
      <div class="form-group" style="margin-bottom:0"><label style="font-size:12px">טלפון</label><input class="sh_sellerPhone" value="${escapeAttr(data.phone||'')}"></div>
      <div class="form-group" style="margin-bottom:0"><label style="font-size:12px">אימייל</label><input class="sh_sellerEmail" value="${escapeAttr(data.email||'')}"></div>
    </div>
  `;
  list.appendChild(row);
  // Ensure a general datalist of contacts exists (for seller name autocomplete)
  if (!document.getElementById('dl_contacts_all')) {
    const dl = document.createElement('datalist');
    dl.id = 'dl_contacts_all';
    ((state.settings && state.settings.contacts) || []).forEach(x => {
      const opt = document.createElement('option');
      opt.value = x.name || '';
      dl.appendChild(opt);
    });
    document.body.appendChild(dl);
  }
  // Auto-fill phone/email when a matching contact is picked
  const nameInput = row.querySelector('.sh_sellerName');
  nameInput.addEventListener('change', () => {
    const name = (nameInput.value || '').trim();
    if (!name) return;
    const match = ((state.settings && state.settings.contacts) || []).find(x => (x.name || '').trim() === name);
    if (!match) return;
    const phoneEl = row.querySelector('.sh_sellerPhone');
    const emailEl = row.querySelector('.sh_sellerEmail');
    if (phoneEl && !phoneEl.value) phoneEl.value = match.phone || '';
    if (emailEl && !emailEl.value) emailEl.value = match.email || '';
  });
}

function removeSellerRow(btn) {
  const row = btn.closest('.sh-seller-row');
  if (!row) return;
  row.remove();
  // Re-number remaining rows
  const rows = document.querySelectorAll('#shSellersList .sh-seller-row');
  rows.forEach((r, i) => { const idx = r.querySelector('.sh-idx'); if (idx) idx.textContent = String(i + 1); });
}

function onContactPicked(nameId, phoneId, emailId, category) {
  const nameEl = document.getElementById(nameId);
  if (!nameEl) return;
  const name = (nameEl.value || '').trim();
  if (!name) return;
  const contacts = (state.settings && state.settings.contacts) || [];
  const match = contacts.find(x => (x.name || '').trim() === name && (!category || x.category === category))
    || contacts.find(x => (x.name || '').trim() === name);
  if (!match) return;
  const phoneEl = document.getElementById(phoneId);
  const emailEl = document.getElementById(emailId);
  if (phoneEl && !phoneEl.value) phoneEl.value = match.phone || '';
  if (emailEl && !emailEl.value) emailEl.value = match.email || '';
}

// Remove a custom income type globally — blocked if any client (borrower/guarantor) still uses it.
function removeCustomIncomeType(val) {
  // Check usage across all clients
  const usedBy = [];
  (state.clients || []).forEach(c => {
    let inUse = false;
    (c.borrowers || []).forEach(b => {
      const types = Array.isArray(b.employmentTypes) ? b.employmentTypes : (b.employmentType ? [b.employmentType] : []);
      if (types.includes(val)) inUse = true;
    });
    (c.guarantors || []).forEach(g => {
      const types = Array.isArray(g.employmentTypes) ? g.employmentTypes : (g.employmentType ? [g.employmentType] : []);
      if (types.includes(val)) inUse = true;
    });
    if (inUse) usedBy.push(c.name || '(ללא שם)');
  });
  if (usedBy.length) {
    alert('לא ניתן למחוק — הסוג "' + val + '" בשימוש אצל ' + usedBy.length + ' לקוחות:\n\n' + usedBy.slice(0,10).join('\n') + (usedBy.length > 10 ? '\n...ועוד ' + (usedBy.length - 10) : '') + '\n\nהסר אותו מכל התיקים לפני מחיקה מהרשימה.');
    return;
  }
  if (!confirm('למחוק את הסוג "' + val + '"?')) return;
  if (Array.isArray(state.settings.customIncomeTypes)) {
    state.settings.customIncomeTypes = state.settings.customIncomeTypes.filter(x => x !== val);
    save();
  }
  // Rebuild all open menus (full client form 1&2, guarantor rows, lead menus)
  ['1','2'].forEach(idx => {
    const wrap = document.getElementById('fEmpMenuItems' + idx);
    if (wrap) {
      // Rebuild by removing only the deleted item's <div>
      const boxes = wrap.querySelectorAll('input[class^="fEmpChk"]');
      boxes.forEach(cb => { if (cb.value === val) { const container = cb.closest('div'); if (container) container.remove(); } });
    }
  });
  document.querySelectorAll('.gEmpTypes').forEach(g => {

// Render one input row per selected income type. Supports multiple entries per type
// via comma-separation inside a single input. Values are mirrored into hidden #fEmployers<idx>
// (flat CSV, backwards compatibility) and #fEmployersData<idx> (JSON map {type: [names]}).
function renderEmployersByType(idx, values) {
  const container = document.getElementById('fEmployersByType' + idx);
  if (!container) return;
  values = values || Array.from(document.querySelectorAll('.fEmpChk' + idx + ':checked')).map(c => c.value);
  if (!values.length) { container.style.display = 'none'; container.innerHTML = ''; return; }
  container.style.display = '';
  // Preserve any user-entered values across re-renders
  const dataInput = document.getElementById('fEmployersData' + idx);
  let prev = {};
  try { prev = JSON.parse(dataInput.value || '{}') || {}; } catch(e) {}
  // Snapshot values currently in the inputs (in case they typed but didn't blur)
  container.querySelectorAll('.empTypeInput').forEach(inp => {
    const t = inp.dataset.type;
    if (t) prev[t] = (inp.value || '').split(',').map(x => x.trim()).filter(Boolean);
  });
  container.innerHTML = values.filter(t => t !== 'ללא הכנסות').map(t => {
    const lbl = _employerFieldLabel(t);
    if (!lbl) return '';
    const savedArr = Array.isArray(prev[t]) ? prev[t] : [];
    const val = savedArr.join(', ');
    return `
      <div class="form-group" style="margin-bottom:6px">
        <label style="font-size:12px">${escapeHtml(lbl)} — <span style="color:var(--accent);font-weight:700">${escapeHtml(t)}</span> <span style="color:var(--muted);font-weight:400;font-size:11px">(הפרד בפסיק ליותר מאחד)</span></label>
        <input type="text" class="empTypeInput" data-type="${escapeAttr(t)}" value="${escapeAttr(val)}" oninput="syncEmployersData('${idx}')" style="width:100%">
      </div>
    `;
  }).join('');
  syncEmployersData(idx);
}

// Read the per-type inputs and rebuild the flat #fEmployers<idx> CSV + the JSON map
function syncEmployersData(idx) {
  const container = document.getElementById('fEmployersByType' + idx);
  if (!container) return;
  const map = {};
  const flat = [];
  container.querySelectorAll('.empTypeInput').forEach(inp => {
    const t = inp.dataset.type;
    const arr = (inp.value || '').split(',').map(x => x.trim()).filter(Boolean);
    if (arr.length) map[t] = arr;
    arr.forEach(n => { if (!flat.includes(n)) flat.push(n); });
  });
  const flatEl = document.getElementById('fEmployers' + idx);
  if (flatEl) flatEl.value = flat.join(', ');
  const dataEl = document.getElementById('fEmployersData' + idx);
  if (dataEl) dataEl.value = JSON.stringify(map);
}

// Format number for display with thousands separator + optional ₪
function formatNum(n, withCurrency) {
  if (n === null || n === undefined || n === '' || isNaN(n)) return '';
  const s = Number(n).toLocaleString('he-IL', { maximumFractionDigits: 0 });
  return withCurrency ? s + ' ₪' : s;
}
function parseFormattedNum(str) {
  if (!str) return 0;
  const cleaned = String(str).replace(/[^\d.]/g, '');
  return Number(cleaned) || 0;
}
// Auto-format money inputs (type=text) with commas + ₪ suffix, preserving cursor
function onMoneyInput(el, cb) {
  const raw = el.value;
  const caret = el.selectionStart;
  const before = raw.slice(0, caret).replace(/[^\d]/g, '').length;
  const num = raw.replace(/[^\d]/g, '');
  const formatted = num ? Number(num).toLocaleString('he-IL') + ' ₪' : '';
  el.value = formatted;
  // Try to put cursor after the same digit count
  let newPos = 0, digits = 0;
  for (let i = 0; i < formatted.length && digits < before; i++) {
    if (/\d/.test(formatted[i])) digits++;
    newPos = i + 1;
  }
  try { el.setSelectionRange(newPos, newPos); } catch(e) {}
  if (typeof cb === 'function') cb();
}
