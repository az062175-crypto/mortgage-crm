// Drag-and-drop reorder handlers for requirements.
let _reqDragState = null;

function reqDragStart(ev, clientId, reqId) {
  _reqDragState = { clientId, reqId };
  ev.dataTransfer.effectAllowed = 'move';
  ev.dataTransfer.setData('text/plain', reqId);
  if (ev.currentTarget) ev.currentTarget.style.opacity = '0.4';
}

function reqDragOver(ev) {
  ev.preventDefault();
  ev.dataTransfer.dropEffect = 'move';
}

function reqDragEnd(ev) {
  if (ev.currentTarget) ev.currentTarget.style.opacity = '';
  _reqDragState = null;
}

function reqDrop(ev, clientId, targetReqId) {
  ev.preventDefault();
  ev.stopPropagation();
  if (!_reqDragState || _reqDragState.clientId !== clientId) return;
  const draggedId = _reqDragState.reqId;
  if (draggedId === targetReqId) return;
  const c = state.clients.find(x => x.id === clientId);
  if (!c) return;
  const dragged = c.requirements.find(r => r.id === draggedId);
  const target = c.requirements.find(r => r.id === targetReqId);
  if (!dragged || !target) return;
  // Only allow reorder within the same stage + section (grouped visually)
  if (dragged.stage !== target.stage || (dragged.section || '') !== (target.section || '')) {
    alert('אפשר לגרור רק בתוך אותו קטע (אותו שלב וסקציה)');
    return;
  }
  // Normalize orders across all reqs in the same stage+section, then move dragged before target
  const group = c.requirements.filter(r => r.stage === dragged.stage && (r.section || '') === (dragged.section || ''));
  const reqRank = r => r.status === 'pending' ? 0 : (r.status === 'provided' ? 1 : 2);
  group.sort((a, b) => {
    const oa = typeof a.order === 'number' ? a.order : 999999;
    const ob = typeof b.order === 'number' ? b.order : 999999;
    if (oa !== ob) return oa - ob;
    return reqRank(a) - reqRank(b);
  });
  const withoutDragged = group.filter(r => r.id !== draggedId);
  const targetIdx = withoutDragged.findIndex(r => r.id === targetReqId);
  withoutDragged.splice(targetIdx, 0, dragged);
  withoutDragged.forEach((r, i) => { r.order = i; });
  save();
  renderClientDetail();
}

function renderReqsHtml(c, filter) {
  filter = filter || 'all';
  let reqs = c.requirements.slice();
  if (filter === 'missing') reqs = reqs.filter(r => r.status === 'pending');
  else if (filter === 'provided') reqs = reqs.filter(r => r.status === 'provided');
  else if (filter === 'not-required') reqs = reqs.filter(r => r.status === 'not-required');
  if (reqs.length === 0) return '<div class="empty" style="padding:20px">אין דרישות התואמות</div>';
  const byStage = {};
  reqs.forEach(r => { (byStage[r.stage] = byStage[r.stage] || []).push(r); });
  // Sort by user's custom order first (if set), then by status: pending → provided → not-required
  const reqRank = r => r.status === 'pending' ? 0 : (r.status === 'provided' ? 1 : 2);
  const sortReqs = arr => arr.sort((a, b) => {
    const oa = typeof a.order === 'number' ? a.order : 999999;
    const ob = typeof b.order === 'number' ? b.order : 999999;
    if (oa !== ob) return oa - ob;
    return reqRank(a) - reqRank(b);
  });
  Object.keys(byStage).forEach(k => sortReqs(byStage[k]));
  const reqItemHtml = r => `
    <div class="req-item ${r.status}" draggable="true" data-req-id="${r.id}"
         ondragstart="reqDragStart(event,'${c.id}','${r.id}')"
         ondragover="reqDragOver(event)"
         ondrop="reqDrop(event,'${c.id}','${r.id}')"
         ondragend="reqDragEnd(event)">
      <span title="גרור לשינוי סדר" style="cursor:grab;color:var(--muted);padding:0 4px;user-select:none">⋮⋮</span>
      <span class="req-name" title="לחץ פעמיים לעריכה" ondblclick="startRenameReq('${c.id}','${r.id}',this)">${escapeHtml(r.name)}</span>
      <div class="req-status-group">
        <span class="status-btn ${r.status==='not-required'?'active':''}" data-status="not-required" onclick="setReqStatus('${c.id}','${r.id}','not-required')">לא נדרש</span>
        <span class="status-btn ${r.status==='pending'?'active':''}" data-status="pending" onclick="setReqStatus('${c.id}','${r.id}','pending')">ממתין</span>
        <span class="status-btn ${r.status==='provided'?'active':''}" data-status="provided" onclick="setReqStatus('${c.id}','${r.id}','provided')">התקבל</span>
      </div>
      <button class="icon-btn" onclick="startRenameReq('${c.id}','${r.id}')" title="ערוך שם" style="color:var(--accent)">✎</button>
      <button class="icon-btn" onclick="openContactEmailDialog('${c.id}','${escapeAttr(r.name)}')" title="שלח מייל בנוגע למסמך" style="color:var(--accent)">📧</button>
      <button class="icon-btn" onclick="deleteReq('${c.id}','${r.id}')">✕</button>
    </div>`;
  let html = '';
  STAGES.forEach(s => {
    if (!byStage[s.id]) return;
    // For client stage, subdivide by section: borrower / deal / other
    if (s.id === 'client') {
      const borrowerReqs = byStage[s.id].filter(r => r.section === 'borrower' || (!r.section)).sort((a,b) => reqRank(a) - reqRank(b));
      const guarantorReqs = byStage[s.id].filter(r => r.section === 'guarantor').sort((a,b) => reqRank(a) - reqRank(b));
      const dealReqs = byStage[s.id].filter(r => r.section === 'deal').sort((a,b) => reqRank(a) - reqRank(b));
      // Borrower section
      html += `<div class="section-title" style="border-right:3px solid ${s.color};padding-right:8px;margin-top:12px;display:flex;justify-content:space-between;align-items:center">
        <span>📋 פרטי הלווים</span>
        <button class="btn small" onclick="openAddReqModal('${c.id}','borrower')">+ הוסף</button>
      </div>`;
      if (borrowerReqs.length) html += '<div class="req-list">' + borrowerReqs.map(reqItemHtml).join('') + '</div>';
      else html += '<div class="empty" style="padding:10px;font-size:12px">אין דרישות</div>';
      // Guarantor section
      html += `<div class="section-title" style="border-right:3px solid ${s.color};padding-right:8px;margin-top:16px;display:flex;justify-content:space-between;align-items:center">
        <span>🤝 פרטי הערבים</span>
        <button class="btn small" onclick="openAddReqModal('${c.id}','guarantor')">+ הוסף</button>
      </div>`;
      if (guarantorReqs.length) html += '<div class="req-list">' + guarantorReqs.map(reqItemHtml).join('') + '</div>';
      else html += '<div class="empty" style="padding:10px;font-size:12px">אין ערבים / אין דרישות</div>';
      // Deal section
      html += `<div class="section-title" style="border-right:3px solid ${s.color};padding-right:8px;margin-top:16px;display:flex;justify-content:space-between;align-items:center">
        <span>📄 פרטי עסקה</span>
        <button class="btn small" onclick="openAddReqModal('${c.id}','deal')">+ הוסף</button>
      </div>`;
      if (dealReqs.length) {
        const byDeal = {};
        dealReqs.forEach(r => { (byDeal[r.dealType||'עסקה'] = byDeal[r.dealType||'עסקה']||[]).push(r); });
        Object.keys(byDeal).forEach(dt => {
          html += `<div style="font-size:12px;font-weight:700;color:var(--muted);margin:8px 0 4px">${escapeHtml(dt)}</div>`;
          html += '<div class="req-list">' + byDeal[dt].map(reqItemHtml).join('') + '</div>';
        });
      } else {
        html += '<div class="empty" style="padding:10px;font-size:12px">אין דרישות</div>';
      }
    } else {
      html += `<div class="section-title" style="border-right:3px solid ${s.color};padding-right:8px;margin-top:12px">${s.label}</div>`;
      html += '<div class="req-list">' + byStage[s.id].map(reqItemHtml).join('') + '</div>';
    }
  });
  return html;
}

function setTaskStatus(clientId, taskId, status) {
  const c = state.clients.find(x => x.id === clientId);
  const t = c.tasks.find(t => t.id === taskId);
  if (t.status === status) return;
  // Submission-stage: block "ניידים של הלווים" if borrowers don't have phones
  if (status === 'done' && t.stage === 'submission' && t.title === 'ניידים של הלווים') {
    const missingPhones = (c.borrowers || []).filter(b => !(b.phone && b.phone.trim())).length;
    if (missingPhones > 0 && !(c.phone && c.phone.trim())) {
      openEditModal(c.id, 'לא ניתן להתקדם שלב עד שיירשמו ניידים של הלווים');
      return;
    }
  }
  // Submission-stage: block "בדקת את הנסח..." if יד שנייה sub-questions aren't answered
  if (status === 'done' && t.stage === 'submission' && t.title === 'בדקת את הנסח האם יש הערות?') {
    const purposes = (c.purposes && c.purposes.length) ? c.purposes : (c.purpose ? [c.purpose] : []);
    if (purposes.includes('יד שנייה')) {
      const s = t.subChecks || {};
      if (!s.letterOfIntent || !s.twoSellers) {
        alert('בעסקת יד שנייה — יש לענות על שתי השאלות (מכתב כוונות / שני מוכרים) לפני סימון בוצע');
        return;
      }
    }
  }
  // Submission-stage: "הוגש ב:" — opens dialog to select bank
  if (status === 'done' && t.stage === 'submission' && t.title.indexOf('הוגש') === 0) {
    openSubmittedToDialog(clientId, taskId);
    return;
  }
  // Appraisal floating task: "כמה אושר שווי ע"פ השמאי" → open amount dialog
  if (status === 'done' && t.title === 'כמה אושר שווי ע"פ השמאי' && t.floating) {
    openAppraiserValueDialog(clientId, taskId);
    return;
  }
  // Trigger follow-up: when "שמאות מוכנה?" is marked done → auto-open the appraiser-value dialog
  if (status === 'done' && t.stage === 'appraisal' && t.title === 'שמאות מוכנה?') {
    t.status = 'done'; t.done = true; t.doneAt = now();
    t.history = t.history || []; t.history.push({ status: 'done', at: now() });
    const valTask = c.tasks.find(x => x.floating && x.source === 'appraisal-value-check' && x.status !== 'done');
    save();
    // Only auto-open the value dialog if it's still not done
    if (valTask) {
      if (currentTab === 'detail') renderClientDetail();
      if (currentTab === 'tasks') renderTasksTab();
      setTimeout(() => openAppraiserValueDialog(clientId, valTask.id), 100);
    } else {
      // Value already recorded — try to advance the stage
      const advanced = autoAdvanceIfStageComplete(c);
      save();
      if (advanced) renderKanban();
      if (currentTab === 'detail') renderClientDetail();
      if (currentTab === 'tasks') renderTasksTab();
    }
    return;
  }
  // Approval-stage: "התקבל אישור עקרוני" → open amount dialog (always, so new rounds after rejection also prompt)
  if (status === 'done' && t.stage === 'approval' && t.title.indexOf('התקבל אישור עקרוני') === 0) {
    openPrincipalApprovalDialog(clientId, taskId);
    return;
  }
  // Approval-stage: "האישור לא מקובל" → return client to submission, keep history, reset amount
  if (status === 'done' && t.stage === 'approval' && t.title === 'האישור לא מקובל') {
    if (!confirm('לחזור לשלב "הגשה"? האישור הקודם יישמר כהיסטוריה, הסכום שהוזן ימחק — תוכל לעדכן סכום חדש בסבב הבא.')) return;
    // Mark the "rejected" task done (history)
    t.status = 'done'; t.done = true; t.doneAt = now();
    t.history = t.history || []; t.history.push({ status: 'done', at: now() });
    // Count how many rejection rounds happened already
    const priorRounds = c.tasks.filter(x => x.stage === 'approval' && x.title.startsWith('התקבל אישור עקרוני') && (x.status === 'done' || x.done)).length;
    const round = priorRounds + 1;
    // Mark the current "התקבל אישור עקרוני" task as done-rejected (history)
    const oldApproved = c.tasks.find(x => x.stage === 'approval' && x.title.indexOf('התקבל אישור עקרוני') === 0 && (x.status === 'done' || x.done) && !x.rejectedRound);
    if (oldApproved) {
      oldApproved.title = 'התקבל אישור עקרוני (סבב ' + priorRounds + ' — נדחה)';
      oldApproved.rejectedRound = priorRounds;
    }
    // Also mark the current "האישור לא מקובל" task with round info
    t.title = 'האישור לא מקובל (סבב ' + priorRounds + ')';
    t.rejectedRound = priorRounds;
    // Add fresh tasks for the next round
    c.tasks.push({
      id: uid(), stage: 'approval', title: 'התקבל אישור עקרוני',
      status: 'active', done: false, doneAt: null, createdAt: now(),
      history: [{ status: 'active', at: now(), note: 'סבב ' + round + ' — לאחר דחיית אישור קודם' }]
    });
    c.tasks.push({
      id: uid(), stage: 'approval', title: 'האישור לא מקובל',
      status: 'active', done: false, doneAt: null, createdAt: now(),
      history: [{ status: 'active', at: now() }]
    });
    // Mark the last accepted approval as rejected, and drop the recorded amount so a new one can be entered
    if (Array.isArray(c.approvals) && c.approvals.length) {
      const last = c.approvals[c.approvals.length - 1];
      last.accepted = false;
      last.rejectedAt = now();
      last.rejectedAmount = last.amount;
      last.amount = 0;
      last.note = 'האישור לא מקובל — סבב ' + priorRounds;
    }
    moveStage(c, 'submission', { logBackward: true });
    save(); renderKanban();
    if (currentTab === 'detail') renderClientDetail();
    if (currentTab === 'tasks') renderTasksTab();
    return;
  }
  // Block "done" on הרכב הלוואה if loan composition table is empty
  if (status === 'done' && t.title === 'הרכב הלוואה') {
    const tracks = c.loanComposition && c.loanComposition.tracks ? c.loanComposition.tracks : {};
    const anyFilled = LOAN_TRACKS.some(tr => tracks[tr.id] && Number(tracks[tr.id].amount) > 0);
    if (!anyFilled) {
      alert('לא ניתן לסמן "בוצע" — יש למלא לפחות מסלול אחד בהרכב ההלוואה (🧮)');
      return;
    }
  }
  t.status = status;
  t.done = (status === 'done');
  t.doneAt = (status === 'done') ? now() : null;
  t.history = t.history || [];
  t.history.push({ status, at: now() });
  // When "נשלח לבחינה" is marked done — auto-move the "בחינה תקין?" sub-check to מעקב (unless already resolved)
  if (status === 'done' && t.source === 'bank-inspection' && t.title === 'נשלח לבחינה') {
    const bt = t.bchinaTakinStatus;
    if (bt !== 'done' && bt !== 'follow-up') {
      t.bchinaTakinStatus = 'follow-up';
    }
  }
  // For custom tasks moving to follow-up — prompt for note + due date (only once per transition)
  if (status === 'follow-up' && t.custom) {
    save();
    setTimeout(() => openFollowUpDetailsDialog(clientId, taskId), 100);
  }
  // Archive trigger — "העברה לארכיון" task on execution stage
  if (status === 'done' && t.isArchiveTrigger && c.stage === 'execution') {
    if (confirm('להעביר את התיק לארכיון?\n\nוודא שכל הביצועים הושלמו — הפעולה אמצעית אך אפשר להוציא מארכיון בהמשך.')) {
      moveStage(c, 'archive');
      save(); renderKanban();
      if (currentTab === 'detail') renderClientDetail();
      if (currentTab === 'tasks') renderTasksTab();
      return;
    } else {
      // Revert
      t.status = 'active'; t.done = false; t.doneAt = null;
      t.history = t.history || []; t.history.push({ status: 'active', at: now() });
      save();
      if (currentTab === 'detail') renderClientDetail();
      return;
    }
  }
  // Special handlers for lead-stage tasks
  let specialHandled = false;
  if (status === 'done' && t.stage === 'lead' && c.stage === 'lead') {
    if (t.title === 'סגרנו עסקה') {
      // Revert the "done" — stage will only move once the user actually fills the details
      t.status = 'active'; t.done = false; t.doneAt = null;
      if (Array.isArray(t.history)) t.history.push({ status: 'active', at: now() });
      pendingCloseLeadId = c.id;
      pendingCloseLeadTaskId = t.id;
      save();
      if (currentTab === 'tasks') renderTasksTab();
      if (currentTab === 'leads') renderLeadsTab();
      setTimeout(() => openNewClientModal(c), 100);
      return;
    }
    if (t.title === 'שיחת פולואפ' && !t.followUpOffered) {
      t.followUpOffered = true;
      save();
      setTimeout(() => openFollowUpDialog(clientId), 100);
      // continue to normal render below
    }
  }
  const advanced = autoAdvanceIfStageComplete(c);
  save();
  if (advanced) renderKanban();
  if (currentTab === 'detail') renderClientDetail();
  if (currentTab === 'tasks') renderTasksTab();
  // Always re-render leads tab if it's visible or if the client is a lead (covers stale currentTab state)
  const tabLeadsEl = document.getElementById('tabLeads');
  const leadsVisible = tabLeadsEl && tabLeadsEl.style.display !== 'none';
  if (currentTab === 'leads' || leadsVisible || c.stage === 'lead') renderLeadsTab();
}

function submitAppraiserValue(clientId, taskId) {
  const c = state.clients.find(x => x.id === clientId);
  const t = c.tasks.find(x => x.id === taskId);
  const amount = Number(document.getElementById('avAmount').value) || 0;
  if (amount <= 0) { alert('הזן סכום'); return; }
  const target = c.propertyValue || 0;
  const label = propertyValueLabel(c);
  // Warn if appraiser value is higher than contract price — the effective value for financing is capped at contract
  if (target > 0 && amount > target) {
    const diff = amount - target;
    const msg = `⚠️ שווי השמאי (${fmtMoney(amount)}) גבוה מ${label} (${fmtMoney(target)}) ב־${fmtMoney(diff)}.\n\n` +
      `לחישוב אחוז המימון — המערכת תשתמש במחיר החוזה (${fmtMoney(target)}) כתקרה, גם אם השמאי נתן יותר.\n\n` +
      `לשמור את הסכום?`;
    if (!confirm(msg)) return;
  }
  c.appraiserValue = amount;
  c.appraiserValueAt = now();
  t.status = 'done'; t.done = true; t.doneAt = now();
  t.history = t.history || []; t.history.push({ status: 'done', at: now() });
  save(); closeModal();
  // Try to auto-advance stage if all conditions met
  const advanced = autoAdvanceIfStageComplete(c);
  renderClientDetail();
  if (advanced) renderKanban();
  if (target > 0 && amount === target) {
    fireConfetti();
    return;
  }
  // Appraiser value differs from contract — show rich alert with suggested loan
  if (target > 0 && amount < target) {
    setTimeout(() => showAppraisalBelowContractAlert(c), 150);
    return;
  }
  // Above contract — just check regulator normally
  setTimeout(() => checkRegulatorAndWarn(c), 400);
}

function showAppraisalBelowContractAlert(c) {
  const contract = Number(c.propertyValue) || 0;
  const appraiser = Number(c.appraiserValue) || 0;
  const denom = ltvDenom(c);
  const currentLoan = Number(c.loanAmount) || 0;
  const existing = Number(c.existingMortgage) || 0;
  const pct = financingPct(c);
  const label = propertyValueLabel(c);
  const limit = c.apartmentType ? APARTMENT_LTV_LIMIT[c.apartmentType] : null;
  const aptLabel = c.apartmentType ? APARTMENT_LABEL[c.apartmentType] : null;
  const breachingReg = (limit !== null && pct !== null && pct > limit);
  // Suggested max loan: use regulator limit if set; else fall back to 75% (single-home default)
  const targetPct = limit || 75;
  const maxTotal = Math.floor((denom * targetPct / 100) / 1000) * 1000;
  // Suggested amount is the max NEW loan — total minus existing mortgage on the property
  const maxLoan = Math.max(0, maxTotal - existing);
  const diff = currentLoan - maxLoan;
  const title = breachingReg
    ? `⚠️ הערכת שמאי נמוכה — חריגה מהרגולציה (${aptLabel})`
    : `⚠️ הערכת שמאי נמוכה ממחיר החוזה`;
  const regRow = breachingReg
    ? `<br>מגבלת רגולטור (${aptLabel}): <strong>${limit}%</strong>`
    : (limit ? `<br>מגבלת רגולטור (${aptLabel}): <strong>${limit}%</strong> ✓ בטווח` : `<br><span style="color:var(--muted);font-size:12px">(סוג דירה לא סווג — הצעה לפי 75%)</span>`);
  // Always show the apply button when there's a positive suggested amount that differs from current
  const showApply = maxLoan > 0 && maxLoan !== currentLoan;
  const existingBlock = existing > 0
    ? `<div style="margin:8px auto;padding:8px 12px;background:#fef3c7;border:1px solid #fbbf24;border-radius:8px;font-size:13px;color:#78350f;max-width:400px;text-align:right">
         <div>משכנתא קיימת על הנכס: <strong>${fmtMoney(existing)}</strong></div>
         <div>+ הלוואה מבוקשת חדשה: <strong>${fmtMoney(currentLoan)}</strong></div>
         <div style="border-top:1px dashed #fbbf24;margin-top:4px;padding-top:4px">= סה"כ מימון: <strong>${fmtMoney(existing + currentLoan)}</strong> (${pct}%)</div>
       </div>` : '';
  const msg = `
    <div style="display:flex;justify-content:center;gap:24px;flex-wrap:wrap;margin-bottom:10px">
      <div><span style="color:var(--muted);font-size:12px">${label}:</span> <strong>${fmtMoney(contract)}</strong></div>
      <div><span style="color:var(--muted);font-size:12px">שווי לפי שמאי:</span> <strong style="color:var(--accent)">${fmtMoney(appraiser)}</strong></div>
    </div>
    <div>אחוז המימון הנוכחי${existing > 0 ? ' (כולל משכנתא קיימת)' : ''}: <strong style="color:${breachingReg?'#dc2626':'#0f172a'}">${pct}%</strong>${regRow}</div>
    ${existingBlock}
    ${showApply ? `
    <div style="margin:16px auto;padding:12px 16px;background:#f0fdf4;border:2px solid #22c55e;border-radius:10px;max-width:400px">
      <div style="color:#166534;font-weight:700;font-size:13px;margin-bottom:6px">💡 סכום מקסימלי להגשה עכשיו${limit?' לפי רגולטור':' לפי שווי החדש'}:</div>
      <div style="color:#166534;font-weight:800;font-size:22px">${fmtMoney(maxLoan)}</div>
      <div style="color:#166534;font-size:12px;margin-top:6px">${fmtMoney(denom)} × ${targetPct}% = ${fmtMoney(maxTotal)}${existing > 0 ? ' פחות משכנתא קיימת (' + fmtMoney(existing) + ')' : ''}</div>
      ${diff > 0 ? `<div style="color:#7f1d1d;font-size:12px;margin-top:6px">להורדה: <strong>${fmtMoney(diff)}</strong> מהסכום הנוכחי (${fmtMoney(currentLoan)})</div>` : ''}
    </div>` : ''}
    <div style="font-size:12px;color:var(--muted);margin-top:4px">בסיס חישוב: המינימום בין ${label} לשווי שמאי</div>`;
  showCenterAlert(title, msg, showApply ? { clientId: c.id, focusField: 'fLoanAmt', suggestedAmount: maxLoan } : { clientId: c.id, focusField: 'fLoanAmt' });
}

function fireConfetti() {
  const colors = ['#f43f5e','#ec4899','#8b5cf6','#3b82f6','#10b981','#f59e0b','#ef4444','#eab308','#06b6d4'];
  const container = document.createElement('div');
  container.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden';
  const N = 140;
  for (let i = 0; i < N; i++) {
    const c = document.createElement('div');
    const color = colors[Math.floor(Math.random()*colors.length)];
    const size = 6 + Math.random()*10;
    const angle = (i / N) * 360 + Math.random()*15;
    const dist = 200 + Math.random()*450;
    const dx = Math.cos(angle * Math.PI/180) * dist;
    const dy = Math.sin(angle * Math.PI/180) * dist;
    const dur = 900 + Math.random()*900;
    const rot = (Math.random()*4 - 2) * 720;
    c.style.cssText = `position:absolute;top:50%;left:50%;width:${size}px;height:${size}px;background:${color};border-radius:${Math.random()>0.5?'50%':'2px'};transform:translate(-50%,-50%);--dx:${dx}px;--dy:${dy}px;--rot:${rot}deg;animation:confettiBurst ${dur}ms cubic-bezier(.2,.7,.4,1) forwards`;
    container.appendChild(c);
  }
  document.body.appendChild(container);
  setTimeout(() => container.remove(), 2500);
}

// Inject confetti keyframes once
if (!document.getElementById('confettiStyle')) {
  const s = document.createElement('style');
  s.id = 'confettiStyle';
  s.textContent = '@keyframes confettiBurst { 0% { transform:translate(-50%,-50%) rotate(0deg) scale(1); opacity:1 } 100% { transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(var(--rot)) scale(0.6); opacity:0 } }';
  document.head.appendChild(s);
}

function submitPrincipalApproval(clientId, taskId) {
  const c = state.clients.find(x => x.id === clientId);
  const t = c.tasks.find(x => x.id === taskId);
  const amount = Number(document.getElementById('paAmount').value) || 0;
  if (amount <= 0) { alert('הזן סכום'); return; }
  closeModal();
  const target = c.loanAmount || 0;
  const matches = target > 0 && amount === target;
  const diff = target - amount;
  // Compute regulator breach preview (without saving yet) — combined with existing mortgage
  const limit = c.apartmentType ? APARTMENT_LTV_LIMIT[c.apartmentType] : null;
  const aptLabel = c.apartmentType ? APARTMENT_LABEL[c.apartmentType] : null;
  const contract = Number(c.propertyValue) || 0;
  const appraiser = Number(c.appraiserValue) || 0;
  const denom = ltvDenom(c);
  const existing = Number(c.existingMortgage) || 0;
  const approvedPct = denom > 0 ? Math.round(((amount + existing) / denom) * 1000) / 10 : null;
  const regBreached = (limit && approvedPct !== null && approvedPct > limit);
  const maxTotal = (limit && denom > 0) ? Math.floor((denom * limit / 100) / 1000) * 1000 : null;
  const maxAllowed = maxTotal !== null ? Math.max(0, maxTotal - existing) : null;
  // If no issues at all → proceed immediately
  if (matches && !regBreached) {
    saveApprovalAndContinue(clientId, taskId, amount, true);
    return;
  }
  // Show a rich combined modal
  window._paCtx = { clientId, taskId, amount, correctedAmount: maxAllowed };
  const denomLabel = (appraiser > 0 && contract > 0)
    ? 'המינימום בין מחיר חוזה ('+fmtMoney(contract)+') לשווי לפי שמאי ('+fmtMoney(appraiser)+')'
    : (appraiser > 0 ? 'שווי לפי שמאי' : propertyValueLabel(c));
  const mismatchBlock = matches ? '' : `
    <div style="margin:8px auto;padding:10px 14px;background:#fef3c7;border:1px solid #f59e0b;border-radius:10px;max-width:420px;text-align:right">
      <div style="font-weight:700;color:#78350f;margin-bottom:4px">📊 השוואה מול הבקשה</div>
      <div style="font-size:13px">סכום מבוקש: <strong>${fmtMoney(target)}</strong></div>
      <div style="font-size:13px">סכום שאושר: <strong>${fmtMoney(amount)}</strong></div>
      <div style="font-size:13px">${diff > 0 ? `הפרש: <strong style="color:#dc2626">חסר ${fmtMoney(diff)}</strong>` : `חריגה: <strong style="color:#dc2626">${fmtMoney(-diff)} מעל המבוקש</strong>`}</div>
    </div>`;
  const regBlock = regBreached ? `
    <div style="margin:8px auto;padding:12px 16px;background:#fee2e2;border:2px solid #ef4444;border-radius:10px;max-width:420px;text-align:right">
      <div style="font-weight:700;color:#7f1d1d;margin-bottom:4px">⚠️ חריגה מהרגולציה — ${aptLabel}</div>
      <div style="font-size:13px">אחוז מימון${existing > 0 ? ' (כולל משכנתא קיימת)' : ''}: <strong style="color:#dc2626">${approvedPct}%</strong></div>
      <div style="font-size:13px">מגבלת רגולטור: <strong>${limit}%</strong></div>
      ${existing > 0 ? `<div style="margin-top:6px;padding:6px 8px;background:#fef3c7;border:1px solid #fbbf24;border-radius:6px;font-size:12px;color:#78350f">
        משכנתא קיימת: <strong>${fmtMoney(existing)}</strong> + סכום שאושר: <strong>${fmtMoney(amount)}</strong> = <strong>${fmtMoney(existing + amount)}</strong>
      </div>` : ''}
      <div style="margin-top:8px;padding:8px;background:#f0fdf4;border:1px solid #22c55e;border-radius:8px">
        <div style="color:#166534;font-weight:700;font-size:12px">💡 סכום מקסימלי לאישור${existing > 0 ? ' בקיזוז שיעבוד קיים' : ''}:</div>
        <div style="color:#166534;font-weight:800;font-size:18px">${fmtMoney(maxAllowed)}</div>
        ${existing > 0 ? `<div style="color:#166534;font-size:11px;margin-top:4px">${fmtMoney(maxTotal)} פחות ${fmtMoney(existing)}</div>` : ''}
      </div>
      <div style="font-size:11px;color:var(--muted);margin-top:6px">בסיס חישוב: ${denomLabel}</div>
    </div>` : '';
  const title = regBreached
    ? `⚠️ סכום שאושר חורג מהרגולציה — ${aptLabel}`
    : (diff > 0 ? '⚠️ סכום שאושר נמוך מהמבוקש' : '⚠️ סכום שאושר גבוה מהמבוקש');
  const correctBtn = regBreached
    ? `<button class="btn" style="padding:12px 22px;font-size:15px;background:#16a34a" onclick="paApplyCorrected()">✓ תקן ל־${fmtMoney(maxAllowed)}</button>`
    : '';
  showModal(`
    <h2 class="modal-title" style="color:var(--danger);text-align:center;font-size:20px">${title}</h2>
    <div style="margin:12px 0">${mismatchBlock}${regBlock}</div>
    <div class="modal-actions" style="justify-content:center;gap:10px;flex-wrap:wrap">
      ${correctBtn}
      <button class="btn secondary" style="padding:12px 22px;font-size:15px" onclick="paKeepAndContinue()">${regBreached?'השאר '+fmtMoney(amount)+' והמשך':'רשום ועבור לשלב הבא'}</button>
      <button class="btn secondary" style="padding:12px 22px;font-size:15px" onclick="paEditAmount()">חזור לעריכת הסכום</button>
    </div>
  `);
}

function saveApprovalAndContinue(clientId, taskId, amount, matches) {
  const c = state.clients.find(x => x.id === clientId);
  const t = c.tasks.find(x => x.id === taskId);
  if (!c || !t) return;
  if (!c.approvals) c.approvals = [];
  c.approvals.forEach(a => a.accepted = false);
  c.approvals.push({ id: uid(), bankName: '', amount, approvedAt: now(), accepted: true, note: matches?'תואם למבוקש':'לא תואם למבוקש' });
  if (matches) fireConfetti();
  t.status = 'done'; t.done = true; t.doneAt = now();
  t.history = t.history || []; t.history.push({ status: 'done', at: now() });
  save();
  openBankerUpdateThenAdvance(clientId);
}

function paKeepAndContinue() {
  const opt = window._paCtx || {};
  closeModal();
  const c = state.clients.find(x => x.id === opt.clientId);
  const target = c ? (c.loanAmount || 0) : 0;
  const matches = target > 0 && opt.amount === target;
  saveApprovalAndContinue(opt.clientId, opt.taskId, opt.amount, matches);
}

  const matches = target > 0 && opt.correctedAmount === target;

}

function paEditAmount() {

}

function checkApprovedAmountRegulator(c, approvedAmount) {
  if (!c.apartmentType) return false;
  const limit = APARTMENT_LTV_LIMIT[c.apartmentType];
  if (!limit) return false;
  const contract = Number(c.propertyValue) || 0;
  const appraiser = Number(c.appraiserValue) || 0;
  const denom = ltvDenom(c);
  if (denom <= 0) return false;
  const existing = Number(c.existingMortgage) || 0;
  const combined = approvedAmount + existing;
  const pct = Math.round((combined / denom) * 1000) / 10;
  if (pct <= limit) return false;
  const aptLabel = APARTMENT_LABEL[c.apartmentType];
  const maxTotal = Math.floor((denom * limit / 100) / 1000) * 1000;
  // Corrected approved amount = max total allowed minus existing mortgage
  const maxAllowed = Math.max(0, maxTotal - existing);
  const diff = approvedAmount - maxAllowed;
  const denomLabel = (appraiser > 0 && contract > 0)
    ? 'המינימום בין מחיר חוזה ('+fmtMoney(contract)+') לשווי לפי שמאי ('+fmtMoney(appraiser)+')'
    : (appraiser > 0 ? 'שווי לפי שמאי' : propertyValueLabel(c));
  const existingBlock = existing > 0
    ? `<div style="margin:8px auto;padding:8px 12px;background:#fef3c7;border:1px solid #fbbf24;border-radius:8px;font-size:13px;color:#78350f;max-width:400px;text-align:right">
         <div>משכנתא קיימת על הנכס: <strong>${fmtMoney(existing)}</strong></div>
         <div>+ סכום שאושר: <strong>${fmtMoney(approvedAmount)}</strong></div>
         <div style="border-top:1px dashed #fbbf24;margin-top:4px;padding-top:4px">= סה"כ מימון: <strong>${fmtMoney(combined)}</strong> (${pct}%)</div>
       </div>` : '';
  window._approvedRegCtx = { clientId: c.id, correctedAmount: maxAllowed };
  showModal(`
    <h2 class="modal-title" style="color:var(--danger);text-align:center;font-size:22px">⚠️ סכום שאושר חורג מהרגולציה — ${aptLabel}</h2>
    <div style="text-align:center;font-size:15px;margin:20px 0;line-height:1.7">
      <div>סכום שאושר: <strong>${fmtMoney(approvedAmount)}</strong></div>
      <div>אחוז מימון${existing > 0 ? ' (כולל משכנתא קיימת)' : ''}: <strong style="color:#dc2626">${pct}%</strong></div>
      <div>מגבלת רגולטור: <strong>${limit}%</strong></div>
      ${existingBlock}
      <div style="margin:16px auto;padding:12px 16px;background:#f0fdf4;border:2px solid #22c55e;border-radius:10px;max-width:400px">
        <div style="color:#166534;font-weight:700;font-size:13px;margin-bottom:6px">💡 סכום מקסימלי לאישור${existing > 0 ? ' בקיזוז שיעבוד קיים' : ''}:</div>
        <div style="color:#166534;font-weight:800;font-size:22px">${fmtMoney(maxAllowed)}</div>
        <div style="color:#166534;font-size:12px;margin-top:6px">${fmtMoney(denom)} × ${limit}% = ${fmtMoney(maxTotal)}${existing > 0 ? ' פחות משכנתא קיימת (' + fmtMoney(existing) + ')' : ''}</div>
        <div style="color:#7f1d1d;font-size:12px;margin-top:6px">חריגה: <strong>${fmtMoney(diff)}</strong></div>
      </div>
      <div style="font-size:12px;color:var(--muted);margin-top:4px">בסיס חישוב: ${denomLabel}</div>
    </div>
    <div class="modal-actions" style="justify-content:center;gap:10px;flex-wrap:wrap">
      <button class="btn" style="padding:12px 24px;font-size:15px;background:#16a34a" onclick="approvedRegApplyCorrected()">✓ תקן ל־${fmtMoney(maxAllowed)}</button>
      <button class="btn secondary" style="padding:12px 24px;font-size:15px" onclick="approvedRegKeep()">השאר סכום ${fmtMoney(approvedAmount)}</button>
      <button class="btn secondary" style="padding:12px 24px;font-size:15px" onclick="approvedRegEditManually()">חזור לעריכת הסכום</button>
    </div>
  `);
  return true;
}

function approvedRegApplyCorrected() {
  const opt = window._approvedRegCtx || {};
  const c = state.clients.find(x => x.id === opt.clientId);
  if (!c) { closeModal(); return; }
  if (c.approvals && c.approvals.length) {
    const last = c.approvals[c.approvals.length - 1];

    last.note = 'תוקן לסכום מקסימלי לפי רגולטור';
  }
  save();
  closeModal();
  openBankerUpdateThenAdvance(opt.clientId);
}

function approvedRegKeep() {
  const opt = window._approvedRegCtx || {};
  closeModal();
  openBankerUpdateThenAdvance(opt.clientId);
}

function approvedRegEditManually() {
  const opt = window._approvedRegCtx || {};
  const c = state.clients.find(x => x.id === opt.clientId);
  if (!c) { closeModal(); return; }
  // Roll back the just-created approval so the user can re-enter
  if (c.approvals && c.approvals.length) c.approvals.pop();
  // Reset the "התקבל אישור עקרוני" task to active
  const t = c.tasks.slice().reverse().find(x => x.stage === 'approval' && x.title === 'התקבל אישור עקרוני' && (x.status === 'done' || x.done));
  if (t) {
    t.status = 'active'; t.done = false; t.doneAt = null;
    t.history = t.history || []; t.history.push({ status: 'active', at: now(), note: 'איפוס לתיקון סכום' });
  }
  save();
  closeModal();
  if (currentTab === 'detail') renderClientDetail();
  if (currentTab === 'tasks') renderTasksTab();
}

function renderSignatureMessage(scope) {
  const ctx = window._sigMsgCtx || {};
  const c = state.clients.find(x => x.id === ctx.clientId);
  if (!c) return;
  const greeting = greetingByHour();
  const firstBorrower = (c.borrowers || [])[0] || {};
  const clientName = firstBorrower.name || c.name || '';
  const idNumber = firstBorrower.idNumber || c.idNumber || '';
  const banker = c.bankerId ? state.settings.bankers.find(b => b.id === c.bankerId) : null;
  const bankerName = banker ? banker.name : '';
  const meetingLine = ctx.dateStr && ctx.timeStr && ctx.dateStr !== '____' ? `יום ${ctx.dow}, ${ctx.dateStr} בשעה ${ctx.timeStr}` : `____ (יש למלא)`;
  // For BANKER — coordination request template (editable in Settings → תבנית תיאום חתימות)
  if (ctx.recipient === 'banker') {
    const defaultTpl = `{greeting}\n\nשלום רב\n\nהלקוחות הנ"ל רוצים לחתום בתאריך {meeting}\n\nאודה אם תוכל לאשר שזה אפשרי\n\nבמידה ואי אפשר אודה אם תוכל לרשום לי תאריך הכי קרוב לזמן המבוקש\n\nבתודה מראש\n\nיצחק`;
    const tpl = (state.settings && state.settings.signatureCoordinationTemplate) || defaultTpl;
    const body = tpl
      .replace(/\{greeting\}/g, greeting)
      .replace(/\{meeting\}/g, meetingLine)
      .replace(/\{name\}/g, clientName)
      .replace(/\{idNumber\}/g, idNumber)
      .replace(/\{bankerName\}/g, bankerName);
    document.getElementById('sigMsgBody').value = body;
    return;
  }
  // For CLIENT — original document list message
  const sigTasks = (c.tasks || []).filter(t => t.stage === 'signature' && t.title !== 'תיאום חתימות');
  let filtered = sigTasks;
  if (scope === 'missing') filtered = sigTasks.filter(t => (t.status || 'active') !== 'done');
  else if (scope === 'done') filtered = sigTasks.filter(t => (t.status || 'active') === 'done');
  const list = filtered.map(t => {
    const isDone = (t.status || 'active') === 'done';
    if (scope === 'all') return (isDone ? '☑' : '☐') + ' ' + t.title;
    return '• ' + t.title;
  }).join('\n') || '(אין)';
  const bankInfoClient = banker
    ? `\nמקום: בנק ${banker.bank||''}${banker.branch?' · סניף '+banker.branch:''}\nבנקאי מטפל: ${banker.name||''}${banker.branchAddress?'\nכתובת: '+banker.branchAddress:''}`
    : '';
  const header = `שלום ${clientName},\n\n${greeting}. אנחנו מזמנים אותך לפגישת חתימת המשכנתא.\nמועד: ${meetingLine}${bankInfoClient}\n`;
  const scopeTitle = scope === 'missing'
    ? 'להלן המסמכים שטרם התקבלו:'
    : scope === 'done'
      ? 'להלן המסמכים שהתקבלו:'
      : 'להלן המסמכים הנדרשים לפני החתימה:';
  const idReminder = '\n⚠️ נא להצטייד בת"ז + ספח מקוריים.\n';
  const closing = scope === 'missing'
    ? '\nאבקש להשלים בהקדם.' + idReminder + '\nתודה.\nיצחק'
    : scope === 'done'
      ? idReminder + '\nתודה.\nיצחק'
      : idReminder + '\nתודה.\nיצחק';
  document.getElementById('sigMsgBody').value = header + '\n' + scopeTitle + '\n' + list + closing;
}

async function sendSignatureMessage(clientId, recipient, channel) {
  const c = state.clients.find(x => x.id === clientId);
  const body = document.getElementById('sigMsgBody').value;
  const coordTask = c.tasks.find(t => t.stage === 'signature' && t.title === 'תיאום חתימות');
  const coord = coordTask?.coordination || {};
  // Subject: for banker → "שם לקוח · ת.ז X"; for client → coordination-style
  const firstBorrower = (c.borrowers || [])[0] || {};
  const clientName = firstBorrower.name || c.name || '';
  const idNumber = firstBorrower.idNumber || c.idNumber || '';
  const subject = recipient === 'banker'
    ? clientName + (idNumber ? ' · ת.ז ' + idNumber : '')
    : ('תיאום חתימות — ' + (c.name || '') + (coord.date ? ' · ' + new Date(coord.date+'T00:00:00').toLocaleDateString('he-IL') : ''));
  const markBankerFollowUp = () => {
    if (recipient !== 'banker') return;
    if (coordTask && (coordTask.status || 'active') !== 'done') {
      coordTask.status = 'follow-up';
      coordTask.history = coordTask.history || [];
      coordTask.history.push({ status: 'follow-up', at: now(), note: 'נשלח לבנקאי' });
      save();
      if (currentTab === 'detail') renderClientDetail();
    }
  };
  if (channel === 'whatsapp') {
    let phone = '';
    if (recipient === 'client') phone = (c.phone||'').replace(/\D/g,'');
    else {
      const banker = c.bankerId ? state.settings.bankers.find(b => b.id === c.bankerId) : null;
      phone = banker ? (banker.phone||'').replace(/\D/g,'') : '';
    }
    if (phone.startsWith('0')) phone = '972' + phone.slice(1);
    if (!phone) { alert('אין טלפון לנמען'); return; }
    window.open('https://wa.me/' + phone + '?text=' + encodeURIComponent(body), '_blank');
    markBankerFollowUp();
    closeModal();
    return;
  }
  // Email — via Gmail API
  let toEmail = '';
  if (recipient === 'client') {
    const firstBorrower = (c.borrowers || [])[0] || {};
    toEmail = firstBorrower.email || c.email || '';
  } else {
    const banker = c.bankerId ? state.settings.bankers.find(b => b.id === c.bankerId) : null;
    toEmail = banker ? (banker.email||'') : '';
  }
  const html = buildStyledEmailHtml(body, recipient === 'client' ? 'seller' : 'banker');
  try {
    const draftResp = await gmailCreateDraft({ to: toEmail, subject, htmlBody: html });
    markBankerFollowUp();
    closeModal();
    const msgId = draftResp && draftResp.message && draftResp.message.id;
    window.open(msgId ? 'https://mail.google.com/mail/u/0/#drafts/' + msgId : 'https://mail.google.com/mail/u/0/#drafts', '_blank');
  } catch (err) {
    let url = 'https://mail.google.com/mail/?authuser=a035591712@gmail.com&view=cm&fs=1&su=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
    if (toEmail) url += '&to=' + encodeURIComponent(toEmail);
    window.open(url, '_blank');
    markBankerFollowUp();
    closeModal();
  }
}

function setTaskSubCheck(clientId, taskId, key, value) {
  const c = state.clients.find(x => x.id === clientId);
  const t = c.tasks.find(x => x.id === taskId);
  if (!t) return;
  if (!t.subChecks) t.subChecks = {};
  t.subChecks[key] = value;
  // Auto-mark "בוצע" once both sub-questions are answered (for the "בדקת את הנסח" task in יד שנייה)
  if (t.stage === 'submission' && t.title === 'בדקת את הנסח האם יש הערות?') {
    const s = t.subChecks;
    if (s.letterOfIntent && s.twoSellers && (t.status || 'active') !== 'done') {
      t.status = 'done';
      t.done = true;
      t.doneAt = now();
      t.history = t.history || [];
      t.history.push({ status: 'done', at: now(), note: 'סומן אוטומטית לאחר מענה על שתי השאלות' });
    }
    // Sync conditional bank task: הסכמת בן/בת הזוג למכירה
    const consentTitle = 'הסכמת בן/בת הזוג של המוכר למכירה';
    const existingConsent = c.tasks.find(x => x.stage === 'bank' && x.title === consentTitle);
    if (key === 'twoSellers') {
      if (value === 'no') {
        if (!existingConsent) {
          c.tasks.push({
            id: uid(), stage: 'bank', title: consentTitle,
            status: 'active', done: false, doneAt: null,
            createdAt: now(), history: [{ status: 'active', at: now() }],
            source: 'bank-seed-conditional'
          });
        }
      } else if (value === 'yes' && existingConsent && existingConsent.source === 'bank-seed-conditional' && (existingConsent.status || 'active') !== 'done') {
        c.tasks = c.tasks.filter(x => x.id !== existingConsent.id);
      }
    }
  }
  save(); renderClientDetail();
}

function submitCustomTask(clientId, taskId) {

  const c = state.clients.find(x => x.id === clientId);

  if (currentTab === 'clients') renderClientsList();

function daysUntil(isoDate) {
  if (!isoDate) return null;
  const d = new Date(isoDate + 'T00:00:00');
  const today = new Date(); today.setHours(0,0,0,0);
  return Math.round((d - today) / (24*3600*1000));
}

function getUpcomingTaskAlerts(windowDays) {
  windowDays = windowDays ?? 5;
  const out = [];
  const seen = new Set();
  state.clients.forEach(c => {
    (c.tasks||[]).forEach(t => {
      const st = t.status || (t.done?'done':'active');
      if (st === 'done') return;
      // Use dueDate if set, otherwise fall back to reminderAt (date-only)
      let dateStr = t.dueDate;
      if (!dateStr && t.reminderAt) {
        const rd = new Date(t.reminderAt);
        if (!isNaN(rd)) dateStr = rd.getFullYear() + '-' + String(rd.getMonth()+1).padStart(2,'0') + '-' + String(rd.getDate()).padStart(2,'0');
      }
      if (!dateStr) return;
      const d = daysUntil(dateStr);
      if (d === null) return;
      const trigger = (t.notifyDaysBefore ?? 1);
      // Include: (a) tasks due within the upcoming window, (b) any overdue task (no lower bound)
      if (d <= windowDays) {
        const key = c.id + '::' + t.id;
        if (seen.has(key)) return; seen.add(key);
        out.push({ client: c, task: t, daysLeft: d, overdue: d < 0, dueSoon: d <= trigger });
      }
    });
  });
  out.sort((a,b) => a.daysLeft - b.daysLeft);
  return out;
}

function checkStaleMissingDocsPopup() {
  try {
    if (typeof getStaleMissingDocsAlerts !== 'function') return;

// All open missing-docs requests — every request stays here until user marks the docs as received
// (either by marking each doc, or by marking the request received). isStale flag = 24h+ since last send.
function getStaleMissingDocsAlerts() {
  const out = [];
  const nowMs = Date.now();
  state.clients.forEach(c => {
    if (!c.missingDocsRequestSentAt) return;
    const stillPending = (c.requirements || []).some(r => r.status === 'pending');
    if (!stillPending) return;
    const lastAt = c.missingDocsFollowUpAt || c.missingDocsRequestSentAt;
    const hours = (nowMs - new Date(lastAt).getTime()) / 3600000;
    out.push({ client: c, hours: Math.round(hours), isStale: hours >= 24, channel: c.missingDocsRequestChannel || 'email' });
  });
  // Sort stale first, then by oldest
  out.sort((a, b) => (b.isStale - a.isStale) || (b.hours - a.hours));
  return out;
}

function getStaleBankCollateralAlerts() {
  const out = [];
  const nowMs = Date.now();
  state.clients.forEach(c => {
    if (!c.bankCollateralSentAt) return;
    // Only nag while the client is still in bank stage — once we've moved on, the request became irrelevant
    if (c.stage !== 'bank') return;
    const lastAt = c.bankCollateralFollowUpAt || c.bankCollateralSentAt;
    const hours = (nowMs - new Date(lastAt).getTime()) / 3600000;
    if (hours >= 24) out.push({ client: c, hours: Math.round(hours) });
  });
  return out;
}

// Files stuck at banker (submission or approval) for 5+ days without an accepted approval yet.
// Auto-generates a nudge — "פנה לבנקאי X — לקוח Y ממתין N ימים לתגובה".
function getStaleAtBankerAlerts() {
  const out = [];
  const nowMs = Date.now();
  state.clients.forEach(c => {
    if (c.stage !== 'submission' && c.stage !== 'approval') return;
    // If user manually dismissed with a fresh follow-up, respect it
    const lastAt = c.bankerFollowUpAt || c.stageEnteredAt;
    if (!lastAt) return;
    const days = (nowMs - new Date(lastAt).getTime()) / (1000*60*60*24);
    if (days < 5) return;
    // Skip if there's already an accepted approval on record (approval came through)
    const hasApproved = (c.approvals||[]).some(a => a.accepted && Number(a.amount) > 0 && !a.rejectedAt);
    if (hasApproved && c.stage !== 'approval') return;
    if (c.stage === 'approval' && hasApproved) return; // approved — no need to nag
    const banker = c.bankerId ? state.settings.bankers.find(b => b.id === c.bankerId) : null;
    out.push({ client: c, banker, days: Math.round(days), stageLabel: (stageInfo(c.stage)||{}).label || c.stage });
  });
  out.sort((a,b) => b.days - a.days);
  return out;
}

// Definitions of key client fields — used by the "מה חסר?" quick-fill popup.
// Each entry describes how to read/write the field and how to render its input.
// The "path" is a dotted path into the client object (arrays via indices, e.g. "borrowers.0.name").
function _getPath(obj, path) {
  return path.split('.').reduce((o, k) => (o == null ? o : o[k]), obj);
}
function _setPath(obj, path, value) {
  const keys = path.split('.');
  let o = obj;
  for (let i = 0; i < keys.length - 1; i++) {
    const k = keys[i];
    if (o[k] == null) o[k] = /^\d+$/.test(keys[i+1]) ? [] : {};
    o = o[k];
  }
  o[keys[keys.length - 1]] = value;
}

function _isFieldEmpty(v, type) {
  if (v === null || v === undefined) return true;
  if (type === 'money') return !(Number(v) > 0);
  if (type === 'list') return !(Array.isArray(v) ? v.filter(x => (x||'').trim()).length : (typeof v === 'string' && v.trim()));
  if (typeof v === 'string') return v.trim() === '';
  return false;
}

function getMissingClientFields(c) {
  const spec = getMissingClientFieldsSpec(c);
  return spec.filter(f => _isFieldEmpty(_getPath(c, f.path), f.type));
}

function setMissingField(clientId, path, rawValue, type) {
  const c = state.clients.find(x => x.id === clientId);

  if (type === 'list') value = String(rawValue||'').split(',').map(s => s.trim()).filter(Boolean);
  _setPath(c, path, value);

// Counts every open item on the client: pending tasks (active/follow-up), pending sub-checks, pending requirements.
// "האישור לא מקובל" is a passive/escape task that lives on approval stage — don't count as open work.
function _isPassiveTask(t) {
  return t.stage === 'approval' && t.title === 'האישור לא מקובל';
}

function getOpenItemsCount(c) {
  const tasks = (c.tasks || []).filter(t => {
    if (_isPassiveTask(t)) return false;
    const st = t.status || 'active';
    if (st !== 'done') return true;
    if (typeof hasOpenSubCheck === 'function' && hasOpenSubCheck(t)) return true;
    return false;
  });
  const reqs = (c.requirements || []).filter(r => r.status === 'pending');
  return tasks.length + reqs.length;
}

// Close the "מה פתוח?" popup and jump to the task.
// Since client detail only shows the current-stage tasks, we route to the Tasks tab
// filtered by this client — where every task is visible regardless of stage — and scroll to it.
function jumpToTask(clientId, taskId) {
  const overlay = document.getElementById('openItemsPopupOverlay');
  if (overlay) overlay.remove();
  const c = state.clients.find(x => x.id === clientId);
  if (!c) return;
  const t = c.tasks.find(x => x.id === taskId);
  if (!t) return;
  // If the task belongs to the current stage of the client — client detail can show it
  const inCurrentStage = t.stage === c.stage || t.floating;
  const findAndHighlight = () => {
    const el = document.querySelector('[data-task-id="' + taskId + '"]');
    if (!el) return false;
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    const prevBg = el.style.background;
    const prevBorder = el.style.borderColor;
    el.style.background = '#fef3c7';
    el.style.borderColor = '#f59e0b';
    el.style.transition = 'background 0.4s, border-color 0.4s';
    setTimeout(() => { el.style.background = prevBg; el.style.borderColor = prevBorder; }, 1800);
    return true;
  };
  if (inCurrentStage) {
    if (currentTab !== 'detail' || currentClientId !== clientId) {
      currentClientId = clientId;
      switchTab('detail');
    }
    setTimeout(findAndHighlight, 200);
    return;
  }
  // Task is in a different stage — go to the Tasks tab filtered by this client + all stages + all statuses
  tasksFilter = tasksFilter || {};
  tasksFilter.tab = 'todo';
  tasksFilter.status = 'all';
  tasksFilter.stages = [];
  tasksFilter.stage = '';
  tasksFilter.bankerIds = [];
  tasksFilter.clientIds = [clientId];
  tasksFilter.search = '';
  tasksFilter.itemTitle = '';
  tasksFilter.missingDocs = false;
  switchTab('tasks');
  setTimeout(() => {
    // Try to find the row on the Tasks tab
    const rows = document.querySelectorAll('#tabTasks tr, #tabTasks .task-item');
    for (const row of rows) {
      if ((row.textContent || '').includes(t.title)) {
        row.scrollIntoView({ behavior: 'smooth', block: 'center' });
        const prevBg = row.style.background;
        row.style.background = '#fef3c7';
        row.style.transition = 'background 0.4s';
        setTimeout(() => { row.style.background = prevBg; }, 1800);
        return;
      }
    }
  }, 250);
}

function renderOpenItemsPopupBody(clientId) {
  const body = document.getElementById('openItemsPopupBody');
  if (!body) return;
  const c = state.clients.find(x => x.id === clientId);
  if (!c) { body.innerHTML = ''; return; }
  const openTasks = (c.tasks || []).filter(t => {
    if (_isPassiveTask(t)) return false;
    const st = t.status || 'active';
    if (st !== 'done') return true;
    if (typeof hasOpenSubCheck === 'function' && hasOpenSubCheck(t)) return true;
    return false;
  });
  const openReqs = (c.requirements || []).filter(r => r.status === 'pending');
  if (openTasks.length === 0 && openReqs.length === 0) {
    body.innerHTML = '<div style="text-align:center;padding:32px;color:#16a34a;font-weight:600;font-size:16px">✓ אין פריטים פתוחים — הכל בוצע!</div>';
    return;
  }
  const stageOrder = STAGES.map(s => s.id);
  // Group tasks by stage
  const tasksByStage = {};
  openTasks.forEach(t => { (tasksByStage[t.stage] = tasksByStage[t.stage] || []).push(t); });
  // Group reqs by stage
  const reqsByStage = {};
  openReqs.forEach(r => { (reqsByStage[r.stage] = reqsByStage[r.stage] || []).push(r); });
  const statusBadge = st => {
    if (st === 'follow-up') return '<span style="background:#fef3c7;color:#92400e;padding:1px 6px;border-radius:8px;font-size:10px;font-weight:700">מעקב</span>';
    if (st === 'done') return '<span style="background:#dcfce7;color:#166534;padding:1px 6px;border-radius:8px;font-size:10px;font-weight:700">בוצע · תת־בדיקה פתוחה</span>';
    return '<span style="background:#fee2e2;color:#991b1b;padding:1px 6px;border-radius:8px;font-size:10px;font-weight:700">פעיל</span>';
  };
  let html = `<div style="font-size:13px;color:#1e40af;background:#eff6ff;border:1px solid #bfdbfe;padding:8px 12px;border-radius:6px;margin-bottom:12px">
    ${openTasks.length} משימות פתוחות · ${openReqs.length} מסמכים חסרים
  </div>`;
  stageOrder.forEach(sid => {
    const tasks = tasksByStage[sid] || [];
    const reqs = reqsByStage[sid] || [];
    if (!tasks.length && !reqs.length) return;
    const stageLabel = (stageInfo(sid) || {}).label || sid;
    const stageColor = (stageInfo(sid) || {}).color || '#94a3b8';
    html += `<div style="margin-bottom:16px">
      <div style="font-weight:700;color:#0f172a;margin-bottom:8px;padding:6px 10px;background:${stageColor}20;border-inline-start:4px solid ${stageColor};border-radius:6px">${escapeHtml(stageLabel)}</div>`;
    if (tasks.length) {
      html += `<div style="margin-bottom:8px"><div style="font-size:11px;font-weight:700;color:#475569;margin-bottom:4px">✅ משימות (${tasks.length})</div>`;
      html += tasks.map(t => {
        const st = t.status || 'active';
        return `<div style="display:flex;align-items:center;gap:8px;padding:8px 10px;background:#f8fafc;border:1px solid #e5e7eb;border-radius:8px;margin-bottom:4px">
          <span style="flex:1;font-size:13px;cursor:pointer;color:#1e40af;text-decoration:underline" title="עבור למשימה" onclick="jumpToTask('${c.id}','${t.id}')">${escapeHtml(t.title)}</span>
          ${statusBadge(st)}
          <button class="btn small secondary" style="padding:2px 8px;font-size:11px" onclick="jumpToTask('${c.id}','${t.id}')" title="עבור למשימה">↗</button>
          <button class="btn small" style="background:#16a34a;color:#fff" onclick="setTaskStatus('${c.id}','${t.id}','done');renderOpenItemsPopupBody('${c.id}')" title="סמן בוצע">✓ בוצע</button>
        </div>`;
      }).join('');
      html += `</div>`;
    }
    if (reqs.length) {
      html += `<div><div style="font-size:11px;font-weight:700;color:#475569;margin-bottom:4px">📄 מסמכים חסרים (${reqs.length})</div>`;
      html += reqs.map(r => `
        <div style="display:flex;align-items:center;gap:8px;padding:8px 10px;background:#fef2f2;border:1px solid #fca5a5;border-radius:8px;margin-bottom:4px">
          <span style="flex:1;font-size:13px">${escapeHtml(r.name)}</span>
          <button class="btn small" style="background:#16a34a;color:#fff" onclick="setReqStatus('${c.id}','${r.id}','provided');renderOpenItemsPopupBody('${c.id}')" title="סמן שהתקבל">✓ התקבל</button>
          <button class="btn small secondary" onclick="setReqStatus('${c.id}','${r.id}','not-required');renderOpenItemsPopupBody('${c.id}')" title="לא נדרש">לא נדרש</button>
        </div>`).join('');
      html += `</div>`;
    }
    html += `</div>`;
  });
  body.innerHTML = html;
}

    const hoursAgo = Math.round((Date.now() - new Date(sentAt).getTime()) / 3600000);

    const label = hoursAgo < 1 ? 'לפני פחות משעה' : hoursAgo < 24 ? `לפני ${hoursAgo} שעות` : `לפני ${Math.floor(hoursAgo/24)} ימים ו־${hoursAgo%24} שעות`;

    statusHtml = `<div style="padding:10px 12px;margin-bottom:12px;border-radius:8px;background:${isStale?'#fef3c7':'#eff6ff'};border:1px solid ${isStale?'#fbbf24':'#bfdbfe'};font-size:13px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
        <div style="color:${isStale?'#78350f':'#1e40af'};font-weight:700">${isStale?'⏰':channelIcon} בקשה נשלחה ${label} (${channel === 'whatsapp' ? 'WhatsApp' : 'מייל'})${isStale?' — טרם התקבל!':''}</div>

// Opens the client email dialog with the "בקשת מסמכים חסרים" template pre-filled.
// On send, timestamps the client so we can nag after 24h.
function sendMissingDocsRequest(clientId, isFollowUp) {
  const c = state.clients.find(x => x.id === clientId);
  if (!c) return;
  const pending = (c.requirements || []).filter(r => r.status === 'pending');
  if (!pending.length) { alert('אין מסמכים חסרים ללקוח זה'); return; }
  // Split by borrower vs. guarantor — guarantor docs have "— ערב N" in the name suffix
  const borrowerDocs = pending.filter(r => !/— ערב\s*\d/.test(r.name));
  const guarantorDocs = pending.filter(r => /— ערב\s*\d/.test(r.name));
  const box = '☐';
  const cleanGuarantorName = n => n.replace(/\s*—\s*ערב\s*\d+\s*$/, '');
  const formatBorrowerSection = items => {
    if (!items.length) return '';
    return `▬▬▬ 📋 ניירת של הלווים ▬▬▬\n` + items.map(r => `${box}  ${r.name}`).join('\n');
  };
  const formatGuarantorSection = items => {
    if (!items.length) return '';
    // Group by guarantor number
    const byG = {};
    items.forEach(r => {
      const m = r.name.match(/—\s*ערב\s*(\d+)/);
      const gNum = m ? m[1] : '1';
      (byG[gNum] = byG[gNum] || []).push(cleanGuarantorName(r.name));
    });
    const guarantorNums = Object.keys(byG).sort();
    const multi = guarantorNums.length > 1;
    let out = `▬▬▬ 🤝 ניירת של הערבים ▬▬▬\n`;
    guarantorNums.forEach(g => {
      if (multi) out += `\n【 ערב ${g} 】\n`;
      out += byG[g].map(n => `${box}  ${n}`).join('\n') + '\n';
    });
    return out.trimEnd();
  };
  const sections = [];
  if (borrowerDocs.length) sections.push(formatBorrowerSection(borrowerDocs));
  if (guarantorDocs.length) sections.push(formatGuarantorSection(guarantorDocs));
  const missingText = sections.join('\n\n');
  const greeting = (function(){ const h = new Date().getHours(); return h < 12 ? 'בוקר טוב' : h < 17 ? 'צהריים טובים' : 'ערב טוב'; })();
  const nameForBody = ((c.borrowers||[])[0]?.name) || c.name || '';
  let subject, body;
  if (isFollowUp) {
    subject = 'תזכורת — מסמכים חסרים לתיק המשכנתא';
    body = `${greeting} ${nameForBody},\n\nזוהי תזכורת ידידותית — טרם התקבלו המסמכים הבאים לתיק המשכנתא:\n\n${missingText}\n\nאשמח לקבל בהקדם כדי שנוכל להמשיך בטיפול.\n\n⚠️ נא להצטייד בת"ז + ספח מקוריים כשמעבירים את המסמכים.\n\nתודה,\nיצחק`;
  } else {
    subject = 'מסמכים חסרים לתיק המשכנתא';
    body = `${greeting} ${nameForBody},\n\nלהלן רשימת המסמכים החסרים לתיק המשכנתא:\n\n${missingText}\n\n⚠️ נא להצטייד בת"ז + ספח מקוריים.\n\nאשמח לקבל בהקדם.\n\nתודה,\nיצחק`;
  }
  const emails = [];
  (c.borrowers||[]).forEach(b => { if (b.email) emails.push(b.email); });
  if (c.email && !emails.includes(c.email)) emails.push(c.email);
  if (!emails.length) { alert('אין מייל שמור ללקוח. עדכן ב"ערוך".'); return; }
  const to = emails[0];
  const url = 'https://mail.google.com/mail/?authuser=a035591712@gmail.com&view=cm&fs=1&to=' + encodeURIComponent(to) + '&su=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
  // Timestamp the send so the 24h nag can fire
  c.missingDocsRequestSentAt = now();
  c.missingDocsRequestChannel = 'email';
  c.missingDocsRequestCount = (c.missingDocsRequestCount || 0) + 1;
  if (isFollowUp) c.missingDocsFollowUpAt = now();
  logCommunication(clientId, 'email', { to, subject, body, missingDocsRequest: true, followUp: !!isFollowUp });
  save();
  window.open(url, '_blank', 'noopener');
  renderMissingDocsPopupBody(clientId);
  if (currentTab === 'detail') renderClientDetail();
  if (currentTab === 'dashboard') renderDashboard();
  refreshTaskAlertsFloat();
}

function quickMove(clientId, stageId, adminOverride) {
  const c = state.clients.find(x => x.id === clientId);
  if (!c || c.stage === stageId) return;
  const currentIdx = stageIndex(c.stage);
  const targetIdx = stageIndex(stageId);
  const isForward = targetIdx > currentIdx;
  const isArchive = stageId === 'archive';
  // Skip admin dialog if target stage was already visited (returning to a stage we've been to)
  const alreadyVisited = (c.stageHistory||[]).some(h => h.stage === stageId);
  if (isForward && !isArchive && !adminOverride && !alreadyVisited) {
    const stageTasks = c.tasks.filter(t => t.stage === c.stage);
    const allDone = stageTasks.length > 0 && stageTasks.every(t => (t.status||'active') === 'done');
    if (!allDone) {
      const undone = stageTasks.filter(t => (t.status||'active') !== 'done').map(t => t.title);
      openStageOverrideDialog(clientId, stageId, undone);
      return;
    }
  }
  moveStage(c, stageId);
  save(); renderClientDetail(); renderKanban();
}

          <tr><th>כתובת</th><td>${escapeHtml(address)}</td></tr>
          <tr><th>מחיר חוזה</th><td>${fmtMoney(c.propertyValue)}</td></tr>
          <tr><th>שווי שמאי</th><td>${c.appraiserValue ? fmtMoney(c.appraiserValue) : '—'}</td></tr>
          <tr><th>סכום ההלוואה</th><td>${fmtMoney(c.loanAmount)}</td></tr>
          <tr><th>אחוז מימון</th><td>${financingPct(c) !== null ? financingPct(c) + '%' : '—'}</td></tr>
          <tr><th>סוג דירה</th><td>${escapeHtml(APARTMENT_LABEL[c.apartmentType]||'—')}</td></tr>
          <tr><th>רישום</th><td>${escapeHtml((REGISTRATION_DOCS[c.registrationType]||{}).label||'—')}</td></tr>
          <tr><th>בנקאי מטפל</th><td>${banker ? escapeHtml(banker.name + (banker.bank?' · '+banker.bank:'') + (banker.branch?' · סניף '+banker.branch:'')) : '—'}</td></tr>
        </table>
      </div>
    </div>
    ${guarantors ? `<div class="box" style="margin-bottom:20px"><h2>🤝 ערבים</h2><table>${guarantors}</table></div>` : ''}
    <div class="row">
      <div class="box"><h2>✅ משימות פתוחות (${(c.tasks||[]).filter(t => (t.status||'active') !== 'done').length})</h2><ul>${openTasks || '<li>אין</li>'}</ul></div>
      <div class="box"><h2>⚠️ מסמכים חסרים (${(c.requirements||[]).filter(r => r.status === 'pending').length})</h2><ul>${missing || '<li>אין</li>'}</ul></div>
    </div>
    ${c.notes ? `<div class="box" style="margin-bottom:20px"><h2>📝 הערות</h2><div style="font-size:13px;white-space:pre-wrap">${escapeHtml(c.notes)}</div></div>` : ''}
    <div class="footer">CRM משכנתאות · יצחק</div>
  </body></html>`;
  const w = window.open('', '_blank');
  w.document.write(html);
  w.document.close();
}

// Format a YYYY-MM-DD or ISO date for Hebrew display; empty string when missing
function _fmtHDate(s) {
  if (!s) return '';
  const d = new Date(s.length === 10 ? (s + 'T00:00:00') : s);
  if (isNaN(d)) return '';
  return d.toLocaleDateString('he-IL');
}
function _greetingByHour() {
  const h = new Date().getHours();
  if (h < 12) return 'בוקר טוב';
  if (h < 17) return 'צהריים טובים';
  if (h < 20) return 'אחר צהריים טובים';
  return 'ערב טוב';
}
function _bankerAddress(banker) {
  if (!banker) return 'שלום רב';
  const gender = banker.gender; // 'male' | 'female' when set
  const title = gender === 'female' ? 'גברת' : gender === 'male' ? 'מר' : '';
  const nm = (banker.name || '').trim();
  if (!nm) return 'שלום רב';
  return (title ? title + ' ' : '') + nm;
}

function openBankLetter(clientId) {
  const c = state.clients.find(x => x.id === clientId);
  if (!c) return;
  const banker = c.bankerId ? state.settings.bankers.find(b => b.id === c.bankerId) : null;
  const purposes = (c.purposes && c.purposes.length) ? c.purposes : (c.purpose ? [c.purpose] : []);
  const isContractDeal = purposes.some(p => CONTRACT_PRICE_PURPOSES.has(p));

  // Compose a structured person row: name/phone/email, then IDs/dates, then banks.
  const _personBlock = (role, p) => {
    const banks = (Array.isArray(p.bankAccounts) ? p.bankAccounts : [])
      .map(x => (x && x.bank || '').toString().trim()).filter(Boolean);
    const banksLine = banks.length ? banks.join(', ') : '—';
    const row1 = [
      p.name ? '<strong>' + escapeHtml(p.name) + '</strong>' : '<span style="color:#94a3b8">— ללא שם —</span>',
      p.phone ? '📱 ' + escapeHtml(p.phone) : '',
      p.email ? '✉️ ' + escapeHtml(p.email) : ''
    ].filter(Boolean).join(' · ');
    const row2 = [
      p.idNumber ? 'ת"ז: ' + escapeHtml(p.idNumber) : '',
      p.dob ? 'לידה: ' + escapeHtml(_fmtHDate(p.dob)) : '',
      p.idIssueDate ? 'הנפקה: ' + escapeHtml(_fmtHDate(p.idIssueDate)) : ''
    ].filter(Boolean).join(' · ');
    return `<tr>
      <th style="vertical-align:top;padding-top:6px">${escapeHtml(role)}</th>
      <td style="padding:6px 4px">
        <div style="font-size:13px">${row1}</div>
        ${row2 ? '<div style="font-size:12px;color:#475569;margin-top:2px">' + row2 + '</div>' : ''}
        <div style="font-size:12px;color:#475569;margin-top:2px">🏦 בנקים: ${escapeHtml(banksLine)}</div>
      </td>
    </tr>`;
  };
  const borrowersHtml = (c.borrowers || []).map((b, i) => _personBlock(b.role || (i === 0 ? 'לווה' : 'בת/בן זוג'), b)).join('');
  const guarantorsHtml = (c.guarantors || []).map((g, i) => _personBlock('ערב ' + (i + 1), g)).join('');

  // Per-(person, job) rows. Guarantor rows are visually distinct + tagged as 50% weight.
  const _jobRows = (people, roleFn, isGuarantor) => people.map((p, pi) => {
    const jobs = Array.isArray(p.jobIncomes) ? p.jobIncomes : [];
    return jobs.map(j => {
      const months = Array.isArray(j.months) ? j.months.filter(m => m.amount > 0) : [];
      if (months.length === 0) return '';
      let monthly;
      if (_isYearlyType(j.type)) {
        let sumAmt = 0, sumDiv = 0;
        months.forEach(m => { if (m.inAvg !== false) { sumAmt += Number(m.amount || 0); sumDiv += Math.max(1, Number(m.mDiv) || 12); } });
        monthly = sumDiv > 0 ? Math.round(sumAmt / sumDiv) : 0;
      } else {
        const sum = months.reduce((s, m) => s + Number(m.amount || 0), 0);
        monthly = Math.round(sum / months.length);
      }
      if (monthly <= 0) return '';
      const label = j.employer ? (j.type + ' · ' + j.employer) : j.type;
      const bg = isGuarantor ? ' style="background:#fef3c7"' : '';
      return `<tr${bg}><td>${escapeHtml(roleFn(p, pi))}</td><td>${escapeHtml(label)}</td><td style="text-align:end">${fmtMoney(monthly)}</td></tr>`;
    }).filter(Boolean).join('');
  }).join('');

  const borrowerRows = _jobRows(c.borrowers || [], (b, i) => b.name || 'לווה ' + (i + 1), false);
  const guarantorRows = _jobRows(c.guarantors || [], (g, i) => 'ערב ' + (i + 1) + (g.name ? ' — ' + g.name : ''), true);
  const borrowersIncome = getBorrowersIncomeMonthly(c);
  const guarantorsIncomeFull = getGuarantorsIncomeMonthly(c);
  const guarantorsIncomeWeighted = Math.round(guarantorsIncomeFull * GUARANTOR_INCOME_WEIGHT);
  const grossIncome = getMonthlyIncomeGross(c);

  const guarantorSection = guarantorRows ? `
    <tr class="subheader"><td colspan="3" style="background:#fef3c7;color:#78350f;font-weight:700;padding:6px">ערבים <span style="font-size:11px;font-weight:500">(נלקחים בחישוב לפי 50% בלבד)</span></td></tr>
    ${guarantorRows}
    <tr style="background:#fef3c7"><td colspan="2" style="color:#78350f"><strong>סה"כ הכנסת ערבים (100%)</strong></td><td style="text-align:end;color:#78350f"><strong>${fmtMoney(guarantorsIncomeFull)}</strong></td></tr>
    <tr style="background:#fef3c7"><td colspan="2" style="color:#78350f"><strong>הכנסת ערבים לחישוב (50%)</strong></td><td style="text-align:end;color:#78350f"><strong>${fmtMoney(guarantorsIncomeWeighted)}</strong></td></tr>
  ` : '';

  const borrowerSection = borrowerRows ? `
    <tr class="subheader"><td colspan="3" style="background:#eff6ff;color:#1e40af;font-weight:700;padding:6px">לווים</td></tr>
    ${borrowerRows}
    ${guarantorRows ? `<tr><td colspan="2"><strong>סה"כ הכנסת לווים</strong></td><td style="text-align:end"><strong>${fmtMoney(borrowersIncome)}</strong></td></tr>` : ''}
  ` : '';

  const incomesHtml = (borrowerRows || guarantorRows)
    ? `<table><thead><tr><th>שם</th><th>מקור הכנסה</th><th style="text-align:end">חודשי</th></tr></thead><tbody>${borrowerSection}${guarantorSection}<tr class="totalRow"><td colspan="2"><strong>סה"כ הכנסה חודשית נטו לחישוב</strong></td><td style="text-align:end"><strong>${fmtMoney(grossIncome)}</strong></td></tr></tbody></table>${guarantorRows ? '<div style="font-size:11px;color:#78350f;margin-top:6px">💡 הכנסות ערבים נכללות בחישוב יחס ההחזר לפי 50% בלבד, בהתאם לנוהל הבנקים.</div>' : ''}`
    : '<p style="color:#666;font-size:12px">לא הוזנו הכנסות במערכת.</p>';

  // Obligations — grouped by owner (property/borrowers/guarantors), each row tagged with its owner.
  const obList = Array.isArray(c.obligations) ? c.obligations : [];
  const { inRatio, excluded, nearThreshold } = classifyObligations(c);
  const _renderObRow = (o) => {
    const inRatioMark = (excluded.some(x => x.id === o.id))
      ? '<span style="color:#dc2626;font-size:11px">(לא נכלל ביחס — מסתיים בפחות מ־18 חודשים)</span>'
      : (nearThreshold.some(x => x.id === o.id)
        ? '<span style="color:#b45309;font-size:11px">(נכלל, קרוב לסף)</span>' : '');
    return `<tr><td>${escapeHtml(o.label || 'הלוואה')}</td><td style="text-align:end">${o.balance ? fmtMoney(o.balance) : '—'}</td><td style="text-align:end">${o.monthly ? fmtMoney(o.monthly) : '—'}</td><td>${o.endDate ? _fmtHDate(o.endDate + '-01') : '—'} ${inRatioMark}</td></tr>`;
  };
  // Group obligations by owner id (b0/b1/g0/g1/'' for property/general)
  const groups = new Map(); // ownerId -> { label, rows: [] }
  obList.forEach(o => {
    const ownerId = (o.owner === undefined || o.owner === null) ? '' : o.owner;
    if (!groups.has(ownerId)) {
      const label = ownerId === '' ? 'כללי / נכס' : (_ownerLabelFromId(c, ownerId) || 'לא מוגדר');
      groups.set(ownerId, { label, rows: [], sum: 0 });
    }
    const g = groups.get(ownerId);
    g.rows.push(o);
    if (o.monthly > 0) g.sum += Number(o.monthly);
  });
  // Preferred display order: general first, then borrowers b0/b1..., then guarantors g0/g1...
  const orderKey = (ownerId) => {
    if (ownerId === '') return 0;
    if (ownerId.startsWith('b')) return 100 + Number(ownerId.slice(1));
    if (ownerId.startsWith('g')) return 200 + Number(ownerId.slice(1));
    return 999;
  };
  const orderedGroups = Array.from(groups.entries()).sort((a, b) => orderKey(a[0]) - orderKey(b[0]));
  const groupHtml = orderedGroups.map(([ownerId, g]) => {
    const isGuarantor = ownerId.startsWith('g');
    const bg = isGuarantor ? '#fef3c7' : (ownerId === '' ? '#e0e7ff' : '#eff6ff');
    const color = isGuarantor ? '#78350f' : (ownerId === '' ? '#3730a3' : '#1e40af');
    return `
      <tr class="subheader"><td colspan="4" style="background:${bg};color:${color};font-weight:700;padding:6px">${escapeHtml(g.label)}${isGuarantor ? ' <span style="font-size:11px;font-weight:500">(התחייבות של ערב)</span>' : ''}</td></tr>
      ${g.rows.map(_renderObRow).join('')}
      <tr style="background:${bg}"><td colspan="2" style="color:${color}"><strong>סה"כ החזר חודשי — ${escapeHtml(g.label)}</strong></td><td style="text-align:end;color:${color}"><strong>${fmtMoney(g.sum)}</strong></td><td></td></tr>
    `;
  }).join('');
  const inRatioSum = inRatio.reduce((s, o) => s + (Number(o.monthly) || 0), 0);
  const obligationsHtml = obList.length
    ? `<table><thead><tr><th>התחייבות</th><th style="text-align:end">יתרת חוב</th><th style="text-align:end">החזר חודשי</th><th>תאריך סיום</th></tr></thead><tbody>${groupHtml}<tr class="totalRow" style="background:#f0fdf4"><td colspan="2"><strong>סה"כ החזרים חודשיים (נכללים ביחס)</strong></td><td style="text-align:end"><strong>${fmtMoney(inRatioSum)}</strong></td><td></td></tr></tbody></table>`
    : '<p style="color:#666;font-size:12px">אין התחייבויות מוזנות.</p>';

  // Loan composition (הרכב הלוואה)
  const tracks = c.loanComposition && c.loanComposition.tracks ? c.loanComposition.tracks : {};
  const filledTracks = LOAN_TRACKS.filter(tr => tracks[tr.id] && (Number(tracks[tr.id].amount) > 0));
  let compAmt = 0, compMonthly = 0;
  const compRows = filledTracks.map(tr => {
    const d = tracks[tr.id];
    const m = calcMonthlyPayment(Number(d.amount) || 0, Number(d.rate) || 0, Number(d.years) || 0);
    compAmt += Number(d.amount) || 0; compMonthly += m;
    return `<tr><td>${escapeHtml(tr.label)}</td><td style="text-align:end">${fmtMoney(d.amount)}</td><td style="text-align:end">${d.years || '—'} שנים</td><td style="text-align:end">${d.rate || '—'}%</td><td style="text-align:end">${fmtMoney(Math.round(m))}</td></tr>`;
  }).join('');
  const compHtml = compRows
    ? `<table><thead><tr><th>מסלול</th><th style="text-align:end">סכום</th><th style="text-align:end">שנים</th><th style="text-align:end">ריבית</th><th style="text-align:end">החזר חודשי</th></tr></thead><tbody>${compRows}<tr class="totalRow"><td><strong>סה"כ</strong></td><td style="text-align:end"><strong>${fmtMoney(Math.round(compAmt))}</strong></td><td></td><td></td><td style="text-align:end"><strong>${fmtMoney(Math.round(compMonthly))}</strong></td></tr></tbody></table>`
    : '<p style="color:#666;font-size:12px">טרם הוזן הרכב הלוואה.</p>';

  const netIncome = Math.max(0, grossIncome - inRatioSum);
  const totalMonthly = Math.round(compMonthly);
  const ratio = netIncome > 0 && totalMonthly > 0 ? Math.round((totalMonthly / netIncome) * 1000) / 10 : null;
  const ratioColor = ratio === null ? '#666' : (ratio <= 40 ? '#166534' : ratio <= 50 ? '#b45309' : '#991b1b');

  // Deal details
  const address = [c.propertyCity, c.propertyAddress, c.propertyBuilding ? 'בניין ' + c.propertyBuilding : '', c.propertyApartment ? 'דירה ' + c.propertyApartment : ''].filter(Boolean).join(' · ') || '—';
  let dealHtml = `
    <tr><th>מטרות ההלוואה</th><td>${escapeHtml(purposes.join(', ') || '—')}</td></tr>
    <tr><th>כתובת הנכס</th><td>${escapeHtml(address)}</td></tr>
    <tr><th>שווי הנכס לחישוב</th><td>${fmtMoney(ltvDenom(c))}</td></tr>
    <tr><th>סכום הלוואה מבוקש</th><td>${fmtMoney(c.loanAmount)}</td></tr>
    <tr><th>אחוז מימון</th><td>${financingPct(c) !== null ? financingPct(c) + '%' : '—'}</td></tr>
    <tr><th>סוג דירה</th><td>${escapeHtml(APARTMENT_LABEL[c.apartmentType] || '—')}</td></tr>
    <tr><th>תאריך יעד</th><td>${c.targetDate ? _fmtHDate(c.targetDate) : '—'}</td></tr>
  `;
  if (isContractDeal) {
    dealHtml += `
      <tr><th>תאריך חתימת חוזה</th><td>${c.contractSignDate ? _fmtHDate(c.contractSignDate) : '—'}</td></tr>
      <tr><th>תאריך תשלום</th><td>${c.contractPaymentDate ? _fmtHDate(c.contractPaymentDate) : '—'}</td></tr>
    `;
    const dd = c.dealDetails || {};
    if (dd.secondHand) {
      const s = dd.secondHand;
      const sellers = Array.isArray(s.sellers) && s.sellers.length ? s.sellers : [{ name: s.sellerName, phone: s.sellerPhone, email: s.sellerEmail }];
      const sellersLine = sellers.filter(x => x.name || x.phone).map(x => escapeHtml(x.name || '') + (x.phone ? ' · ' + escapeHtml(x.phone) : '')).join('; ') || '—';
      dealHtml += `
        <tr><th>מוכר/ים</th><td>${sellersLine}</td></tr>
        <tr><th>עו"ד קונה</th><td>${escapeHtml(s.buyerLawyer || '—')}${s.buyerLawyerPhone ? ' · ' + escapeHtml(s.buyerLawyerPhone) : ''}${s.buyerLawyerEmail ? ' · ' + escapeHtml(s.buyerLawyerEmail) : ''}</td></tr>
        <tr><th>עו"ד מוכר</th><td>${escapeHtml(s.sellerLawyer || '—')}${s.sellerLawyerPhone ? ' · ' + escapeHtml(s.sellerLawyerPhone) : ''}${s.sellerLawyerEmail ? ' · ' + escapeHtml(s.sellerLawyerEmail) : ''}</td></tr>
      `;
    }
    if (dd.firstHand) {
      const f = dd.firstHand;
      dealHtml += `
        <tr><th>קבלן</th><td>${escapeHtml(f.contractor || '—')}${f.contractorPhone ? ' · ' + escapeHtml(f.contractorPhone) : ''}</td></tr>
        <tr><th>עו"ד קונה</th><td>${escapeHtml(f.buyerLawyer || '—')}${f.buyerLawyerPhone ? ' · ' + escapeHtml(f.buyerLawyerPhone) : ''}${f.buyerLawyerEmail ? ' · ' + escapeHtml(f.buyerLawyerEmail) : ''}</td></tr>
        <tr><th>עו"ד קבלן</th><td>${escapeHtml(f.contractorLawyer || '—')}${f.contractorLawyerPhone ? ' · ' + escapeHtml(f.contractorLawyerPhone) : ''}${f.contractorLawyerEmail ? ' · ' + escapeHtml(f.contractorLawyerEmail) : ''}</td></tr>
      `;
    }
    if (dd.mchirLm) {
      const m = dd.mchirLm;
      dealHtml += `
        <tr><th>קבלן</th><td>${escapeHtml(m.contractor || '—')}${m.contractorPhone ? ' · ' + escapeHtml(m.contractorPhone) : ''}</td></tr>
        <tr><th>עו"ד קונה</th><td>${escapeHtml(m.buyerLawyer || '—')}${m.buyerLawyerPhone ? ' · ' + escapeHtml(m.buyerLawyerPhone) : ''}${m.buyerLawyerEmail ? ' · ' + escapeHtml(m.buyerLawyerEmail) : ''}</td></tr>
        <tr><th>עו"ד קבלן</th><td>${escapeHtml(m.contractorLawyer || '—')}${m.contractorLawyerPhone ? ' · ' + escapeHtml(m.contractorLawyerPhone) : ''}${m.contractorLawyerEmail ? ' · ' + escapeHtml(m.contractorLawyerEmail) : ''}</td></tr>
      `;
    }
  }

  const greeting = _greetingByHour();
  const address_lbl = _bankerAddress(banker);
  // The main notes field is moved to the very top of the letter (right under the opening line)
  // and shown as "פרטי העיסקה:" — same styled yellow box as before, but repositioned + retitled.
  const noteHtml = (c.notes && c.notes.trim())
    ? `<div class="section" style="background:#fef3c7;border:1px solid #fbbf24">
        <h2>פרטי העיסקה:</h2>
        <div style="white-space:pre-wrap;font-size:13px">${escapeHtml(c.notes.trim())}</div>
      </div>` : '';

  const letterHtml = `
    <div class="letter-body" id="bankLetterPrintable">
      <div class="letter-head">
        <div style="font-size:12px;color:#666">${new Date().toLocaleDateString('he-IL')}</div>
        <h1 style="margin:8px 0 4px;color:#1e3a8a">בקשת הלוואת משכנתא — ${escapeHtml(c.name || '')}</h1>
        <div style="font-size:12px;color:#666">${banker ? 'לכבוד ' + escapeHtml(banker.bank || '') + (banker.branch ? ' · סניף ' + escapeHtml(banker.branch) : '') : 'לכבוד הבנק'}</div>
      </div>
      <p style="margin:14px 0 12px">${greeting}, ${escapeHtml(address_lbl)},</p>
      <p style="margin:0 0 14px">להלן פרטי הבקשה למתן משכנתא ללקוחות שבנדון:</p>

      ${noteHtml}

      <div class="section"><h2>🏠 פרטי עסקה</h2><table>${dealHtml}</table></div>

      <div class="section"><h2>👤 פרטי לקוח</h2><table>${borrowersHtml || '<tr><td>—</td></tr>'}${guarantorsHtml}</table></div>

      <div class="section"><h2>💰 פרטי הכנסות</h2>${incomesHtml}</div>

      <div class="section"><h2>📉 פרטי התחייבויות</h2>${obligationsHtml}</div>

      <div class="section"><h2>🧮 הרכב הלוואה מבוקש</h2>${compHtml}</div>

      <div class="section summary"><h2>📊 סיכום יחס החזר</h2>
        <table>
          <tr><th>הכנסה חודשית נטו</th><td style="text-align:end">${fmtMoney(grossIncome)}</td></tr>
          <tr><th>− סה"כ החזרים חודשיים על התחייבויות קיימות (נכלל ביחס)</th><td style="text-align:end">${fmtMoney(inRatioSum)}</td></tr>
          <tr class="totalRow"><th>הכנסה פנויה לחישוב</th><td style="text-align:end"><strong>${fmtMoney(netIncome)}</strong></td></tr>
          <tr><th>סה"כ החזר חודשי מוצע לפי הרכב ההלוואה</th><td style="text-align:end">${fmtMoney(totalMonthly)}</td></tr>
          <tr class="totalRow" style="background:#f0fdf4"><th>יחס החזר</th><td style="text-align:end;color:${ratioColor};font-size:18px"><strong>${ratio !== null ? ratio + '%' : '—'}</strong></td></tr>
        </table>
      </div>

      <p style="margin:20px 0 6px">אשמח לקבל את התייחסותכם/ן בהקדם.</p>
      <p style="margin:0"><strong>תודה רבה מראש</strong></p>
    </div>
  `;

  // Build a contacts list for the "send email" dropdown — banker first, then all contacts
  const contactsWithEmail = ((state.settings && state.settings.contacts) || []).filter(x => (x.email || '').trim());
  const bankerEmail = banker && banker.email ? banker.email.trim() : '';
