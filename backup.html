<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>CRM Backup</title>
<style>
body { font-family: system-ui, -apple-system, Segoe UI, sans-serif; background: #f8fafc; color: #0f172a; padding: 32px; max-width: 620px; margin: 40px auto; }
.card { background: #fff; border-radius: 12px; box-shadow: 0 10px 30px rgba(15,23,42,0.08); padding: 28px; }
h1 { margin: 0 0 12px; font-size: 20px; }
p { color: #475569; line-height: 1.6; margin: 8px 0; }
#status { padding: 12px 16px; border-radius: 8px; margin-top: 16px; font-weight: 600; }
.ok  { background: #dcfce7; color: #166534; }
.err { background: #fee2e2; color: #991b1b; }
.pending { background: #fef3c7; color: #854d0e; }
small { color: #64748b; display: block; margin-top: 16px; }
</style>
</head>
<body>
<div class="card">
<h1>גיבוי אוטומטי של CRM משכנתאות</h1>
<p>הדף הזה שומר עותק של הנתונים המקומיים שלך לקובץ JSON. תפתח אותו בכל יום בסוף היום (ידני או דרך משימה מתוזמנת).</p>
<div id="status" class="pending">מתחיל גיבוי…</div>
<small>הקובץ ירד לתיקיית ההורדות שלך בשם <code>mortgage-crm-backup-YYYY-MM-DD.json</code>.</small>
</div>
<script>
(async function(){
  const status = document.getElementById('status');
  function setStatus(cls, msg) { status.className = cls; status.textContent = msg; }
  try {
    const raw = localStorage.getItem('mortgage-crm-v1');
    if (!raw) { setStatus('err', 'לא נמצאו נתונים ב-localStorage. פתח קודם את ה-CRM ואז חזור לכאן.'); return; }
    const parsed = JSON.parse(raw);
    const clients = Array.isArray(parsed.clients) ? parsed.clients.length : 0;
    const d = new Date();
    const yyyy = d.getFullYear();
    const mm = String(d.getMonth()+1).padStart(2,'0');
    const dd = String(d.getDate()).padStart(2,'0');
    const name = 'mortgage-crm-backup-' + yyyy + '-' + mm + '-' + dd + '.json';
    const blob = new Blob([raw], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    setStatus('ok', '✓ גיבוי ירד: ' + name + ' | ' + clients + ' לקוחות | ' + Math.round(raw.length/1024) + ' KB');
    // Auto-close after 8s if opened from the scheduled task
    setTimeout(() => { try { window.close(); } catch(e){} }, 8000);
  } catch (e) {
    setStatus('err', 'נכשל: ' + e.message);
  }
})();
</script>
</body>
</html>
