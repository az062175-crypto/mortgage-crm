<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>מעקב תיק משכנתא</title>
<style>
  :root{--bg:#f1f5f9;--panel:#fff;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;--accent:#2563eb;--ok:#16a34a;--warn:#d97706}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.5}
  .wrap{max-width:720px;margin:0 auto;padding:16px}
  h1{font-size:20px;margin:8px 0 2px}
  .sub{color:var(--muted);font-size:14px;margin-bottom:14px}
  .steps{display:flex;gap:3px;overflow:visible;padding:4px 0 10px}
  .step{flex:1 1 0;min-width:0;border:2px solid var(--border);background:var(--panel);border-radius:12px;padding:6px 1px;font-size:10px;line-height:1.15;text-align:center;font-weight:600;color:var(--muted);cursor:pointer;white-space:normal;word-break:break-word;font-family:inherit}
  .step.done{color:var(--ok);border-color:#bbf7d0;background:#f0fdf4}
  .step.current{color:#fff;border-color:transparent}
  .step.sel{outline:3px solid #bfdbfe;outline-offset:1px}
  .step .cnt{display:block;width:fit-content;margin:2px auto 0;min-width:14px;padding:0 4px;border-radius:999px;background:#fee2e2;color:#991b1b;font-size:10px}
  .step.current .cnt{background:rgba(255,255,255,.9)}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px;margin-top:10px}
  .card h2{font-size:16px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
  .tag{font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px}
  .tag.me{background:#dbeafe;color:#1e40af}
  .tag.adv{background:#ffedd5;color:#9a3412}
  .item{border:1px solid var(--border);border-radius:10px;padding:12px;margin-top:8px}
  .item .nm{font-weight:600}
  .item.sent{background:#fffbeb;border-color:#fde68a}
  .note{font-size:13px;color:#92400e;margin-top:6px}
  .act{margin-top:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  button.link{background:none;border:none;color:var(--accent);font:inherit;font-size:14px;font-weight:600;cursor:pointer;padding:0;text-decoration:underline}
  button.send{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
  .card.sum{padding:8px 16px}
  .sr{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--border);font-size:15px}
  .sr:last-child{border-bottom:none}
  .sr span{color:var(--muted)}
  .appr{margin-top:10px;background:#f0fdf4;border:1px solid #86efac;color:#166534;border-radius:12px;padding:12px 14px;font-weight:700}
  .card.top{border:2px solid #bfdbfe}
  .cnt2{background:#dc2626;color:#fff;border:none;border-radius:999px;font:inherit;font-size:14px;font-weight:700;min-width:28px;text-align:center;padding:3px 10px;cursor:pointer}
  .cnt2.sentc{background:#d97706}
  .chip{display:inline-block;font-size:11px;font-weight:700;background:#f1f5f9;color:var(--muted);border-radius:999px;padding:1px 8px;margin-inline-end:8px}
  .empty{color:var(--muted);font-size:14px;padding:6px 0}
  .done-box{margin-top:12px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:10px 12px}
  .done-box summary{color:var(--ok);font-size:14px;font-weight:600;cursor:pointer}
  .done-box .dg{font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 2px}
  .done-box .di{font-size:14px;padding:2px 0;color:#166534}
  .center{text-align:center;padding:60px 16px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="center">טוען…</div></div>
<script>
var SB_URL='https://pfimmngjgkgzjjhemjdy.supabase.co';
var SB_KEY='sb_publishable_iOafusxiYK5ZBPqEb3IwOQ_jijlKgvO';
var TOKEN=(new URLSearchParams(location.search).get('t')||'').trim();
var S={data:null,sent:{},sel:null,busy:false};

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];});}

async function rpc(fn,body){
  var r=await fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',
    headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'},
    body:JSON.stringify(body)});
  if(!r.ok)throw new Error('http '+r.status);
  return r.json();
}

async function load(first){
  if(!TOKEN){fail('הקישור אינו תקין.');return;}
  try{
    var res=await rpc('portal_get',{p_token:TOKEN});
    if(!res||!res.data||!res.data.stages){fail('הקישור לא נמצא או שאינו פעיל. פנה ליועץ שלך.');return;}
    S.data=res.data;S.sent=res.sent||{};
    if(first||!S.sel||!S.data.stages.some(function(s){return s.id===S.sel;}))S.sel=S.data.stage;
    render();
  }catch(e){if(first)fail('לא הצלחנו לטעון. נסה לרענן את הדף.');}
}
function fail(msg){document.getElementById('app').innerHTML='<div class="center">'+esc(msg)+'</div>';}

function stageState(i,curIdx){return i<curIdx?'done':(i===curIdx?'current':'future');}

function render(){
  var d=S.data,stages=d.stages;
  var curIdx=Math.max(0,stages.findIndex(function(s){return s.id===d.stage;}));
  var sel=stages.find(function(s){return s.id===S.sel;})||stages[curIdx];
  var h='<h1>שלום '+esc(d.name||'')+'</h1><div class="sub">כאן רואים באיזה שלב התיק שלך נמצא ומה נדרש בכל שלב.</div>';
  h+=summaryHtml(d.summary);
  var allMine=[];
  stages.forEach(function(s){(s.items||[]).forEach(function(it){if(it.owner==='client')allMine.push({it:it,stage:s.label});});});
  var openMine=allMine.filter(function(x){return !S.sent[x.it.id];}).length;
  var showList=S.openTop&&allMine.length;
  h+='<div class="card top"><h2><span class="tag me">👤 מה נדרש ממך</span>'+
    (openMine?'<button class="cnt2" onclick="toggleTop()" title="לחץ להצגת הרשימה">'+openMine+(showList?' ▴':' ▾')+'</button>':
      (allMine.length?'<button class="cnt2 sentc" onclick="toggleTop()">'+(showList?'▴':'▾')+'</button>':''))+'</h2>'+
    (!allMine.length?'<div class="empty">אין כרגע שום דבר שנדרש ממך 🎉</div>':
      (showList?allMine.map(function(x){return itemHtml(x.it,x.stage);}).join(''):
        '<div class="empty">'+(openMine?'יש '+openMine+' פריטים שמחכים לך. לחץ על המספר האדום כדי לראות אותם.':'כל הפריטים נשלחו וממתינים לאישור היועץ. לחץ על החץ כדי לראות.')+'</div>'))+'</div>';
  h+='<div class="sub" style="margin:16px 0 4px">שלבי התיק — לחץ על שלב כדי לראות מה קורה בו:</div>';
  h+='<div class="steps">'+stages.map(function(s,i){
    var st=stageState(i,curIdx);
    var open=(s.items||[]).filter(function(it){return it.owner==='client'&&!S.sent[it.id];}).length;
    var style=st==='current'?' style="background:'+esc(s.color)+'"':'';
    return '<button class="step '+st+(s.id===sel.id?' sel':'')+'"'+style+' onclick="pick(\''+esc(s.id)+'\')">'+(st==='done'?'✓ ':'')+esc(s.label)+(open?'<span class="cnt">'+open+'</span>':'')+'</button>';
  }).join('')+'</div>';

  var selIdx=stages.indexOf(sel);
  var items=sel.items||[];
  var mine=items.filter(function(it){return it.owner==='client';});
  var adv=items.filter(function(it){return it.owner!=='client';});
  h+='<div class="card"><h2>'+esc(sel.label)+(selIdx===curIdx?' <span class="tag me">השלב הנוכחי</span>':'')+'</h2>';
  if(selIdx<curIdx&&!items.length)h+='<div class="empty">שלב זה הושלם ✓</div>';
  else if(!items.length)h+='<div class="empty">אין כרגע דברים פתוחים בשלב הזה.</div>';
  h+='</div>';

  if(mine.length){
    h+='<div class="card"><h2><span class="tag me">👤 ממך, בשלב הזה</span></h2>'+mine.map(function(it){
      return '<div class="item'+(S.sent[it.id]?' sent':'')+'"><div class="nm">'+esc(it.name)+'</div><div class="note">'+(S.sent[it.id]?'📤 נשלח ליועץ, ממתין לאישור':'⏳ ממתין לך — אפשר לסמן למעלה')+'</div></div>';}).join('')+'</div>';
  }
  if(adv.length){
    h+='<div class="card"><h2><span class="tag adv">🧑‍💼 בטיפול היועץ</span></h2>'+adv.map(function(it){
      return '<div class="item"><div class="nm">'+esc(it.name)+'</div></div>';}).join('')+'</div>';
  }
  if(d.doneCount){
    var done=d.done||[],groups={};
    done.forEach(function(x){(groups[x.stage]=groups[x.stage]||[]).push(x.name);});
    h+='<details class="done-box"><summary>✓ '+d.doneCount+' מסמכים כבר התקבלו ואושרו</summary>'+
      Object.keys(groups).map(function(g){
        return '<div class="dg">'+esc(g)+'</div>'+groups[g].map(function(n){return '<div class="di">✓ '+esc(n)+'</div>';}).join('');
      }).join('')+'</details>';
  }
  document.getElementById('app').innerHTML=h;
}

function money(n){return Number(n).toLocaleString('he-IL')+' ₪';}
function summaryHtml(s){
  if(!s)return '';
  var rows=[];
  if(s.types&&s.types.length)rows.push(['סוג העסקה',s.types.join(' + ')]);
  if(s.amount)rows.push(['סכום מבוקש',money(s.amount)]);
  if(s.pct!=null)rows.push(['אחוז מימון',s.pct+'%']);
  if(s.banks&&s.banks.length)rows.push(['הוגש לבנק',s.banks.join(', ')]);
  var h='';
  if(rows.length)h+='<div class="card sum">'+rows.map(function(r){return '<div class="sr"><span>'+esc(r[0])+'</span><b>'+esc(r[1])+'</b></div>';}).join('')+'</div>';
  if(s.approvals&&s.approvals.length)h+=s.approvals.map(function(a){
    return '<div class="appr">✅ קיים אישור עקרוני'+(a.bank?' מבנק '+esc(a.bank):'')+(a.amount?' על סך '+money(a.amount):'')+'</div>';}).join('');
  return h;
}
function itemHtml(it,stage){
  var sent=!!S.sent[it.id];
  var chip=stage?'<span class="chip">'+esc(stage)+'</span>':'';
  if(sent)return '<div class="item sent"><div class="nm">'+chip+esc(it.name)+'</div>'+
    '<div class="note">📤 נשלח ליועץ, ממתין לאישור היועץ לעדכון המסמך</div></div>';
  return '<div class="item"><div class="nm">'+chip+esc(it.name)+'</div>'+
    '<div class="act"><button class="send" onclick="mark(\''+esc(it.id)+'\',true)">✔ שלחתי ליועץ</button></div></div>';
}

function pick(id){S.sel=id;render();}
function toggleTop(){S.openTop=!S.openTop;render();}

async function mark(id,val){
  if(S.busy)return;S.busy=true;
  var prev=S.sent[id];
  if(val)S.sent[id]=new Date().toISOString();else delete S.sent[id];
  render();
  try{
    var r=await rpc('portal_set_sent',{p_token:TOKEN,p_req:id,p_sent:val});
    if(r&&typeof r==='object')S.sent=r;
  }catch(e){
    if(prev)S.sent[id]=prev;else delete S.sent[id];
    render();alert('העדכון לא נשמר. נסה שוב.');
  }
  S.busy=false;
}

load(true);
setInterval(function(){if(!S.busy&&!document.hidden)load(false);},30000);
</script>
</body>
</html>
