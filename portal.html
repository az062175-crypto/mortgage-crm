<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>מעקב תיק משכנתא</title>
<style>
  :root{--bg:#f1f5f9;--panel:#fff;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;--accent:#2563eb;--ok:#16a34a;--warn:#d97706}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.5}
  .wrap{max-width:720px;margin:0 auto;padding:16px}
  h1{font-size:20px;margin:8px 0 2px}
  .sub{color:var(--muted);font-size:14px;margin-bottom:14px}
  .steps{display:flex;gap:3px;overflow:visible;padding:4px 0 10px}
  .step{flex:1 1 0;min-width:0;border:2px solid var(--border);background:var(--panel);border-radius:12px;padding:6px 1px;font-size:10px;line-height:1.15;text-align:center;font-weight:600;color:var(--muted);cursor:pointer;white-space:normal;word-break:break-word;font-family:inherit}
  .step.done{color:var(--ok);border-color:#bbf7d0;background:#f0fdf4}
  .step.current{color:#fff;border-color:transparent}
  .step.sel{outline:3px solid #bfdbfe;outline-offset:1px}
  .step .cnt{display:block;width:fit-content;margin:2px auto 0;min-width:14px;padding:0 4px;border-radius:999px;background:#fee2e2;color:#991b1b;font-size:10px}
  .step.current .cnt{background:rgba(255,255,255,.9)}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px;margin-top:10px}
  .card h2{font-size:16px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
  .tag{font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px}
  .tag.me{background:#dbeafe;color:#1e40af}
  .tag.adv{background:#ffedd5;color:#9a3412}
  .item{border:1px solid var(--border);border-radius:10px;padding:12px;margin-top:8px}
  .item .nm{font-weight:600}
  .item.sent{background:#fffbeb;border-color:#fde68a}
  .note{font-size:13px;color:#92400e;margin-top:6px}
  .act{margin-top:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  button.link{background:none;border:none;color:var(--accent);font:inherit;font-size:14px;font-weight:600;cursor:pointer;padding:0;text-decoration:underline}
  button.send{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
  .card.sum{padding:8px 16px}
  .sr{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--border);font-size:15px}
  .sr:last-child{border-bottom:none}
  .sr span{color:var(--muted)}
  .appr{margin-top:10px;background:#f0fdf4;border:1px solid #86efac;color:#166534;border-radius:12px;padding:12px 14px;font-weight:700}
  .card.top{border:2px solid #bfdbfe}
  .cnt2{background:#dc2626;color:#fff;border:none;border-radius:999px;font:inherit;font-size:14px;font-weight:700;min-width:28px;text-align:center;padding:3px 10px;cursor:pointer}
  .cnt2.sentc{background:#d97706}
  .chip{display:inline-block;font-size:11px;font-weight:700;background:#f1f5f9;color:var(--muted);border-radius:999px;padding:1px 8px;margin-inline-end:8px}
  .empty{color:var(--muted);font-size:14px;padding:6px 0}
  .done-box{margin-top:12px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:10px 12px}
  .done-box summary{color:var(--ok);font-size:14px;font-weight:600;cursor:pointer}
  .done-box .dg{font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 2px}
  .done-box .di{font-size:14px;padding:2px 0;color:#166534}
  .center{text-align:center;padding:60px 16px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="center">טוען…</div></div>
<div id="chatRoot"></div>
<script>
var SB_URL='https://pfimmngjgkgzjjhemjdy.supabase.co';
var SB_KEY='sb_publishable_iOafusxiYK5ZBPqEb3IwOQ_jijlKgvO';
var TOKEN=(new URLSearchParams(location.search).get('t')||'').trim();
var S={data:null,sent:{},sel:null,busy:false};

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];});}

async function rpc(fn,body){
  var r=await fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',
    headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'},
    body:JSON.stringify(body)});
  if(!r.ok)throw new Error('http '+r.status);
  return r.json();
}

async function load(first){
  if(!TOKEN){fail('הקישור אינו תקין.');return;}
  try{
    var res=await rpc('portal_get',{p_token:TOKEN});
    if(res&&res.data&&res.data.disabled){fail('הקישור הזה אינו פעיל כרגע. לפרטים פנה ליועץ שלך.');return;}
    if(!res||!res.data||!res.data.stages){fail('הקישור לא נמצא או שאינו פעיל. פנה ליועץ שלך.');return;}
    S.data=res.data;S.sent=res.sent||{};
    // שלב "בטחונות בנק" פנימי ליועץ — לא מוצג ללקוח; תיק שנמצא בו מוצג כשלב "אישור"
    S.data.stages=(S.data.stages||[]).filter(function(s){return s.id!=='bank';});
    if(S.data.stage==='bank')S.data.stage='approval';
    if(first||!S.sel||!S.data.stages.some(function(s){return s.id===S.sel;}))S.sel=S.data.stage;
    render();
  }catch(e){if(first)fail('לא הצלחנו לטעון. נסה לרענן את הדף.');}
}
function fail(msg){document.getElementById('app').innerHTML='<div class="center">'+esc(msg)+'</div>';}

function stageState(i,curIdx){return i<curIdx?'done':(i===curIdx?'current':'future');}

function render(){
  var d=S.data,stages=d.stages;
  var curIdx=Math.max(0,stages.findIndex(function(s){return s.id===d.stage;}));
  var sel=stages.find(function(s){return s.id===S.sel;})||stages[curIdx];
  var h='<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px"><div style="min-width:0"><h1>'+greetByTime()+' '+esc(d.name||'')+'</h1><div class="sub">כאן רואים באיזה שלב התיק שלך נמצא ומה נדרש בכל שלב.</div></div>'+donutHtml(d.progress)+'</div>';
  h+=summaryHtml(d.summary);
  var allMine=[];
  stages.forEach(function(s){(s.items||[]).forEach(function(it){if(it.owner==='client'&&!it.preview&&!it.done)allMine.push({it:it,stage:s.label});});});
  // טלפונים שהלקוח ממלא בעצמו (איש קשר לביקור שמאי, ניידי לווים) — נספרים כאן; אחרי שהתקבלו יורדים למטה עם ✓ בוצע
  var pItems=[],doneMine=[],ap0=d.appr;
  var hasStage=function(id){return stages.some(function(s){return s.id===id;});};
  var stLabel=function(id){var s=stages.find(function(x){return x.id===id;});return s?s.label:'';};
  if(hasStage('appraisal')&&ap0){
    var vn=ap0.tenant?'מספר טלפון של השוכר לתיאום ביקור השמאי':'מספר טלפון לתיאום ביקור השמאי';
    if(ap0.tenant){/* יש שוכר: הטלפון שלו ממולא בקבוצה "פרטי השוכר" בשלב הגשה */}
    else if(!ap0.contact){if(ap0.ready!=='done')pItems.push({it:{id:ap0.contactKey,name:vn,phone:true},stage:stLabel('appraisal'),sid:'appraisal'});}
    else if(ap0.filled)doneMine.push({it:{id:ap0.contactKey,name:vn,phone:true,done:true},stage:stLabel('appraisal')});
  }
  if(hasStage('submission'))(d.phones||[]).forEach(function(p){
    var x={it:{id:p.id,name:'מספר נייד של '+(p.name||'הלווה'),phone:true,done:!!p.done},stage:stLabel('submission'),sid:'submission'};
    if(p.done)doneMine.push(x);else pItems.push(x);
  });
  // פרטים שהלקוח ממלא (ת"ז/תאריכים/אימייל ללווים, שוכר, עורכי דין): קבוצה אחת = פריט אחד
  var fIdx=function(id){return stages.findIndex(function(s){return s.id===id;});};
  var forms=(d.forms||[]).filter(function(g){return fIdx(g.from)>=0;});
  forms.forEach(function(g){
    var counts=g.from==='submission'||curIdx>=fIdx(g.from);
    var allDone=g.fields.every(function(f){return f.done;});
    var x={it:{id:'grp:'+g.id,name:g.title,form:g,done:allDone},stage:stLabel(g.from),sid:g.from};
    if(allDone)doneMine.push(x);else if(counts)pItems.push(x);
  });
  // השלמת פרטים (טלפונים/טפסים) לא נכנסת ל"מה נדרש ממך" ולא נספרת שם: משבצת קטנה נפרדת מימין
  var isOpen=function(x){return x.it.form?x.it.form.fields.some(function(f){return !f.done&&!S.sent[f.key];}):!S.sent[x.it.id];};
  var fillOpen=pItems.filter(isOpen).length;
  var openMine=allMine.filter(isOpen).length;
  var anyMine=allMine.length; // מה שהושלם עובר לקופסה מקופלת "✓ הושלמו" למטה (כמו המסמכים)
  var showList=S.openTop&&anyMine;
  if(pItems.length)h+='<details class="card fillbox" style="width:fit-content;max-width:100%;padding:8px 12px;margin-inline-end:auto"'+(S.fillOpen?' open':'')+' ontoggle="S.fillOpen=this.open"><summary style="cursor:pointer;font-weight:700;font-size:14px">📝 השלמת פרטים'+(fillOpen?' <span style="display:inline-block;margin-inline-start:4px;min-width:16px;padding:0 5px;border-radius:999px;background:#fee2e2;color:#991b1b;font-size:11px;text-align:center">'+fillOpen+'</span>':' ✓')+'</summary><div style="margin-top:8px;min-width:260px">'+pItems.map(function(x){return itemHtml(x.it,x.stage);}).join('')+'</div></details>';
  h+='<div class="card top"><h2><span class="tag me">👤 מה נדרש ממך</span>'+
    (openMine?'<button class="cnt2" onclick="toggleTop()" title="לחץ להצגת הרשימה">'+openMine+(showList?' ▴':' ▾')+'</button>':
      (anyMine?'<button class="cnt2 sentc" onclick="toggleTop()">'+(showList?'▴':'▾')+'</button>':''))+'</h2>'+
    (!anyMine?'<div class="empty">אין כרגע שום דבר שנדרש ממך 🎉</div>':
      (showList?allMine.map(function(x){return itemHtml(x.it,x.stage);}).join(''):
        '<div class="empty">'+(openMine?'יש '+openMine+' פריטים שמחכים לך. לחץ על המספר האדום כדי לראות אותם.':(allMine.length?'כל הפריטים נשלחו וממתינים לאישור היועץ. לחץ על החץ כדי לראות.':'הכול בוצע ✓. לחץ על החץ כדי לראות.'))+'</div>'))+'</div>';
  h+='<div class="sub" style="margin:16px 0 4px">שלבי התיק — לחץ על שלב כדי לראות מה קורה בו:</div>';
  h+='<div class="steps">'+stages.map(function(s,i){
    var st=stageState(i,curIdx);
    var open=(s.items||[]).filter(function(it){return it.owner==='client'&&!it.preview&&!it.done&&!S.sent[it.id];}).length;
    var style=st==='current'?' style="background:'+esc(s.color)+'"':'';
    return '<button class="step '+st+(s.id===sel.id?' sel':'')+'"'+style+' onclick="pick(\''+esc(s.id)+'\')">'+(st==='done'?'✓ ':'')+esc(s.label)+(open?'<span class="cnt">'+open+'</span>':'')+'</button>';
  }).join('')+'</div>';

  var selIdx=stages.indexOf(sel);
  var allItems=sel.items||[];
  var pv=allItems.filter(function(it){return it.preview;}); // משימות שיתחילו כשהתיק יגיע לשלב (מידע בלבד)
  var items=allItems.filter(function(it){return !it.preview;});
  // אם כבר בוצע חלק (יש שורות בטבלת הביצוע) — המשימה "בוצע סך" לא מוצגת, הטבלה מחליפה אותה
  if(d.execs&&d.execs.some(function(x){return x.rows&&x.rows.length;}))items=items.filter(function(it){return String(it.name||'').indexOf('בוצע סך')!==0;});
  var mine=items.filter(function(it){return it.owner==='client';});
  var adv=items.filter(function(it){return it.owner!=='client';});
  h+='<div class="card"><h2>'+esc(sel.label)+(selIdx===curIdx?' <span class="tag me">השלב הנוכחי</span>':'')+'</h2>';
  if(selIdx<curIdx&&!items.length)h+='<div class="empty">שלב זה הושלם ✓</div>';
  else if(!items.length&&!pv.length)h+='<div class="empty">אין כרגע דברים פתוחים בשלב הזה.</div>';
  if(sel.id==='appraisal')h+=apprHtml(d.summary);
  if(sel.id==='approval')h+=approvalsHtml(d.summary);
  h+='</div>';
  var mineDone=mine.filter(function(it){return it.done;});
  if(mineDone.length)h+='<div class="card"><h2><span class="tag me">👤 ממך</span></h2>'+mineDone.map(function(it){return '<div class="sr"><span>'+esc(it.name)+'</span><b>✓ בוצע</b></div>';}).join('')+'</div>';
  if(pv.length)h+='<div class="card"><h2><span class="tag adv">📅 יתחיל בשלב זה</span></h2><div class="sub" style="margin:0 0 6px">אלה המשימות שיפתחו כשהתיק יגיע לשלב. כרגע אין מה לעשות.</div>'+pv.map(function(it){return '<div class="sr"><span>'+esc(it.name)+'</span><b>'+(it.owner==='client'?'ממך':'היועץ')+'</b></div>';}).join('')+'</div>';

  if(sel.id==='appraisal'&&d.appr){
    var ap=d.appr,rw=function(l,v){return '<div class="sr"><span>'+esc(l)+'</span><b>'+v+'</b></div>';};
    var stx=function(x){return x==='done'?'✓ בוצע':'⏳ ממתין';};
    h+='<div class="card sum"><h2><span class="tag me">🏠 פרטי השמאות</span></h2>';
    if(ap.contact)h+=rw('איש קשר לתיאום ביקור',esc((ap.contact.name?ap.contact.name+' · ':'')+ap.contact.phone));
    else if(S.sent[ap.contactKey])h+=rw('איש קשר לתיאום ביקור','📤 נשלח ליועץ: '+esc(S.sent[ap.contactKey]));
    else if(ap.tenant)h+='<div class="item"><div class="nm">חסר טלפון של השוכר לתיאום ביקור השמאי. אפשר למלא בכרטיס "פרטי השוכר" בשלב ההגשה.</div></div>';
    else h+='<div class="item"><div class="nm">חסר איש קשר לתיאום ביקור השמאי. אפשר להזין כאן מספר טלפון:</div><div class="act" style="display:flex;gap:6px"><input id="ph_'+esc(ap.contactKey)+'" type="tel" inputmode="tel" dir="ltr" placeholder="05X-XXXXXXX" style="flex:1;min-width:0;padding:9px;border:1px solid var(--border);border-radius:8px;font-size:16px;font-family:inherit"><button class="send" onclick="sendPhone(\''+esc(ap.contactKey)+'\')">שלח</button></div></div>';
    if(ap.visit)h+=rw('תואם ביקור?',stx(ap.visit));
    if(ap.pay)h+=rw('הועבר תשלום?',stx(ap.pay));
    if(ap.ready)h+=rw('שמאות מוכנה?',stx(ap.ready));
    h+='</div>';
  }
  if(sel.id==='execution'&&d.execs&&d.execs.length){
    d.execs.forEach(function(x){
      var rem=Math.max(0,x.expected-x.total),over=x.expected>0&&x.total>x.expected;
      var dt=function(v){if(!v)return '';var p=String(v).split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:esc(v);};
      h+='<div class="card"><h2><span class="tag me">💰 ביצוע המשכנתא</span></h2><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:14px"><thead><tr style="color:var(--muted);text-align:right"><th style="padding:6px">סכום שבוצע</th><th style="padding:6px">תאריך</th><th style="padding:6px">הערה</th></tr></thead><tbody>'+
        (x.rows.length?x.rows.map(function(e){return '<tr style="border-top:1px solid var(--border)"><td style="padding:6px;font-weight:700">'+(e.amount?money(e.amount):'')+'</td><td style="padding:6px">'+dt(e.date)+'</td><td style="padding:6px">'+esc(e.notes)+'</td></tr>';}).join(''):'<tr><td colspan="3" style="padding:10px;color:var(--muted);text-align:center">עדיין לא בוצעו תשלומים.</td></tr>')+
        '</tbody></table></div>'+
        (x.expected?'<div class="sr"><span>סכום מקורי (אישור הבנק)</span><b>'+money(x.expected)+'</b></div>':'')+
        '<div class="sr"><span>סה"כ בוצע</span><b>'+money(x.total)+'</b></div>'+
        (x.expected?'<div class="sr"><span>'+(over?'חריגה מהאישור':(rem<=0?'בוצע במלואו':'יתרה שטרם בוצעה'))+'</span><b>'+(over||rem<=0?'✓':money(rem))+'</b></div>':'')+'</div>';
    });
  }
  if(sel.id==='submission'&&d.phones&&d.phones.length){
    h+='<div class="card"><h2><span class="tag me">📱 מספרי נייד</span></h2><div class="sub" style="margin:0 0 8px">חסר לנו מספר נייד. אפשר להזין כאן, וזה יישמר בתיק אצל היועץ.</div>'+d.phones.filter(function(p){return !p.done;}).concat(d.phones.filter(function(p){return p.done;})).map(function(p){
      if(p.done)return '<div class="sr"><span>'+esc(p.name||'לווה')+'</span><b>✓ בוצע</b></div>';
      if(S.sent[p.id])return '<div class="item sent"><div class="nm">'+esc(p.name||'לווה')+' — '+esc(S.sent[p.id])+'</div><div class="note">📤 נשלח ליועץ</div></div>';
      return '<div class="item"><div class="nm">'+esc(p.name||'לווה')+'</div><div class="act" style="display:flex;gap:6px"><input id="ph_'+esc(p.id)+'" type="tel" inputmode="tel" dir="ltr" placeholder="05X-XXXXXXX" style="flex:1;min-width:0;padding:9px;border:1px solid var(--border);border-radius:8px;font-size:16px;font-family:inherit"><button class="send" onclick="sendPhone(\''+esc(p.id)+'\')">שלח</button></div></div>';}).join('')+'</div>';
  }
  forms.forEach(function(g){
    var fi=fIdx(g.from),open=g.fields.some(function(f){return !f.done&&!S.sent[f.key];});
    if(!g.fields.every(function(f){return f.done;})&&(selIdx===fi||(selIdx>fi&&open)))h+='<div class="card"><h2><span class="tag me">📝 '+esc(g.title)+'</span></h2>'+formFieldsHtml(g,'fs_')+'</div>';
  });
  if(adv.length){
    adv=adv.filter(function(it){return !it.done;}).concat(adv.filter(function(it){return it.done;}));
    h+='<div class="card"><h2><span class="tag adv">🧑‍💼 בטיפול היועץ</span></h2>'+adv.map(function(it){
      return it.done?'<div class="sr"><span>'+esc(it.name)+'</span><b>✓ בוצע</b></div>':'<div class="item"><div class="nm">'+esc(it.name)+'</div></div>';}).join('')+'</div>';
  }
  if(d.doneCount){
    var done=d.done||[],groups={};
    done.forEach(function(x){(groups[x.stage]=groups[x.stage]||[]).push(x.name);});
    h+='<details class="done-box"><summary>✓ '+d.doneCount+' מסמכים כבר התקבלו ואושרו</summary>'+
      Object.keys(groups).map(function(g){
        return '<div class="dg">'+esc(g)+'</div>'+groups[g].map(function(n){return '<div class="di">✓ '+esc(n)+'</div>';}).join('');
      }).join('')+'</details>';
  }
  if(doneMine.length){
    h+='<details class="done-box"><summary>✓ '+doneMine.length+' משימות מילוי פרטים הושלמו</summary>'+doneMine.map(function(x){
      var f=x.it.form?x.it.form.fields.filter(function(q){return q.done;}).map(function(q){return q.label;}).join(', '):'';
      return '<div class="dg">'+esc(x.stage)+'</div><div class="di">✓ '+esc(x.it.name)+(f?' ('+esc(f)+')':'')+'</div>';
    }).join('')+'</details>';
  }
  document.getElementById('app').innerHTML=h;
}

// אותה ברכה לפי שעה כמו במיילים של ה-CRM
function greetByTime(){var h=new Date().getHours();if(h>=9&&h<11)return 'בוקר טוב';if(h>=11&&h<16)return 'צהריים טובים';if(h>=16&&h<19)return 'ערב טוב';return 'לילה טוב';}
function donutHtml(p){
  if(!p||!p.segs)return '';
  var colors=['#22c55e','#0ea5e9','#f97316','#8b5cf6'],start=0,bg='',fg='';
  p.segs.forEach(function(g,i){
    var len=Math.max(0,g.w-1),off=25-start;
    bg+='<circle cx="21" cy="21" r="15.9155" fill="none" stroke="'+colors[i%4]+'" stroke-opacity=".2" stroke-width="6" stroke-dasharray="'+len+' '+(100-len)+'" stroke-dashoffset="'+off+'"/>';
    var dn=g.w*g.f;if(g.f>0)fg+='<circle cx="21" cy="21" r="15.9155" fill="none" stroke="'+colors[i%4]+'" stroke-width="6" stroke-dasharray="'+Math.min(len,dn)+' '+(100-Math.min(len,dn))+'" stroke-dashoffset="'+off+'"/>';
    start+=g.w;
  });
  return '<svg viewBox="0 0 42 42" width="92" height="92" style="flex:0 0 auto">'+bg+fg+'<text x="21" y="23.5" text-anchor="middle" font-size="8" font-weight="700" fill="currentColor">'+p.pct+'%</text></svg>';
}
function legendHtml(p){
  if(!p||!p.segs)return '';
  var colors=['#22c55e','#0ea5e9','#f97316','#8b5cf6'];
  return '<div class="card" style="padding:10px 12px"><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'+p.segs.map(function(g,i){
    return '<div style="font-size:12px;line-height:1.3"><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:'+colors[i%4]+';margin-inline-end:5px"></span><b>'+esc(g.label)+'</b> <span style="color:var(--ok);font-weight:700">'+Math.round(g.w*g.f)+'/'+g.w+'%</span><div style="color:var(--muted);font-size:11px">'+esc(g.sub)+'</div></div>';}).join('')+'</div></div>';
}
function money(n){return Number(n).toLocaleString('he-IL')+' ₪';}
function approvalsHtml(s){
  if(!s||!s.approvals||!s.approvals.length)return '';
  return s.approvals.map(function(a){
    return '<div class="appr">✅ קיים אישור עקרוני'+(a.bank?' מבנק '+esc(a.bank):'')+(a.amount?' על סך '+money(a.amount):'')+'</div>';}).join('');
}
function apprHtml(s){
  if(!s||!s.appraised)return '';
  return '<div class="appr">✅ ב"ה אושר השמאות בסך '+money(s.appraised)+(s.appraiserName?' על ידי '+esc(s.appraiserName):'')+'</div>';
}
function summaryHtml(s){
  if(!s)return '';
  var rows=[];
  if(s.types&&s.types.length)rows.push(['סוג העסקה',s.types.join(' + ')]);
  if(s.valueRow&&s.valueRow.amount)rows.push([s.valueRow.label,money(s.valueRow.amount)]);
  if(s.amount)rows.push(['סכום מבוקש',money(s.amount)]);
  if(s.pct!=null)rows.push(['אחוז מימון',s.pct+'%']);
  if(s.banks&&s.banks.length)rows.push(['הוגש לבנק',s.banks.join(', ')]);
  var h='';
  if(rows.length)h+='<div class="card sum">'+rows.map(function(r){return '<div class="sr"><span>'+esc(r[0])+'</span><b>'+esc(r[1])+'</b></div>';}).join('')+'</div>';
  h+=approvalsHtml(s)+apprHtml(s);
  return h;
}
function formFieldsHtml(g,pre){
  var ord=g.fields.filter(function(f){return !f.done;}).concat(g.fields.filter(function(f){return f.done;}));
  return ord.map(function(f){
    if(f.done)return '<div class="sr"><span>'+esc(f.label)+'</span><b>✓ בוצע</b></div>';
    if(S.sent[f.key])return '<div class="sr"><span>'+esc(f.label)+'</span><b>📤 נשלח ליועץ</b></div>';
    var ty=f.type==='tel'?'tel':f.type==='email'?'email':f.type==='date'?'date':f.type==='id'?'tel':'text';
    return '<div class="note" style="margin-top:8px">'+esc(f.label)+'</div><div class="act" style="display:flex;gap:6px"><input id="'+pre+esc(f.key)+'" type="'+ty+'"'+(f.type!=='text'?' dir="ltr"':'')+' inputmode="'+(f.type==='id'||f.type==='tel'?'numeric':'text')+'" style="flex:1;min-width:0;padding:9px;border:1px solid var(--border);border-radius:8px;font-size:16px;font-family:inherit"><button class="send" onclick="sendField(\''+esc(f.key)+'\',\''+f.type+'\',\''+pre+'\')">שלח</button></div>';
  }).join('');
}
async function sendField(key,type,pre){
  if(S.busy)return;
  var el=document.getElementById(pre+key);var v=(el&&el.value||'').trim();
  if(type==='tel')v=v.replace(/[\s\-]/g,'');
  var ok=type==='tel'?/^(0\d{8,9}|\+972\d{8,9})$/.test(v):type==='email'?/^[^\s@<>]+@[^\s@<>]+\.[^\s@<>]+$/.test(v):type==='id'?/^\d{5,9}$/.test(v):type==='date'?/^\d{4}-\d{2}-\d{2}$/.test(v):(v.length>0&&v.length<=80&&!/[<>]/.test(v));
  if(!ok){alert('הערך לא תקין. בדוק ונסה שוב.');return;}
  S.busy=true;
  try{
    var r=await rpc('portal_set_input',{p_token:TOKEN,p_key:key,p_val:v});
    if(r&&typeof r==='object'&&r[key]!==undefined)S.sent=r;else throw new Error('x');
    render();
  }catch(e){alert('השליחה לא נשמרה. נסה שוב.');}
  S.busy=false;
}
function itemHtml(it,stage){
  var sent=!!S.sent[it.id];
  var chip=stage?'<span class="chip">'+esc(stage)+'</span>':'';
  if(it.form){
    if(it.done)return '<div class="sr"><span>'+chip+esc(it.name)+'</span><b>✓ בוצע</b></div>';
    return '<div class="item"><div class="nm">'+chip+esc(it.name)+'</div>'+formFieldsHtml(it.form,'ft_')+'</div>';
  }
  if(it.phone){
    if(it.done)return '<div class="sr"><span>'+chip+esc(it.name)+'</span><b>✓ בוצע</b></div>';
    if(sent)return '<div class="item sent"><div class="nm">'+chip+esc(it.name)+' — '+esc(S.sent[it.id])+'</div><div class="note">📤 נשלח ליועץ</div></div>';
    return '<div class="item"><div class="nm">'+chip+esc(it.name)+'</div><div class="act" style="display:flex;gap:6px"><input id="phT_'+esc(it.id)+'" type="tel" inputmode="tel" dir="ltr" placeholder="05X-XXXXXXX" style="flex:1;min-width:0;padding:9px;border:1px solid var(--border);border-radius:8px;font-size:16px;font-family:inherit"><button class="send" onclick="sendPhone(\''+esc(it.id)+'\',\'phT_\')">שלח</button></div></div>';
  }
  if(sent)return '<div class="item sent"><div class="nm">'+chip+esc(it.name)+'</div>'+
    '<div class="note">📤 נשלח ליועץ, ממתין לאישור היועץ לעדכון המסמך</div>'+
    '<div class="act"><button class="link" onclick="mark(\''+esc(it.id)+'\',false)">שלחתי בטעות — ביטול</button></div></div>';
  return '<div class="item"><div class="nm">'+chip+esc(it.name)+'</div>'+
    '<div class="act"><button class="send" onclick="mark(\''+esc(it.id)+'\',true)">✔ שלחתי ליועץ</button></div></div>';
}

async function sendPhone(id,pre){
  if(S.busy)return;
  var el=document.getElementById((pre||'ph_')+id);var v=(el&&el.value||'').replace(/[\s\-]/g,'');
  if(!/^(0\d{8,9}|\+972\d{8,9})$/.test(v)){alert('מספר לא תקין. לדוגמה: 0501234567');return;}
  S.busy=true;
  try{
    var r=await rpc('portal_set_input',{p_token:TOKEN,p_key:id,p_val:v});
    if(r&&typeof r==='object')S.sent=r;else throw new Error('x');
    render();
  }catch(e){alert('השליחה לא נשמרה. נסה שוב.');}
  S.busy=false;
}
function pick(id){S.sel=id;render();}
function toggleTop(){S.openTop=!S.openTop;render();}

async function mark(id,val){
  if(S.busy)return;S.busy=true;
  var prev=S.sent[id];
  if(val)S.sent[id]=new Date().toISOString();else delete S.sent[id];
  render();
  try{
    var r=await rpc('portal_set_sent',{p_token:TOKEN,p_req:id,p_sent:val});
    if(r&&typeof r==='object')S.sent=r;
  }catch(e){
    if(prev)S.sent[id]=prev;else delete S.sent[id];
    render();alert('העדכון לא נשמר. נסה שוב.');
  }
  S.busy=false;
}

load(true);
setInterval(function(){if(!S.busy&&!document.hidden)load(false);},30000);

// ===== צ'אט עם היועץ (סגנון וואטסאפ) =====
// במסך רחב הצ'אט פתוח תמיד בצד; במסך צר (טלפון) נפתח ונסגר בכפתור 💬
var CH={open:window.innerWidth>=1000,msgs:[],seen:0,busy:false};
function chWide(){return window.innerWidth>=1000;}
function chDock(){document.body.style.paddingLeft=chWide()&&CH.open?'430px':'';}
CH.wasWide=chWide();
// במובייל פתיחת המקלדת משנה את גובה החלון: לא לצייר מחדש (זה סוגר את המקלדת), רק כשעוברים בין מסך רחב לצר
window.addEventListener('resize',function(){var w=chWide();if(w===CH.wasWide)return;CH.wasWide=w;if(w&&!CH.open){CH.open=true;chMarkSeen();}chDock();chDraw(false);});
try{CH.seen=Number(localStorage.getItem('chatSeen_'+TOKEN))||0;}catch(e){}
function chTime(at){var d=new Date(at),t=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);return d.toDateString()===new Date().toDateString()?t:d.getDate()+'/'+(d.getMonth()+1)+' '+t;}
function chUnread(){return CH.msgs.filter(function(m){return m.sender!=='client'&&new Date(m.at).getTime()>CH.seen;}).length;}
function chMarkSeen(){var l=0;CH.msgs.forEach(function(m){if(m.sender!=='client')l=Math.max(l,new Date(m.at).getTime());});if(l>CH.seen){CH.seen=l;try{localStorage.setItem('chatSeen_'+TOKEN,String(l));}catch(e){}}}
function chDraw(scroll){
  var root=document.getElementById('chatRoot');if(!root||!S.data)return;
  chDock();
  var n=CH.open?0:chUnread();
  var fab='<button onclick="chToggle()" aria-label="צ\'אט עם היועץ" style="position:fixed;bottom:16px;left:16px;z-index:50;width:56px;height:56px;border-radius:50%;border:none;background:#075e54;color:#fff;font-size:26px;box-shadow:0 4px 14px rgba(0,0,0,.3);cursor:pointer">💬'+(n?'<span style="position:absolute;top:-4px;right:-4px;background:#dc2626;color:#fff;border-radius:999px;font-size:12px;min-width:20px;height:20px;line-height:20px;font-weight:700">'+n+'</span>':'')+'</button>';
  if(!CH.open){root.innerHTML=fab;return;}
  var keep=document.getElementById('chInp'),draft=keep?keep.value:'';
  var hadFocus=!!keep&&document.activeElement===keep,ss=keep?keep.selectionStart:0,se=keep?keep.selectionEnd:0;
  var list=document.getElementById('chList'),atBottom=scroll||!list||list.scrollHeight-list.scrollTop-list.clientHeight<60;
  root.innerHTML='<div style="position:fixed;bottom:0;left:0;z-index:60;width:min(100vw,420px);height:min(80vh,580px);background:#efeae2;border-radius:14px 14px 0 0;box-shadow:0 -4px 24px rgba(0,0,0,.3);display:flex;flex-direction:column">'+
    '<div style="background:#075e54;color:#fff;padding:10px 14px;border-radius:14px 14px 0 0;display:flex;justify-content:space-between;align-items:center;font-weight:700"><span>💬 צ\'אט עם היועץ</span>'+(chWide()?'':'<span style="cursor:pointer;font-size:20px" onclick="chToggle()">✕</span>')+'</div>'+
    '<div id="chList" style="flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:6px">'+
    (CH.msgs.length?CH.msgs.map(function(m){var mine=m.sender==='client';
      if(m.sender==='system'){
        var orig=CH.msgs.find(function(x){return x.id===m.reply;});
        // תגובה על ההודעה (כמו "השב" בוואטסאפ): ציטוט ההודעה המקורית ומתחתיה הטקסט
        return '<div style="align-self:flex-end;max-width:82%;background:#fff;border-radius:10px;padding:4px 4px 6px;box-shadow:0 1px 1px rgba(0,0,0,.12);font-size:15px;word-break:break-word">'+
          (orig?'<div style="background:rgba(7,94,84,.08);border-inline-start:4px solid #075e54;border-radius:6px;padding:4px 8px;margin-bottom:4px"><div style="font-size:12px;font-weight:700;color:#075e54">'+(orig.sender==='client'?'את/ה':'היועץ')+'</div><div style="font-size:13px;color:#54656f;white-space:pre-wrap">'+esc(String(orig.body).slice(0,90))+'</div></div>':'')+
          '<div style="padding:0 6px;white-space:pre-wrap">'+(m.kind==='done'?'✔ ':m.kind==='reminder'?'⏰ ':'📌 ')+esc(m.body)+'</div><div style="font-size:11px;color:#667781;text-align:left;padding:0 6px;margin-top:2px">'+chTime(m.at)+'</div></div>';
      }
      return '<div style="align-self:'+(mine?'flex-start':'flex-end')+';max-width:82%;background:'+(mine?'#d9fdd3':'#fff')+';border-radius:10px;padding:6px 10px;box-shadow:0 1px 1px rgba(0,0,0,.12);font-size:15px;white-space:pre-wrap;word-break:break-word">'+esc(m.body)+'<div style="font-size:11px;color:#667781;text-align:left;margin-top:2px">'+(m.react==='like'?'👍 ':m.react==='dislike'?'👎 ':'')+chTime(m.at)+'</div></div>';}).join(''):'<div style="text-align:center;color:#667781;font-size:14px;margin-top:30px">אפשר לכתוב ליועץ כאן.</div>')+'</div>'+
    '<div style="background:#f0f2f5;padding:8px;display:flex;gap:6px;align-items:flex-end"><textarea id="chInp" rows="1" maxlength="1000" placeholder="הקלד הודעה…" style="flex:1;resize:none;border:none;border-radius:18px;padding:9px 14px;font:inherit;font-size:16px;max-height:100px" onkeydown="if(event.key===\'Enter\'&&!event.shiftKey){event.preventDefault();chSend();}"></textarea><button onclick="chSend()" style="background:#075e54;color:#fff;border:none;border-radius:50%;width:42px;height:42px;font-size:18px;cursor:pointer">➤</button></div></div>';
  var inp=document.getElementById('chInp');inp.value=draft;
  if(hadFocus){inp.focus();try{inp.setSelectionRange(ss,se);}catch(e){}}
  var l2=document.getElementById('chList');if(atBottom)l2.scrollTop=l2.scrollHeight;
}
async function chPoll(){
  if(!S.data||document.hidden)return;
  try{
    var rows=await rpc('portal_msg_list',{p_token:TOKEN,p_since:null});
    if(!Array.isArray(rows))return;
    var changed=JSON.stringify(rows)!==JSON.stringify(CH.msgs);
    CH.msgs=rows;
    if(CH.open)chMarkSeen();
    if(changed||!document.getElementById('chatRoot').innerHTML)chDraw(false);
  }catch(e){}
}
function chToggle(){if(chWide())return;CH.open=!CH.open;if(CH.open)chMarkSeen();chDraw(true);}
async function chSend(){
  if(CH.busy)return;var inp=document.getElementById('chInp'),v=(inp&&inp.value||'').trim();if(!v)return;
  CH.busy=true;
  try{var r=await rpc('portal_msg_send',{p_token:TOKEN,p_body:v});if(!r||!r.id)throw new Error('x');CH.msgs.push(r);inp.value='';chDraw(true);}
  catch(e){alert('ההודעה לא נשלחה. נסה שוב.');}
  CH.busy=false;
}
setInterval(chPoll,15000);
setTimeout(chPoll,1500);
</script>
</body>
</html>
